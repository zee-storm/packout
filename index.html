/* Marking a lead. Each tap is a new row in lead_marks (db/040); the newest
   one is where the lead stands. One tap at a time, like the crew screen. */
let LEAD_BUSY = null, LEAD_ERR = "";
async function leadTap(act){
  const m = act.match(/^lead-(new|called|won|lost):(.+)$/);
  if(!m || !pastCanRead() || LEAD_BUSY) return;
  const [, mark, dayId] = m;
  LEAD_BUSY = dayId; LEAD_ERR = ""; render();
  const r = await crewWrite("POST", "lead_marks",
    { id: newId(), business_id: AUTH.business, market_day_id: dayId, mark }, true);
  if(r.ok){
    // Put it on the screen straight away; the next read confirms it.
    PAST.marks.unshift({ market_day_id: dayId, mark, marked_at: new Date().toISOString() });
  } else {
    LEAD_ERR = r.msg;
    if(r.unsure) await loadRealPast(true);
  }
  LEAD_BUSY = null;
  render();
}

/* ---------------------------------------------------------------
   The envelope check.

   Sellers take everything the shop owes them - pay, driving, gas, and
   anything they paid for out of their own pocket - straight out of that day's
   cash, and the rest goes in the envelope. They start with no change in the
   till (both confirmed by the owner, 17 Sep). So the envelope is simply the
   cash minus what they took, and that is the one number the app could never
   show: what should be in the safe tonight.

   On a card-heavy day the cash can be less than they are owed. Then the
   envelope is empty and the shop still owes the difference - never a minus.
   --------------------------------------------------------------- */
const ENV_DAYS = 14;
let ENV_OPEN = null;

// Was this day paid on the shop's usual $150 because nobody set a day rate?
function rateGuessed(sid, mid){
  const m = mid ? mkt(mid) : null;
  const over = (m && m.payBy) ? m.payBy[sid] : null;
  if(over && over.basePay != null) return false;
  const s = slr(sid);
  return !(s && typeof s.basePay === "number");
}

function envelopeFor(d){
  const other = (d.other_pays || []).reduce((a, o) => a + (Number(o.amount) || 0), 0);
  const cash = Number(d.cash) || 0;
  const gross = cash + (Number(d.card) || 0) + other + (Number(d.spent_from_till) || 0);
  const pay = sentDayPay(d, gross);
  const fronted = Number(d.fronted) || 0, driving = Number(d.driving_pay) || 0, gas = Number(d.car_gas) || 0;
  const owed = pay.amount + fronted + driving + gas;
  const market = mkt(d.market_id) || {};
  return {
    id: d.id, date: d.day_date, seller: nameOf(d) || "Nobody named",
    market: market.name || d.market_name || d.market_id,
    cash, gross, pay, owed, fronted, driving, gas,
    envelope: Math.max(0, cash - owed),
    short: Math.max(0, owed - cash),
    guessed: rateGuessed(d.seller_id, d.market_id),
    // A day with a fix asked or a second sheet may be about to change.
    fix: PAST.fixes.some(f => f.market_id === d.market_id && f.day_date === d.day_date),
    second: PAST.seconds.some(x => x.market_id === d.market_id && x.day_date === d.day_date)
  };
}

function envelopeLines(e){
  const money2 = n => "$" + n.toFixed(2);
  const rows = [["Cash taken", money2(e.cash)]];
  rows.push([e.pay.kind === "commission"
    ? "Their pay — " + crewPct(e.pay.rate) + "% of " + money(e.gross)
    : "Their pay — day rate", "−" + money2(e.pay.amount)]);
  if(e.fronted) rows.push(["Paid back, out of their pocket", "−" + money2(e.fronted)]);
  if(e.driving) rows.push(["Driving", "−" + money2(e.driving)]);
  if(e.gas) rows.push(["Gas", "−" + money2(e.gas)]);
  return `<div class="detail" style="margin-top:6px">
    ${rows.map(([k, v]) => `<div class="kv"><span class="kv-k">${k}</span><span class="kv-v">${v}</span></div>`).join("")}
    <div class="kv kv-total"><span class="kv-k">${e.short ? "Cash didn't cover it" : "Envelope should hold"}</span><span class="kv-v">${e.short ? money2(e.short) + " still owed" : money2(e.envelope)}</span></div>
  </div>`;
}

function envelopeRow(e){
  const open = ENV_OPEN === e.id;
  const chips = [
    e.short ? `<span class="pill pill-warn pill-wrap">cash covered ${money(e.cash)} — shop still owes ${money(e.short)}</span>` : "",
    e.fix ? `<span class="pill pill-warn pill-wrap">a fix was asked — may not match</span>` : "",
    e.second ? `<span class="pill pill-warn pill-wrap">a second sheet came in — may not match</span>` : "",
    e.guessed ? `<span class="pill pill-wrap">no day rate set — paid the usual ${money(BASE_PAY_DEFAULT)}</span>` : ""
  ].filter(Boolean).join(" ");
  return `<button class="crewrow" data-act="env-open:${esc(e.id)}" style="align-items:flex-start">
    <span class="crewrow-l">
      <span class="who">${esc(e.seller)} <span class="sub">· ${esc(e.market)}</span></span>
      <span class="sub">cash ${money(e.cash)} · they took ${money(e.owed)}</span>
      ${chips ? `<span class="chips" style="display:flex;flex-wrap:wrap;gap:5px;margin-top:4px">${chips}</span>` : ""}
      ${open ? envelopeLines(e) : ""}
    </span>
    <span class="kv-v">${"$" + e.envelope.toFixed(2)}</span>
  </button>`;
}

function owner_envelopes(){
  const head = note => `<div>
      <h1 class="page">Envelopes</h1>

    </div>`;

  if(AUTH.demo) return `<div class="pad stack">
    ${head("What should be in each envelope in the safe: the cash the seller took, less everything they were owed and took out of it.")}
    <div class="card card-pad stripe stripe-warn"><div class="lbl">Example</div>
      <p class="note" style="margin-top:6px">Nothing here is real in the look-around.</p></div>
    <div class="card"><div class="crewlist">
      <button class="crewrow" style="align-items:flex-start"><span class="crewrow-l">
        <span class="who">A seller <span class="sub">· A Saturday market</span></span>
        <span class="sub">cash $620 · they took $256</span></span><span class="kv-v">$364.00</span></button>
      <button class="crewrow" style="align-items:flex-start"><span class="crewrow-l">
        <span class="who">Another seller <span class="sub">· A Sunday market</span></span>

    </div></div>
  </div>`;

  if(!PAST.on) return `<div class="pad stack">
    ${head(PAST.failed ? "Couldn't get your days from the shop. It's usually signal - try again in a moment." : "Loading the last two weeks…")}
    ${PAST.failed ? `<button class="btn btn-quiet btn-sm" data-act="past-retry" style="width:auto">Try again</button>` : ""}
  </div>`;

  const from = localDay(daysAgo(ENV_DAYS));
  const days = PAST.days.filter(d => d.day_date >= from).map(envelopeFor);
  if(!days.length) return `<div class="pad stack">
    ${head("No days sent in the last two weeks, so there is nothing to check.")}

  const dates = [...new Set(days.map(d => d.date))].sort().reverse();
  const first = dates[0];

  const inSafe = top.reduce((a, d) => a + d.envelope, 0);
  const owedStill = top.reduce((a, d) => a + d.short, 0);
  const check = top.filter(d => d.fix || d.second).length;
  const dayName = s => new Date(s + "T12:00:00").toLocaleDateString(undefined, { weekday:"long", day:"numeric", month:"short" });

  return `<div class="pad stack">
    ${head("Sellers take what they're owed out of the day's cash and start with no change, so this is the whole envelope.")}
    <div>
      <div class="lbl">${esc(dayName(first))} · ${top.length} ${top.length === 1 ? "sheet" : "sheets"} in</div>
      <div class="row" style="gap:8px;margin-top:8px">
        <div class="card card-pad" style="flex:1"><div class="lbl">In the safe</div><div class="mid" style="margin-top:5px">${money(inSafe)}</div></div>
        <div class="card card-pad" style="flex:1"><div class="lbl">Still owed</div><div class="mid" style="margin-top:5px">${money(owedStill)}</div></div>
        <div class="card card-pad" style="flex:1"><div class="lbl">Worth a look</div><div class="mid" style="margin-top:5px">${check}</div></div>
      </div>
    </div>
    ${dates.map(dt => `<div class="card">
      <div class="card-hd"><h3>${esc(dayName(dt))}</h3><span class="pill">${money(days.filter(d => d.date === dt).reduce((a, d) => a + d.envelope, 0))} in the safe</span></div>
      <div class="crewlist">${days.filter(d => d.date === dt).map(envelopeRow).join("")}</div>
    </div>`).join("")}
    <div class="hint">Tap a seller to see how it was worked out, line by line - the same lines their own phone showed them.</div>
  </div>`;
}

function owner_people(){
  const rows = SELLERS.map(s=>{
    const days = HISTORY.filter(d=>d.sellerId===s.id);
    let vsSum=0, perHrSum=0, n=0;
    days.forEach(d=>{
      const st = dayStats(d);
      const peers = HISTORY.filter(x=>x.marketId===d.marketId);
      const peerAvg = peers.reduce((a,x)=>a+dayStats(x).sold,0)/peers.length;
      vsSum += (st.sold/peerAvg - 1);
      perHrSum += st.revenue/st.hrs;
      n++;
    });
    const vs = (vsSum/n)*100;
    const perHr = perHrSum/n;
    const y = yieldRecord(s.id);
    return { s, vs, perHr, per:y.per, fullPer:y.fullPer, n, days };
  }).sort((a,b)=>b.vs-a.vs);

  const body = rows.map(r=>`<tr>
    <td><div class="who">${esc(r.s.name)}</div><div class="sub">${r.n} market days</div></td>
    <td class="n"><span class="delta ${r.vs>=0?"up":"down"}">${r.vs>=0?"+":""}${r.vs.toFixed(0)}%</span></td>
    <td class="n">${money(r.perHr)}</td>
    <td class="n"><span class="pill ${r.per < r.fullPer*0.88 ? "pill-warn":"pill-good"}">${money2(r.per)}</span></td>
  </tr>`).join("");

  return `<div class="pad stack">
    <div>
      <h1 class="page">People</h1>
      <p class="note" style="margin-top:5px">Each person is measured against what that market normally does \u2014 not against each other. A big market doesn't make you a better seller.</p>
    </div>
    ${crewBlock()}
    <div class="card card-pad stripe stripe-warn">
      <div class="lbl">Sample figures</div>
      <p class="note" style="margin-top:6px">Every number on this screen is worked from made-up days,
      so you can see what it does. It turns into your own the moment enough real days have been
      sent in. <b>Nothing here is a fact about anybody yet.</b></p>
    </div>
    <div class="card">
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>Seller</th><th class="n">vs market avg</th><th class="n">$/hour</th><th class="n">$ per pack</th></tr></thead>
          <tbody>${body}</tbody>
        </table>
      </div>
    </div>
    ${(()=>{
      const sw = bestSwap();
      if(!sw || sw.gain < 40) return "";
      const aS=slr(sw.a.sellerId), bS=slr(sw.b.sellerId), aM=mkt(sw.a.marketId), bM=mkt(sw.b.marketId);
      if(!aS || !bS || !aM || !bM) return "";
      const pct = (s,m)=>{ const v=Math.round(perfPct(s,m)*100); return (v>0?"+":v<0?"\u2212":"")+Math.abs(v)+"%"; };
      // whoever gains more by moving to the other's market goes first
      return `<div class="insight">
        <div class="insight-mark">Swap these two</div>
        <p>At <b>${esc(bM.name)}</b>, ${esc(aS.name)} runs <b>${pct(aS.id,bM.id)}</b> against that market's own average and
        ${esc(bS.name)} runs <b>${pct(bS.id,bM.id)}</b>. Today they're booked the other way around &mdash;
        ${esc(bS.name)} has ${esc(bM.name)} and ${esc(aS.name)} has ${esc(aM.name)}.
        Trading them is worth about <b>${money(sw.gain)}</b> today.</p>
      </div>`;
    })()}
    <div class="card">
      <div class="card-hd"><h3>This week's pay</h3><span class="pill">day rate or commission, whichever is more</span></div>
      <div class="card-pad">
        ${SELLERS.map(s=>{
          const wk = HISTORY.filter(d=>d.sellerId===s.id).slice(-2);
          const amt = wk.reduce((a,d)=>a+dayStats(d).commission,0);
          return `<div class="kv"><span class="kv-k">${esc(s.name)} <span class="sub">\u2014 ${wk.length} days</span></span><span class="kv-v">${money2(amt)}</span></div>`;
        }).join("")}
        <div class="kv kv-total"><span class="kv-k">Total payroll</span><span class="kv-v">${money2(SELLERS.reduce((a,s)=>a+HISTORY.filter(d=>d.sellerId===s.id).slice(-2).reduce((b,d)=>b+dayStats(d).commission,0),0))}</span></div>
      </div>
    </div>
    <div class="hint">Each seller sees their own pay worked out the same way on their own phone, so there's nothing to argue about on payday.</div>
  </div>`;
}

function owner_markets(){
  const rows = MARKETS.map(m=>{
    const days = HISTORY.filter(d=>d.marketId===m.id);
    const st = days.map(dayStats);
    const rev = st.reduce((a,x)=>a+x.revenue,0)/st.length;
    const perHr = st.reduce((a,x)=>a+x.perHr,0)/st.length;
    const recent = st.slice(-3).reduce((a,x)=>a+x.revenue,0)/3;
    const older  = st.slice(0,3).reduce((a,x)=>a+x.revenue,0)/3;
    const trend = (recent/older-1)*100;
    const hrs = hoursWorked(m);
    const vc = vanCostFor(m.id);
    const dayCost = feeOf(m) + vc.gas;
    const soloCost = feeOf(m) + gasFor(m.driveMin);   // what it would cost on its own trip
    const perHrTrue = (rev - dayCost)/hrs;
    return { m, rev, perHr:perHrTrue, trend, hrs,
             rideCost:vc.ride, gas:vc.gas, dayCost, soloCost,
             shareNames:vc.shareNames, rider:vc.rider,
             soloPerHr:(rev - soloCost)/hrs,
             sold: st.reduce((a,x)=>a+x.sold,0)/st.length };
  }).sort((a,b)=>b.perHr-a.perHr);

  const best = rows[0], worst = rows[rows.length-1];

  const body = rows.map(r=>`<tr data-market="${r.m.id}" style="cursor:pointer">
    <td><div class="who" style="color:var(--accent)">${esc(r.m.name)}</div><div class="sub">${esc(r.m.day)} \u00B7 ${r.m.driveMin}min drive</div></td>
    <td class="n">${money(r.rev)}</td>
    <td class="n">${money(r.dayCost)}${r.shareNames.length?`<div class="sub">shares a van</div>`:""}</td>
    <td class="n">${r.hrs.toFixed(1)}</td>
    <td class="n" style="font-weight:600">${money(r.perHr)}</td>
    <td class="n"><span class="delta ${r.trend>=0?"up":"down"}">${r.trend>=0?"\u25B2":"\u25BC"} ${Math.abs(r.trend).toFixed(0)}%</span></td>
  </tr>`).join("");

  return `<div class="pad stack">
    <div>
      <h1 class="page">Markets</h1>
      <p class="note" style="margin-top:5px">Sorted by what each one actually pays per hour worked \u2014 including packing, driving both ways, setup and teardown. Not just the four hours of selling.</p>
    </div>
    <div class="card card-pad stripe stripe-warn">
      <div class="lbl">Sample figures</div>
      <p class="note" style="margin-top:6px">Every number on this screen is worked from made-up days,
      so you can see what it does. It turns into your own the moment enough real days have been
      sent in. <b>Nothing here is a fact about anybody yet.</b></p>
    </div>
    <div class="tiles">
      <div class="tile"><div class="lbl">Best per hour</div><div class="mid">${money(best.perHr)}</div><div class="tile-sub">${esc(best.m.name)}</div></div>
      <div class="tile"><div class="lbl">Worst per hour</div><div class="mid">${money(worst.perHr)}</div><div class="tile-sub">${esc(worst.m.name)}</div></div>
      <div class="tile"><div class="lbl">Weekly revenue</div><div class="mid">${money(rows.reduce((a,r)=>a+r.rev,0))}</div><div class="tile-sub">${MARKETS.length} slots a week</div></div>
      <div class="tile"><div class="lbl">Weekly costs</div><div class="mid">${money(rows.reduce((a,r)=>a+r.dayCost,0))}</div><div class="tile-sub">stalls, gas, rides</div></div>
    </div>
    <div class="card">
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>Market</th><th class="n">Avg day</th><th class="n">Costs</th><th class="n">Hours</th><th class="n">Per hour</th><th class="n">Trend</th></tr></thead>
          <tbody>${body}</tbody>
        </table>
      </div>
    </div>
    ${(()=>{
      const run = VAN_RUNS[0];
      if(!run) return "";
      const all = [run.driver].concat(run.riders);
      const soloGas = all.reduce((a,id)=>a+gasFor(mkt(id).driveMin), 0);
      const saved   = soloGas - gasFor(mkt(run.driver).driveMin);
      const riderNames = run.riders.map(id=>mkt(id).name).join(" and ");
      const driverName = mkt(run.driver).name;
      return `<div class="insight">
        <div class="insight-mark">These two go together</div>
        <p><b>${esc(driverName)} and ${esc(riderNames)} go out on one van.</b>
        Whoever is going furthest drives and drops the other off on the way, so the shop buys that gas once
        &mdash; two separate trips would burn about <b>${money(saved)}</b> more every time, which is why
        both markets look cheaper to run than they would alone.
        If you ever drop ${esc(driverName)}, ${esc(riderNames)} needs its own trip
        &mdash; look at it again before you keep it.</p>
      </div>`;
    })()}

    <div class="insight">
      <div class="insight-mark">Worth a look</div>
      <p><b>${esc(worst.m.name)} takes ${worst.hrs.toFixed(1)} hours door to door and pays ${money(worst.perHr)} an hour</b> once the ${money(worst.dayCost)} it costs to run comes out${worst.rideCost?" \u2014 stall, gas and the $20 driver run":" \u2014 stall and gas"}, against ${money(best.perHr)} at ${esc(best.m.name)}. On revenue alone it looks fine, which is why it's easy to miss.</p>
    </div>
    <div class="hint">Costs here are what the <b>market</b> takes: stall fee and gas. Driver pay, commission and anything the crew fronts are payroll &mdash; those sit on the Today screen under what the shop owes.</div>
  </div>`;
}

const OWNER_SCREENS = { today:owner_today, envelopes:owner_envelopes, leads:owner_leads, send:owner_send, people:owner_people, markets:owner_markets };

/* The sticky footer is fixed, so it sits outside the flow and reserves no room
   on its own. Its height changes with the screen -- one button on Today, two
   stacked once you are at the market -- so any fixed padding is either wasted
   space or a clipped last line. Measure the footer we actually rendered. */
function syncFootSpace(){
  const bar = $("footHost").firstElementChild;
  $("app").style.paddingBottom = bar ? (bar.offsetHeight + 14) + "px" : "";
}


/* Drawing the screen without throwing away what is already on it.

   Every redraw used to replace the whole screen. The screen redraws when a
   box loses focus - and tapping a button is what makes a box lose focus. So
   the redraw ran in the middle of the tap, the button under the thumb was
   swapped for a new one, and the tap landed on nothing. Worse, the new button
   was often "Send it in": the seller tapped once, nothing happened, tapped
   again, and sent a day they had not looked at. It swallowed first taps on
   nearly every screen, and closed the keyboard when moving between boxes.

   Now a redraw builds the new screen off to the side and brings the live one
   into line with it: text and attributes are updated in place, and an element
   is only replaced when it has actually become a different thing. A button
   that is still the same button stays under the thumb and gets the tap. A box
   that is being typed in is never touched. */
const MORPH_KEYS = ["id","data-p","data-set","data-act","data-go","data-tab","data-market","data-me","data-cover","data-exp","data-pay","data-expsrc","data-v","type"];
function sameThing(a, b){
  if(a.nodeType !== b.nodeType || a.nodeName !== b.nodeName) return false;
  return a.nodeType !== 1 || MORPH_KEYS.every(k => a.getAttribute(k) === b.getAttribute(k));
}
function morphInto(host, html){
  const t = document.createElement("template");
  t.innerHTML = html;
  morphChildren(host, t.content);
}
function morphChildren(from, to){
  const next = [...to.childNodes];
  let cur = from.firstChild;
  for(const nb of next){
    if(!cur){ from.appendChild(nb); continue; }
    const after = cur.nextSibling;
    if(sameThing(cur, nb)) morphNode(cur, nb);
    else from.replaceChild(nb, cur);
    cur = after;
  }
  while(cur){ const after = cur.nextSibling; from.removeChild(cur); cur = after; }
}
function morphNode(a, b){
  if(a.nodeType !== 1){ if(a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue; return; }
  for(const at of [...b.attributes]) if(a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value);
  for(const at of [...a.attributes]) if(!b.hasAttribute(at.name)) a.removeAttribute(at.name);
  const busy = a === document.activeElement;
  const tag = a.nodeName;
  if(tag === "INPUT"){
    if(busy || a.type === "file") return;
    if(a.type === "checkbox" || a.type === "radio") a.checked = b.hasAttribute("checked");
    else { const v = b.getAttribute("value") ?? ""; if(a.value !== v) a.value = v; }
    return;
  }
  if(tag === "TEXTAREA"){
    if(!busy){ const v = b.textContent; if(a.value !== v) a.value = v; }
    return;
  }
  if(tag === "SELECT"){
    const opt = b.querySelector("option[selected]") || b.querySelector("option");
    const want = opt ? (opt.getAttribute("value") ?? opt.textContent) : "";
    morphChildren(a, b);
    if(!busy && a.value !== want) a.value = want;
    return;
  }
  morphChildren(a, b);
}

/* Which seller screen is showing, and its footer. */
function sellerScreen(){
  const enrolled = AUTH.person || AUTH.demo;
  return !enrolled          ? [scr_whoami, null]
       : !S.me              ? [scr_pickdemo, null]
       : (!myMarketToday() && !dayInHand()) ? [scr_dayoff, null]
       : (SELLER_SCREENS[S.screen] || SELLER_SCREENS.today);
}
const footHtml = ft => ft ? `<div class="sticky-foot"><div class="sticky-foot-in">${ft()}</div></div>` : "";

/* The footer, kept current while typing. It says what is left to do; it used
   to go on saying "1 left" after the last box was filled, until the box lost
   focus - which was the very tap meant for the button. */
function syncFooter(){
  if(S.mode !== "seller") return;
  const [, ft] = sellerScreen();
  morphInto($("footHost"), footHtml(ft));
  syncFootSpace();
}

function render(){
  const app = $("app"), foot = $("footHost"), tabs = $("tabsHost");

  /* Loud on purpose. The one thing a sandbox must never do is look like the
     real app - that is how a practice day ends up in the real books. */
  const th = $("testHost");
  /* The look-around is marked the same way, on every screen, with the way out.
     It used to look exactly like the real app until a day was already counted,
     and nothing on it led back to typing a code: a seller who opened the link
     before their code came, then worked a real market in it, had a day that
     never reached the shop and no way to send it. */
  if(th) morphInto(th, TEST_MODE ? `<div class="testbar">
      <span><b>TEST KITCHEN</b> &middot; nothing here is real${
        PRETEND_DAY ? ` &middot; pretending it is <b>${esc(DAY_FULL[PRETEND_DAY])}</b>` : ""}</span>
      <button data-act="test-reset">Wipe and start again</button>
    </div>` : AUTH.demo ? `<div class="testbar demobar">
      <span><b>JUST HAVING A LOOK</b> &middot; nothing here is sent</span>
      <button data-act="leave-demo">I have a code</button>
    </div>` : "");
  // Nobody lands on the owner screens without being an owner, however the
  // phone got there - an old saved state, or a tap from before this rule.
  if(S.mode==="owner" && !canSeeOwner()){ S.mode="seller"; S.marketOpen=null; }
  document.querySelector(".modesw").hidden = !canSeeOwner();
  $("m-seller").setAttribute("aria-pressed", S.mode==="seller");
  $("m-owner").setAttribute("aria-pressed", S.mode==="owner");
  $("brandsub").textContent = S.mode==="seller" ? "Seller" : "Owner";

  if(S.mode==="owner"){
    app.className = "shell wide";
    morphInto(tabs, `<div class="tabs"><div class="tabs-in">${
      OWNER_TABS.map(([k,l])=>`<button data-tab="${k}" aria-pressed="${S.tab===k}">${l}</button>`).join("")
    }</div></div>`);
    morphInto(app, S.marketOpen ? owner_market(S.marketOpen) : OWNER_SCREENS[S.tab]());
    morphInto(foot, "");
  } else {
    app.className = "shell";
    morphInto(tabs, "");
    const [body, ft] = sellerScreen();
    morphInto(app, body());
    morphInto(foot, footHtml(ft));
  }
  syncFootSpace();
  save();
}

// Orientation change and the on-screen keyboard both resize the footer.
window.addEventListener("resize", syncFootSpace);

document.addEventListener("click", e => {
  if(e.target.closest("a")) return;          // let phone and text links through

  const opener = e.target.closest("[data-market]");
  if(opener && !e.target.closest("button") && canSeeOwner()){
    S.marketOpen = opener.dataset.market; render(); window.scrollTo(0,0); return;
  }

  const t = e.target.closest("button");
  if(!t) return;
  // The owner's crew screen. Every one of these talks to the shop, so they
  // answer later; the button says what it is doing in the meantime.
  if(t.dataset.act && t.dataset.act.indexOf("crew-") === 0){ crewTap(t.dataset.act); return; }
  if(t.dataset.act==="test-reset"){
    if(!TEST_MODE) return;
    if(!confirm("Wipe every test day and start again?\n\nOnly touches Test Kitchen. Real days are not affected.")) return;
    resetTest();
    return;
  }

  if(t.dataset.act==="market-close"){ S.marketOpen=null; render(); window.scrollTo(0,0); return; }
  if(t.dataset.act==="past-retry"){ loadRealPast(true).then(()=>render()); render(); return; }
  if(t.dataset.act && t.dataset.act.indexOf("lead-") === 0){ leadTap(t.dataset.act); return; }
  if(t.dataset.act && t.dataset.act.indexOf("env-open:") === 0){
    const id = t.dataset.act.slice(9);
    ENV_OPEN = ENV_OPEN === id ? null : id; render(); return;
  }

  if(t.id==="m-seller"){ S.mode="seller"; S.marketOpen=null; render(); return; }
  if(t.id==="m-owner"){
    if(!canSeeOwner()) return;
    S.mode="owner"; render();
    loadRealDays().then(()=>{ if(S.mode==="owner") render(); });
    if(S.tab==="people") loadCrew().then(()=>{ if(S.mode==="owner" && S.tab==="people") { render(); if(CREW_UI.open) crewShowPanel(); } });
    if(S.tab==="leads" || S.tab==="envelopes") loadRealPast().then(()=>{ if(S.mode==="owner" && (S.tab==="leads" || S.tab==="envelopes")) render(); });
    return;
  }

  const tab = t.dataset.tab;
  if(tab && canSeeOwner()){
    S.tab=tab; S.marketOpen=null; render(); window.scrollTo(0,0);
    if(tab==="today") loadRealDays().then(()=>{ if(S.mode==="owner" && S.tab==="today") render(); });
    if(tab==="people") loadCrew().then(()=>{ if(S.mode==="owner" && S.tab==="people") { render(); if(CREW_UI.open) crewShowPanel(); } });
    if(tab==="leads" || tab==="envelopes") loadRealPast().then(()=>{ if(S.mode==="owner" && (S.tab==="leads" || S.tab==="envelopes")) render(); });
    return;
  }

  const go = t.dataset.go;
  if(go){
    if(go==="loadout"){
      if(onlyLooked(S) && startOverIfNewDay()) return;   // never stamp yesterday on a new day
      beginDay();
      P_IDS.forEach(p=>{ if(S.opening[p]==null) S.opening[p]=MY_REC.byProduct[p].qty; });
    }
    if(go==="market" && !S.packedAt){
      S.packedAt = new Date().toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
    }
    if(go==="result"){
      beginDay();                          // a day reached some other way still gets its stamp
      S.status="closed"; S.endedAt=Date.now();
      if(!S.submittedAt) S.submittedAt = new Date().toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
      if(!S.submittedBy) S.submittedBy = S.me;
      if(!S.submittedByName) S.submittedByName = (slr(S.submittedBy) || {}).name || (AUTH.person === S.submittedBy ? AUTH.name : null) || null;
      // Fire and forget: a market with no signal must not block the screen.
      sendDay().then(() => render());
    }
    S.screen = go; render(); window.scrollTo(0,0); return;
  }

  const adj = t.dataset.adj;
  if(adj){
    const p = t.dataset.p, d = Number(t.dataset.d);
    /* A thumb brushing "–" on a flavour nobody has counted yet used to answer it
       as 0 back - everything sold - and the footer moved on to the next flavour.
       An uncounted flavour stays uncounted until a number is actually put in. */
    const uncounted = S[adj][p] === undefined || S[adj][p] === null || S[adj][p] === "";
    if(adj === "closing" && uncounted && d < 0){
      const box = document.querySelector(`[data-set='closing'][data-p='${p}']`);
      if(box){ box.classList.remove("flash"); void box.offsetWidth; box.classList.add("flash"); }
      return;
    }
    const cur = S[adj][p] ?? (adj==="opening" ? MY_REC.byProduct[p].qty : 0);
    S[adj][p] = Math.max(0, cur + d);
    render(); return;
  }

  if(t.dataset.act==="retry-send"){
    sendDay().then(()=>render());
    toast("Trying…"); return;
  }
  if(t.dataset.act==="addpay"){
    S.otherPays = (S.otherPays||[]).concat([{how:"", amount:""}]);
    render(); return;
  }
  if(t.dataset.paydel!==undefined){
    S.otherPays.splice(Number(t.dataset.paydel), 1);
    render(); return;
  }

  if(t.dataset.act==="redeem"){
    // A code that is right but punctuated wrong should still work - see codeCandidates.
    const tries = codeCandidates(S.codeTyped);
    if(!tries.length){ S.codeError="Type the code Nawid gave you."; render(); return; }
    S.codeError = "Checking\u2026"; render();
    (async () => {
      let res = null;
      for(const c of tries){
        res = await redeemCode(c);
        if(res.ok || !res.invalid) break;     // signed in, or no signal: stop there
      }
      // Nothing that looks like a code was in there: say so, before sending them to Nawid.
      if(!res.ok && res.invalid && tries[0].length !== 6)
        res.msg = "A code is 6 letters and numbers \u2014 check what you typed. If it still doesn't work, ask Nawid for a new one.";
      return res;
    })().then(res => {
      if(res.ok){
        takePhone(AUTH.person); S.codeError = null; S.codeTyped = "";
        MY_MARKET = pickMyMarket(); MY_REC = recommendMarket(MY_MARKET.id);
        // A counted day still waiting to go up stays where it is, and goes now.
        const waiting = S.status === "closed" && S.submittedAt && !S.sentAt;
        if(!waiting) S.screen = "today";
        save();
        if(waiting) sendDay().then(() => render());
        if(waitingDays().length) sendOutbox().then(() => render());
        /* Whether this phone is the sandbox is settled on the app's first
           line, before any of this ran. Signing into it has to start the app
           over, or the stripe would be missing and a test day would look
           exactly like a real one. */
        /* Start over whenever this sign-in moves the phone into or out of the
           sandbox. The stripe and the pretend-day switch are settled on the
           app's first line: signing into the sandbox without a restart would
           make a test day look real, and signing into the real business
           while still in test mode would let a real day take a pretend date. */
        const nowTest = /test/i.test(AUTH.businessName || "");
        /* Signing in also means this person's markets and pay, from the shop -
           then the app starts over with them. Without an answer it still starts
           over, and says the markets haven't loaded rather than "nothing on". */
        S.codeError = "Getting your markets\u2026"; render();
        try{ localStorage.removeItem(CATALOGUE_KEY); }catch(e){}
        Promise.race([refreshCatalogue(), new Promise(r => setTimeout(r, 8000))]).finally(() => {
          location.replace(nowTest !== TEST_MODE && !nowTest ? location.pathname : location.pathname + location.search);
        });
        return;
      } else {
        S.codeError = res.msg;
      }
      render(); window.scrollTo(0,0);
    });
    return;
  }
  if(t.dataset.act==="code-anyway"){ S.codeAnyway = true; render(); return; }
  if(t.dataset.act==="demo"){
    AUTH.demo = true; saveAuth(); S.codeError=null;
    // Only ever the made-up people in the look-around.
    if(CATALOGUE.source !== "demo"){ save(); location.replace(location.pathname); return; }
    render(); window.scrollTo(0,0); return;
  }
  if(t.dataset.act==="install-app"){
    const offer = INSTALL_OFFER; INSTALL_OFFER = null;
    if(!offer) return;
    try{ offer.prompt(); }catch(e){}
    Promise.resolve(offer.userChoice).catch(() => null).then(() => render());
    render(); return;
  }
  if(t.dataset.act==="catalogue-retry"){
    toast("Trying\u2026");
    refreshCatalogue().then(ok => { if(!ok) toast(AUTH.signinBroken ? "Your code has stopped working \u2014 type a new code" : "Still no answer from the shop"); render(); });
    return;
  }
  if(t.dataset.act==="leave-demo"){
    /* Back to the code screen. The look-around day is let go, not carried in:
       carried, it would be sent to the shop as a real day the moment the code
       went in. Anything it set aside on the phone goes with it. */
    if(!confirm("Leave the look-around and type your code?\n\nNothing from the look-around is kept or sent.")) return;
    delete AUTH.demo; saveAuth();
    saveShelf(loadShelf().filter(e => e.business));
    saveFixes(loadFixes().filter(f => f.business_id));
    S = JSON.parse(JSON.stringify(BLANK)); save();
    MY_MARKET = pickMyMarket(); MY_REC = recommendMarket(MY_MARKET.id);
    render(); window.scrollTo(0,0); return;
  }

  if(t.dataset.me){
    const same = (S.dayOwner || S.submittedBy) === t.dataset.me;
    takePhone(t.dataset.me);
    MY_MARKET = pickMyMarket();
    MY_REC = recommendMarket(MY_MARKET.id);
    if(!same) S.screen = "today";
    render(); window.scrollTo(0,0); return;
  }
  if(t.dataset.act==="shelf-resume"){
    /* Take a day that was packed and never counted up back onto the phone, to
       count it up. Never over a day already in hand - that would lose today's
       count. It keeps its own market and date; beginDay() will not restamp it. */
    if(S.startedAt && !S.sentAt){ toast("Send the day you're on first"); return; }
    const list = loadShelf();
    const e = list.find(x => x.id === t.dataset.shelf);
    if(!e || !e.day) return;
    const back = Object.assign(JSON.parse(JSON.stringify(BLANK)), e.day);
    delete back.archiveMe; delete back.parkMe;
    back.mode = S.mode; back.tab = S.tab; back.me = S.me;
    back.shelfId = e.id;
    /* Its sheet goes in under an id of its own, so a refused send can tell this
       sheet from one the same seller already sent for that market from another
       phone. Matching on the seller's name alone called that "already in",
       marked this day sent, and its counts never landed. */
    back.dayRowId = newId();
    // Taken up again now, so the next open does not see an abandoned day and
    // put it straight back.
    back.startedAt = Date.now();
    back.screen = "closeout";
    if(!saveShelf(list.filter(x => x.id !== e.id))) return;
    S = back; save();
    MY_MARKET = pickMyMarket(); MY_REC = recommendMarket(MY_MARKET.id);
    render(); window.scrollTo(0,0); return;
  }
  if(t.dataset.act==="outbox-retry"){
    toast("Trying\u2026");
    sendOutbox().then(() => { toast(waitingDays().length ? "Still not at the shop yet" : "It's at the shop now"); render(); });
    return;
  }

  if(t.dataset.act==="resignin"){
    /* Back to the code screen with the day still on the phone. The dead
       sign-in is dropped completely, so the new code starts a fresh one
       instead of trying to renew what is already gone. */
    AUTH.person=null; AUTH.name=null; AUTH.business=null; AUTH.role=null;
    AUTH.businessName=null; AUTH.token=null; AUTH.refresh=null; AUTH.expires=null;
    AUTH.signinBroken=false; saveAuth();
    S.sendError = null; S.codeError = null; S.codeTyped = ""; save();
    render(); window.scrollTo(0,0); return;
  }

  if(t.dataset.act==="switch-me"){
    /* This signs the phone out, and codes are single use - so the way back in
       is a new code from Nawid, which on a market morning he may not be awake
       to send. It sat on the seller's own market screen reading "<name> · not
       you?", one tap, no warning. Somebody curious about their own app locks
       themselves out of the day they are about to work.

       Handing the phone to someone else is a real thing, so the button stays.
       It asks first. */
    if(!AUTH.demo && AUTH.person){
      const who = AUTH.name || "this phone";
      const ok = confirm("Sign " + who + " out of this phone?\n\n"
        + "You will need a new code from Nawid before you can use it again. "
        + "Only do this if somebody else is taking the phone.");
      if(!ok) return;
    }
    S.me = null;
    if(!AUTH.demo){ AUTH.person=null; AUTH.name=null; AUTH.business=null; AUTH.role=null; AUTH.businessName=null; saveAuth(); }
    /* The people and rota this phone was given leave with the person: a phone
       handed on must not carry them, and the look-around must not show them. */
    if(!AUTH.demo){ try{ localStorage.removeItem(CATALOGUE_KEY); }catch(e){} save(); location.replace(location.pathname); return; }
    /* Leaving the sandbox has to start the app over. Whether this phone is
       the sandbox is decided on the app's first line, so without a fresh
       start the orange stripe - and the pretend-day switch with it - stayed
       on after signing out. Sign straight into the real business from there
       and a real day could be filed under a pretend date. Dropping ?day= from
       the address goes with it. */
    if(TEST_MODE){ save(); location.replace(location.pathname); return; }
    render(); window.scrollTo(0,0); return;
  }

  const sold = t.dataset.sold;
  if(sold){ S.soldOut = sold==="yes"; render(); return; }

  const act = t.dataset.act;
  if(act==="toggle"){ const f=t.dataset.flag; S[f]=!S[f]; render(); return; }
  if(t.dataset.cover !== undefined){
    if(S.startedAt && !onlyLooked(S)){ toast("Send the day you're on first"); return; }
    const id = t.dataset.cover;
    const own = MARKETS.find(m => m.day === DAYS[TODAY.getDay()] && m.crew.includes(S.me));
    S.coverMarket = id && (!own || own.id !== id) ? { id, forDay: todayStamp() } : null;
    /* Only looked at the packing list so far: that look was for the other
       market, so it goes - including its counts - and the new market fills in. */
    if(onlyLooked(S) && S.startedAt){
      S.startedAt = null; S.dayOf = null; S.marketId = null; S.dayOwner = null; S.opening = {};
    }
    S.showCover = false; S.screen = "today";
    MY_MARKET = pickMyMarket(); MY_REC = recommendMarket(MY_MARKET.id);
    save(); render(); window.scrollTo(0,0); return;
  }
  const pk = t.dataset.packer;
  if(pk){ S.packedBy = pk; S.showPacker = false; render(); return; }
  if(act==="jump"){
    const el = document.querySelector(t.dataset.sel);
    if(el){
      el.scrollIntoView({behavior:"smooth", block:"center"});
      el.classList.remove("flash");
      void el.offsetWidth;                 // restart the animation
      el.classList.add("flash");
      if(el.focus) setTimeout(()=>{ try{ el.focus({preventScroll:true}); }catch(e){} }, 380);
    }
    return;
  }
  if(act==="note-save"){
    const b = $("noteBox");
    NOTE = b ? b.value : NOTE;
    NOTE_AT = new Date().toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
    saveNote(); buzz(20); toast(NOTE.trim()?"Saved on this phone":"Message cleared"); render(); return;
  }
  if(act==="note-clear"){ NOTE=""; saveNote(); toast("Message cleared"); render(); return; }
  if(act==="exp-add"){
    if(!Array.isArray(S.expenses)) S.expenses=[];
    /* No default. These two are opposites - till cash means the register is
       light by that much, my own money means the shop owes it back - and
       guessing one put $11 of a seller's own money down as taken from the till,
       on their first day. A money question answers itself for nobody. */
    S.expenses.push({kind:"Gas", amount:"", source:null});
    render(); return;
  }
  const esrc = t.dataset.expsrc;
  if(esrc !== undefined){ S.expenses[Number(esrc)].source = t.dataset.v; render(); return; }
  const erm = t.dataset.exprm;
  if(erm !== undefined){ S.expenses[Number(erm)].photo = null; render(); return; }
  const edel = t.dataset.expdel;
  if(edel !== undefined){ S.expenses.splice(Number(edel),1); render(); return; }
  const tm = t.dataset.travel;
  if(tm){
    S.travel = Object.assign({}, S.travel, { mode:tm });
    // Changing how you got there clears the other way's answers, so a van
    // drop-off left behind can never be paid on an own-car day.
    if(tm!=="van"){ S.travel.legs=null; S.travel.passenger=""; S.travel.marketId=""; }
    if(tm!=="own"){ S.travel.gasMode=""; S.travel.gasAmount=""; }
    render(); return;
  }
  const gm = t.dataset.gasmode;
  if(gm){
    S.travel = Object.assign({}, S.travel, { gasMode:gm });
    if(gm!=="flat") S.travel.gasAmount="";
    render(); return;
  }
  const legs = t.dataset.legs;
  if(legs !== undefined){
    const n = Number(legs);
    S.travel = Object.assign({}, S.travel, { legs:n });
    if(n===0){ S.travel.passenger=""; S.travel.marketId=""; }
    render(); return;
  }
  if(act==="retake"){ S.photo=null; S.arrivedAt=null; render(); return; }
  if(act==="fix-send"){
    const box = $("fixBox");
    const v = (box ? box.value : (S.fixDraft || "")).trim();
    if(!v){ toast("Say what's wrong first"); return; }
    if(!S.marketId || !S.dayOf){ toast("This day has no market to attach a fix to — tell Nawid"); return; }
    /* Queued first, sent second. If the phone dies between the two, the
       request is still on it and goes next time the app opens. */
    const id = newId();
    const list = loadFixes();
    list.push({ id, business_id: AUTH.demo ? null : AUTH.business,
                market_id:S.marketId, day_date:S.dayOf, message:v,
                asked_at:new Date().toISOString(), sentAt:null, problem:null });
    if(!saveFixes(list)){ toast("Couldn't save that on this phone — tell Nawid directly"); return; }
    S.fixDraft = ""; S.showFix = false; buzz(20);
    if(AUTH.demo){ toast("Saved — nothing leaves a look-around phone"); render(); return; }
    toast("Sending…"); render();
    sendFixes().then(() => {
      const f = loadFixes().find(x => x.id === id);
      toast(f && f.sentAt ? "The shop has it" : "Saved \u2014 not with the shop yet");
      render();
    });
    return;
  }
  if(act==="fix-retry"){
    toast("Trying…");
    sendFixes().then(() => {
      const left = fixesForDay().filter(f => !f.sentAt).length;
      toast(left ? "Still not with the shop yet" : "The shop has it");
      render();
    });
    return;
  }
  if(act==="reset"){ reset(); window.scrollTo(0,0); return; }
});

/* Keep every keystroke.

   The app used to record a field only when you tapped away from it. Type a
   number, tap the button, and it was gone - which is exactly what happened
   to a seller who told us he had written down $50 of giveaway and then had
   to conclude he must have "messed up something else". He had not. The app
   ate it.

   So a value is stored as it is typed. Redrawing still waits for the field
   to be left, because replacing the box mid-word would throw the keyboard
   and the cursor away. */
document.addEventListener("input", e => {
  const el = e.target;
  if(!el || el.id === "photoIn") return;

  if(el.dataset.pay !== undefined){
    const row = S.otherPays[Number(el.dataset.pay)];
    if(row) row[el.dataset.f] = el.value;
    save(); syncFooter(); return;
  }
  if(el.dataset.exp !== undefined){
    const row = S.expenses[Number(el.dataset.exp)];
    if(row) row[el.dataset.f] = el.value;
    save(); syncFooter(); return;
  }

  const key = el.dataset.set;
  if(!key || key === "ownerNote") return;
  if(PER_PRODUCT.includes(key)){
    const v = el.value;
    const blank = key === "opening" || key === "closing" ? undefined : 0;
    S[key][el.dataset.p] = v === "" ? blank : Math.max(0, Math.round(Number(v) || 0));
  } else if(key === "passenger" && el.tagName === "INPUT"){
    S.travel = Object.assign({}, S.travel, { passenger: el.value });   // a typed name
  } else if(key === "passenger" || key === "passengerMarket" || key === "gasAmount"){
    return;                       // these are selects; change is enough
  } else {
    S[key] = el.value;
  }
  save();
  syncFooter();
});

document.addEventListener("change", e => {
  if(e.target.id === "photoIn"){
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    readImage(f, 900, 0.7, data => {
      /* A photo the phone couldn't read used to say "Setup logged" straight over
         "Couldn't read that photo", and stamp the setup time with no photo. */
      if(!data) return;
      S.photo = data;
      S.arrivedAt = new Date().toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
      buzz(30); toast("Setup logged at "+S.arrivedAt); render();
    });
    return;
  }
  const el = e.target;

  const pf = el.dataset.photofor;
  if(pf !== undefined){
    const f = el.files && el.files[0];
    if(!f) return;
    readImage(f, 700, 0.6, data => {
      if(!data) return;                    // not "Receipt attached" when nothing was
      const row = S.expenses[Number(pf)];
      if(row){ row.photo = data; buzz(20); toast("Receipt attached"); render(); }
    });
    return;
  }

  const ei = el.dataset.exp;
  if(ei !== undefined){
    const row = S.expenses[Number(ei)];
    if(row){ row[el.dataset.f] = el.dataset.f==="amount" ? el.value : el.value; render(); }
    return;
  }

  if(el.dataset.pay!==undefined){
    const row = S.otherPays[Number(el.dataset.pay)];
    if(row){ row[el.dataset.f] = el.value; if(el.dataset.f==="amount") render(); }
    return;
  }

  const key = el.dataset.set;
  if(!key) return;
  if(key==="ownerNote"){ NOTE = el.value; return; }
  if(key==="passenger"){ S.travel = Object.assign({}, S.travel, {passenger:el.value}); if(el.tagName !== "INPUT") render(); return; }
  if(key==="passengerMarket"){ S.travel = Object.assign({}, S.travel, {marketId:el.value}); render(); return; }
  if(key==="gasAmount"){ S.travel = Object.assign({}, S.travel, {gasAmount:el.value}); render(); return; }
  if(PER_PRODUCT.includes(key)){
    S[key][el.dataset.p] = Math.max(0, Math.round(Number(el.value)||0));
    render();
  } else {
    S[key] = el.value;
    if(key==="cashCounted"||key==="cardTotal"||key==="chipsSold") render();
  }
});

/* Redraw once the sign-in has been checked. The screen is drawn before the
   answer comes back, so a sign-in found dead on opening only showed "Your code
   has stopped working" the next time the app was opened.
   A phone with no sign-in at all isn't given one here: it used to join as a new
   anonymous user the moment the page opened - somebody only having a look
   included - and the database lets only so many join from one connection an
   hour. It joins when a code is typed. */
if(AUTH.token || AUTH.refresh) ensureSession().then(() => { if(AUTH.signinBroken) render(); });
// The people and rota, fresh from the shop whenever there's signal.
if(AUTH.business && !AUTH.demo) refreshCatalogue().then(() => render());

setAsideOldDay();
render();

/* A day the phone thinks it sent, but the shop never received. */
verifySent();

/* A day that never made it off the phone goes again on its own - on
   load, and the moment the phone says it is back online. The seller
   should never have to remember to resend anything. */
if(S.mode === "owner" && canSeeOwner()){
  loadRealDays().then(()=>{ if(S.mode==="owner") render(); });
  if(S.tab === "people") loadCrew().then(()=>{ if(S.mode==="owner" && S.tab==="people") { render(); if(CREW_UI.open) crewShowPanel(); } });
  if(S.tab === "leads" || S.tab === "envelopes") loadRealPast().then(()=>{ if(S.mode==="owner" && (S.tab==="leads" || S.tab==="envelopes")) render(); });
}

function resendIfPending(){
  if(S.status === "closed" && S.submittedAt && !S.sentAt) sendDay().then(() => render());
  // Fixes asked for and not yet with the shop go the same way.
  if(loadFixes().some(f => !f.sentAt)) sendFixes().then(() => render());
  // Earlier days set aside when the next market came round.
  if(waitingDays().length) sendOutbox().then(() => render());
  // Days packed and never counted up, not yet reported to the shop.
  pruneShelf();
  if(loadShelf().some(e => !e.reportedAt)) sendUnfinished().then(() => render());
  // Second sheets the shop hasn't had yet.
  if(loadSecondSheets().some(x => !x.sentAt && !x.closed)) sendSecondSheets().then(() => render());
}
resendIfPending();
window.addEventListener("online", resendIfPending);
// Coming back to the app after it sat in the background counts as opening it.
document.addEventListener("visibilitychange", () => {
  if(document.hidden) return;
  if(startOverIfNewDay()) return;                 // left open overnight
  if(storedRev() > SEEN_REV) takeOtherCopy();     // another copy moved on while this one slept
  resendIfPending();
});

window.addEventListener("pageshow", e => { if(e.persisted) startOverIfNewDay(); });
// A screen left on across midnight, with nothing tapped.
setInterval(() => { if(!document.hidden) startOverIfNewDay(); }, 60000);

/* Another copy of the app on this phone saved something. Its day is taken the
   moment it lands, before this copy can be touched; see save(). Its sign-in is
   taken too - a renewed one in place, and a different person or a signing out
   by starting this copy over, the way a new sign-in always does. */
window.addEventListener("storage", e => {
  if(e.key === REV_KEY){ if(storedRev() > SEEN_REV) takeOtherCopy(); return; }
  if(e.key !== AUTH_KEY) return;
  let next = {};
  try{ next = JSON.parse(e.newValue || "null") || {}; }catch(x){}
  if(next.person !== AUTH.person || next.business !== AUTH.business || !!next.demo !== !!AUTH.demo){
    location.reload(); return;
  }
  Object.keys(AUTH).forEach(k => { delete AUTH[k]; });
  Object.assign(AUTH, next);
  QUIET_SAVE = true;
  try{ render(); } finally { QUIET_SAVE = false; }
});
})();
</script>

<script>
/* Offline support. Needs http/https, so this quietly does nothing when the
   file is opened straight off disk - the app still works, just without the
   cache. */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){ /* not fatal */ });
  });
}
</script>
