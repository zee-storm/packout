<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#E9EEF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#060A0F" media="(prefers-color-scheme: dark)">
<title>PackOut</title>

<!-- Installed to the home screen, this opens full screen with no address bar. -->
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./favicon-32.png" sizes="32x32" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PackOut">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600..700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap">

<style>
/* ============================================================
   PackOut — liquid glass over a dawn ground.

   Glass only reads as glass when there is something behind it to
   refract, so the page sits on a fixed dawn wash and the surfaces
   above it blur what they cover. Three layers of depth:

     ground   the dawn wash. fixed, never scrolls
     glass    cards and panels. translucent, blurred, lit on top
     chrome   top bar, tabs, action bar. denser, tinted, above all

   Two rules that keep this fast and honest:

   1. Blur only surfaces that sit directly on the ground. Anything
      inside an already-blurred card has nothing left to refract, so
      blurring it again costs frames and shows nothing. That matters
      on a mid-range phone at a market.

   2. Chrome is a TINTED material, not white at low alpha. In the
      dark theme it tints toward the ground, or page content reads
      straight through the bar it is supposed to sit above.

   The hairline on the top edge of every surface is the specular
   rim. It is the single detail that makes a flat translucent box
   read as a lit physical object rather than a faded rectangle.
   ============================================================ */

:root{
  /* --- ground: dawn --- */
  --ground-0:#E9EEF3;
  --wash-a:rgba(6,124,156,.26);
  --wash-b:rgba(58,78,190,.15);
  --wash-c:rgba(226,132,54,.22);

  /* --- materials --- */
  --glass:rgba(255,255,255,.50);
  --glass-2:rgba(255,255,255,.72);
  --glass-3:rgba(255,255,255,.30);
  --chrome:rgba(250,252,254,.68);
  --glass-line:rgba(14,32,48,.11);
  --glass-line-2:rgba(14,32,48,.07);
  --sheen:rgba(255,255,255,.85);
  --lens:rgba(255,255,255,.5);
  --blur:blur(20px) saturate(175%);
  --blur-lg:blur(30px) saturate(190%);

  /* --- ink --- */
  --ink:#0A141C;
  --ink-2:#3A4A58;
  --muted:#6B7B8A;

  /* --- accents --- */
  --accent:#04687F;
  --accent-lit:#0B8FAE;
  --accent-ink:#FFFFFF;
  --accent-soft:rgba(6,140,172,.13);
  --ember:#B4560E;
  --ember-soft:rgba(200,110,30,.14);
  --good:#0C6B48;
  --good-soft:rgba(16,140,95,.14);
  --warn:#8E5405;
  --warn-soft:rgba(190,120,10,.15);
  --bad:#A11F16;
  --bad-soft:rgba(190,45,32,.13);

  --shadow:0 1px 1px rgba(16,32,48,.05), 0 14px 34px -16px rgba(16,32,48,.30);
  --shadow-lg:0 2px 3px rgba(16,32,48,.07), 0 26px 56px -22px rgba(16,32,48,.40);
  --rim:inset 0 1px 0 var(--sheen);

  --r-lg:22px;
  --r:16px;
  --r-sm:11px;
  --r-xs:8px;
  --topbar-h:58px;

  --f-display:"Fraunces","Iowan Old Style",Georgia,serif;
  --f-ui:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;

  /* Aliases. The app's markup names these directly in a few inline
     styles; keeping them defined means nothing can quietly break. */
  --line:var(--glass-line);
  --surface:var(--glass);
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground-0:#060A0F;
    --wash-a:rgba(26,118,152,.34);
    --wash-b:rgba(48,58,158,.27);
    --wash-c:rgba(150,68,22,.23);

    --glass:rgba(255,255,255,.055);
    --glass-2:rgba(255,255,255,.09);
    --glass-3:rgba(255,255,255,.032);
    --chrome:rgba(8,13,19,.66);
    --glass-line:rgba(255,255,255,.13);
    --glass-line-2:rgba(255,255,255,.068);
    --sheen:rgba(255,255,255,.17);
    --lens:rgba(255,255,255,.085);

    --ink:#EBF2F8;
    --ink-2:#AFC0CE;
    --muted:#7C8D9D;

    --accent:#5AD1F0;
    --accent-lit:#8AE3FF;
    --accent-ink:#04222D;
    --accent-soft:rgba(90,209,240,.15);
    --ember:#FFA95C;
    --ember-soft:rgba(255,150,70,.15);
    --good:#4FD9A0;
    --good-soft:rgba(79,217,160,.14);
    --warn:#FFC062;
    --warn-soft:rgba(255,180,80,.14);
    --bad:#FF8078;
    --bad-soft:rgba(255,110,100,.15);

    --shadow:0 1px 1px rgba(0,0,0,.40), 0 14px 34px -16px rgba(0,0,0,.80);
    --shadow-lg:0 2px 4px rgba(0,0,0,.45), 0 28px 60px -22px rgba(0,0,0,.90);
  }
}

:root[data-theme="dark"]{
  --ground-0:#060A0F;
  --wash-a:rgba(26,118,152,.34);
  --wash-b:rgba(48,58,158,.27);
  --wash-c:rgba(150,68,22,.23);

  --glass:rgba(255,255,255,.055);
  --glass-2:rgba(255,255,255,.09);
  --glass-3:rgba(255,255,255,.032);
  --chrome:rgba(8,13,19,.66);
  --glass-line:rgba(255,255,255,.13);
  --glass-line-2:rgba(255,255,255,.068);
  --sheen:rgba(255,255,255,.17);
  --lens:rgba(255,255,255,.085);

  --ink:#EBF2F8;
  --ink-2:#AFC0CE;
  --muted:#7C8D9D;

  --accent:#5AD1F0;
  --accent-lit:#8AE3FF;
  --accent-ink:#04222D;
  --accent-soft:rgba(90,209,240,.15);
  --ember:#FFA95C;
  --ember-soft:rgba(255,150,70,.15);
  --good:#4FD9A0;
  --good-soft:rgba(79,217,160,.14);
  --warn:#FFC062;
  --warn-soft:rgba(255,180,80,.14);
  --bad:#FF8078;
  --bad-soft:rgba(255,110,100,.15);

  --shadow:0 1px 1px rgba(0,0,0,.40), 0 14px 34px -16px rgba(0,0,0,.80);
  --shadow-lg:0 2px 4px rgba(0,0,0,.45), 0 28px 60px -22px rgba(0,0,0,.90);
}

*{box-sizing:border-box}

/* Base colour lives on <html> so body::before can sit above it and
   below the content without fighting the canvas background. */
html{background:var(--ground-0)}

body{
  margin:0;
  background:transparent;
  color:var(--ink);
  font-family:var(--f-ui);
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
}

/* The dawn. Fixed, so the glass has a stable thing to refract while
   the page travels over it. */
body::before{
  content:"";
  position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(120% 78% at 8% -12%,  var(--wash-a), transparent 64%),
    radial-gradient(105% 70% at 98% 2%,   var(--wash-b), transparent 62%),
    radial-gradient(125% 85% at 46% 112%, var(--wash-c), transparent 64%);
}

button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-lit);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.num{font-variant-numeric:tabular-nums;letter-spacing:-.012em}
.lbl{
  font-family:var(--f-num);
  font-size:9.5px;font-weight:500;
  letter-spacing:.15em;text-transform:uppercase;
  color:var(--muted);
}

/* ---------- shell ---------- */
.shell{max-width:520px;margin:0 auto;padding:0 0 108px}
.shell.wide{max-width:1000px}

.topbar{
  position:sticky;top:0;z-index:30;
  background:var(--chrome);
  -webkit-backdrop-filter:var(--blur-lg);backdrop-filter:var(--blur-lg);
  border-bottom:1px solid var(--glass-line);
  box-shadow:var(--rim);
}
.topbar-in{
  max-width:1000px;margin:0 auto;min-height:var(--topbar-h);
  display:flex;align-items:center;gap:12px;padding:9px 16px;
}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;min-width:0}
.brand b{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:-.024em}
.brand span{
  font-family:var(--f-num);font-size:8.5px;font-weight:500;
  letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
}

.modesw{
  display:flex;gap:2px;padding:3px;border-radius:999px;
  background:var(--glass-3);border:1px solid var(--glass-line-2);box-shadow:var(--rim);
}
.modesw button{
  border:0;background:transparent;cursor:pointer;
  font-size:12.5px;font-weight:600;padding:7px 15px;border-radius:999px;
  color:var(--muted);white-space:nowrap;letter-spacing:-.005em;
  transition:color .18s,background .18s;
}
.modesw button[aria-pressed="true"]{
  background:linear-gradient(180deg,var(--accent-lit),var(--accent));
  color:var(--accent-ink);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.34),0 2px 8px -2px rgba(0,0,0,.4);
}

/* ---------- generic ---------- */
.pad{padding:18px 16px}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-sm{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px}
.row-b{display:flex;align-items:baseline;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grow{flex:1;min-width:0}

/* ---------- glass surfaces (blurred: these sit on the ground) ---------- */
.card,.tile,.tap,.ticker,.insight,.toast,.tap-out{
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
}

.card{
  position:relative;
  background:var(--glass);
  border:1px solid var(--glass-line);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow),var(--rim);
  overflow:hidden;
}
/* The lens: light raking across the top of the panel. */
.card::before,.tile::before{
  content:"";position:absolute;left:0;right:0;top:0;height:50%;
  pointer-events:none;background:linear-gradient(180deg,var(--lens),transparent);
}
.card>*,.tile>*{position:relative}
.card-pad{padding:16px}
.card-hd{
  padding:13px 16px;border-bottom:1px solid var(--glass-line-2);
  display:flex;align-items:center;justify-content:space-between;
  gap:8px 10px;flex-wrap:wrap;
}
/* The title keeps the line; a long pill beside it drops underneath rather
   than squeezing a two-word heading into two ragged lines. */
.card-hd h3{
  margin:0;font-family:var(--f-display);font-size:16px;font-weight:600;
  letter-spacing:-.018em;flex:1 1 auto;min-width:0;
}
.card-hd .pill{flex:0 1 auto;max-width:100%;overflow:hidden;text-overflow:ellipsis}

.stripe{border-left:3px solid var(--glass-line)}
.stripe-good{border-left-color:var(--good)}
.stripe-warn{border-left-color:var(--warn)}
.stripe-bad{border-left-color:var(--bad)}
.stripe-live{border-left-color:var(--accent)}

/* Small parts: translucent, never blurred — they sit on glass already. */
.pill{
  display:inline-flex;align-items:center;gap:5px;
  font-family:var(--f-num);font-size:9px;font-weight:500;
  letter-spacing:.12em;text-transform:uppercase;
  padding:4px 9px;border-radius:999px;
  background:var(--glass-3);color:var(--muted);
  border:1px solid var(--glass-line-2);white-space:nowrap;
}
.pill-good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill-warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill-bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill-live{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill-live .dot{animation:blip 1.8s ease-in-out infinite;box-shadow:0 0 8px currentColor}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.22}}

h1.page{
  margin:0;font-family:var(--f-display);
  font-size:33px;font-weight:700;line-height:1.03;
  letter-spacing:-.032em;text-wrap:balance;
}
h2.sec{
  margin:0;font-family:var(--f-num);font-size:9.5px;font-weight:500;
  letter-spacing:.15em;text-transform:uppercase;color:var(--muted);
}
p.note{margin:0;color:var(--muted);font-size:13.5px;line-height:1.5}

.big{font-weight:600;font-size:38px;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.mid{font-weight:600;font-size:24px;letter-spacing:-.032em;line-height:1;font-variant-numeric:tabular-nums}

/* ---------- buttons ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;border:1px solid transparent;cursor:pointer;
  background:linear-gradient(180deg,var(--accent-lit),var(--accent));
  color:var(--accent-ink);
  font-size:15.5px;font-weight:600;letter-spacing:-.014em;
  padding:17px;border-radius:var(--r);min-height:56px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.36),
    0 1px 2px rgba(0,0,0,.20),
    0 12px 26px -14px var(--accent);
  transition:transform .12s ease,box-shadow .18s ease,filter .18s ease;
}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(1px) scale(.995)}
/* Disabled has to stay opaque. This button floats over the page in the fixed
   footer, so dimming it with opacity lets whatever is scrolling underneath
   show straight through the label. */
.btn[disabled]{
  background:var(--glass-3);color:var(--muted);
  border-color:var(--glass-line-2);cursor:not-allowed;
  box-shadow:var(--rim);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
}
.btn[disabled]:hover{filter:none}
.btn[disabled]:active{transform:none}

.btn-ghost{
  background:var(--glass);color:var(--ink);
  border:1px solid var(--glass-line);
  box-shadow:var(--shadow),var(--rim);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
}
.btn-ghost:hover{filter:none;background:var(--glass-2)}
.btn-quiet{
  background:transparent;color:var(--muted);
  border:1px solid var(--glass-line);
  min-height:46px;font-size:13px;font-weight:600;padding:11px;box-shadow:none;
}
.btn-quiet:hover{filter:none;color:var(--ink-2)}
.btn-sm{min-height:42px;padding:10px 16px;font-size:13px;width:auto}

/* The action bar. Blur fades out through a mask instead of a colour
   gradient — a colour fade cannot match a ground that is washed with
   gradients, and would show as a band. */
.sticky-foot{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  padding:22px 16px calc(16px + env(safe-area-inset-bottom));
  pointer-events:none;
}
.sticky-foot::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top,var(--chrome),transparent);
  -webkit-backdrop-filter:var(--blur-lg);backdrop-filter:var(--blur-lg);
  -webkit-mask-image:linear-gradient(to top,#000 56%,transparent);
  mask-image:linear-gradient(to top,#000 56%,transparent);
}
.sticky-foot-in{
  position:relative;pointer-events:auto;
  max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:9px;
}

/* ---------- stepper ---------- */
.step-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--glass-line-2)}
.step-row:last-child{border-bottom:0}
.step-name{font-weight:600;font-size:15.5px;letter-spacing:-.018em}
.step-sub{font-family:var(--f-num);font-size:9.5px;color:var(--muted);letter-spacing:.07em;margin-top:3px}
.stepper{display:flex;align-items:center;flex:none}
.stepper button{
  width:44px;height:46px;border:1px solid var(--glass-line);
  background:var(--glass-3);font-size:19px;font-weight:500;cursor:pointer;color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--rim);transition:background .15s;
}
.stepper button:hover{background:var(--glass-2)}
.stepper button:active{background:var(--accent-soft)}
.stepper button:first-child{border-radius:var(--r-sm) 0 0 var(--r-sm)}
.stepper button:last-child{border-radius:0 var(--r-sm) var(--r-sm) 0}
.stepper input{
  width:62px;height:46px;text-align:center;
  border:1px solid var(--glass-line);border-left:0;border-right:0;
  background:var(--glass);color:var(--ink);
  font-family:var(--f-ui);font-weight:600;font-size:19px;
  font-variant-numeric:tabular-nums;letter-spacing:-.022em;
  -moz-appearance:textfield;box-shadow:var(--rim);
}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* ---------- tap cards ---------- */
.tap{
  position:relative;width:100%;
  border:1px solid var(--glass-line);
  background:var(--glass);color:var(--ink);
  border-radius:var(--r-lg);padding:18px 20px;cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  min-height:100px;text-align:left;
  box-shadow:var(--shadow),var(--rim);
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  transition:background .15s,border-color .15s,transform .1s;
}
.tap:active{background:var(--accent-soft);border-color:var(--accent);transform:scale(.99)}
.tap-name{font-size:19px;font-weight:600;letter-spacing:-.024em;line-height:1.15}
.tap-left{font-family:var(--f-num);font-size:9.5px;letter-spacing:.09em;color:var(--muted);margin-top:6px}
.tap-count{font-size:44px;font-weight:600;letter-spacing:-.048em;line-height:1;font-variant-numeric:tabular-nums}
.tap-out{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:var(--bad-soft);color:var(--bad);
  display:flex;align-items:center;justify-content:center;
  font-weight:600;font-size:15px;letter-spacing:-.012em;
}

.ticker{
  display:grid;grid-template-columns:1fr 1fr 1fr;
  background:var(--glass);border:1px solid var(--glass-line);
  border-radius:var(--r-lg);box-shadow:var(--shadow),var(--rim);overflow:hidden;
}
.ticker div{padding:13px 14px;border-right:1px solid var(--glass-line-2)}
.ticker div:last-child{border-right:0}
.ticker .mid{margin-top:5px}

/* ---------- key/value ---------- */
.kv{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--glass-line-2)}
.kv:last-child{border-bottom:0}
.kv-k{font-size:13.5px;color:var(--ink-2)}
.kv-v{font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.018em}
.kv-total{border-top:1px solid var(--glass-line);border-bottom:0;margin-top:5px;padding-top:13px}
.kv-total .kv-k{font-weight:600;font-size:14.5px;color:var(--ink)}
.kv-total .kv-v{font-size:22px;letter-spacing:-.03em}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  font-family:var(--f-num);font-size:10px;font-weight:400;
  padding:5px 9px;border-radius:var(--r-xs);
  background:var(--glass-3);color:var(--ink-2);
  border:1px solid var(--glass-line-2);
  font-variant-numeric:tabular-nums;letter-spacing:.03em;
}
.chip-hi{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:500}

/* ---------- fields ---------- */
.field{display:flex;flex-direction:column;gap:7px}
.field input,.field textarea,.field select,.inp{
  width:100%;padding:14px 15px;
  border:1px solid var(--glass-line);border-radius:var(--r-sm);
  background:var(--glass);color:var(--ink);font-size:16px;
  font-family:var(--f-ui);font-variant-numeric:tabular-nums;
  box-shadow:var(--rim);transition:border-color .15s,background .15s;
}
.field input:focus,.field textarea:focus,.field select:focus,.inp:focus{
  outline:none;border-color:var(--accent);background:var(--glass-2);
}
.field textarea{min-height:106px;resize:vertical;line-height:1.5}
.inp-sm{padding:12px 12px;font-size:15px;border-radius:var(--r-xs)}
.field-money{position:relative}
.field-money input{padding-left:32px}
.field-money::before{
  content:"$";position:absolute;left:15px;top:40px;
  color:var(--muted);font-size:16px;z-index:1;font-weight:500;
}
/* A money field with no label above it — the $ rides at the input's own top. */
.field-money.bare::before{top:13px;left:13px;font-size:15px}
.thumb{width:46px;height:46px;object-fit:cover;border-radius:var(--r-xs);border:1px solid var(--glass-line)}

.seg{display:flex;gap:7px}
.seg button{
  flex:1;border:1px solid var(--glass-line);background:var(--glass);
  padding:13px 8px;border-radius:var(--r-sm);cursor:pointer;
  font-size:14px;font-weight:600;color:var(--ink-2);min-height:50px;

<script>
(function(){
"use strict";

/* =========================================================
   Seed data \u2014 realistic Bay Area operation
   ========================================================= */

const PRODUCTS = [
  { id:"verde", name:"Pork Chile Verde", short:"Verde", price:13, caseSize:12 },
  { id:"mole",  name:"Chicken Mole",     short:"Mole",  price:13, caseSize:12 },
  { id:"rajas", name:"Rajas con Queso",  short:"Rajas", price:12, caseSize:12 }
];
const P_IDS = PRODUCTS.map(p=>p.id);
const prod = id => PRODUCTS.find(p=>p.id===id);

const COMMISSION = 0.15;      // 15% of sales
const DRIVER_LEG_PAY = 10;    // $10 to drop off, $10 to pick up
const EXPENSE_KINDS = ["Gas","Ice","Parking","Supplies","Other"];

/* One van, two markets. The person going furthest drives and drops the other
   off on the way, so the shop pays that gas once and it gets split between them.
   The $20 driver pay is NOT charged to a market - it is payroll the shop owes
   the driver, same as commission or paying someone back for ice. */
const VAN_RUNS = [ { driver:"marin", riders:["ferry"] } ];
function gasFor(min){ return Math.round(min * 2 * 0.35); }
function vanRunFor(mid){ return VAN_RUNS.find(r => r.driver===mid || r.riders.indexOf(mid)>=0); }
function vanCostFor(mid){
  const run = vanRunFor(mid);
  if(!run) return { ride:0, gas:gasFor(mkt(mid).driveMin), shareNames:[], rider:false };
  const stops = 1 + run.riders.length;
  const gas = Math.round(gasFor(mkt(run.driver).driveMin) / stops);
  const rider = run.riders.indexOf(mid) >= 0;
  const others = (run.driver===mid ? run.riders : [run.driver].concat(run.riders.filter(r=>r!==mid)));
  return { ride: rider ? DRIVER_LEG_PAY*2 : 0, gas, shareNames: others.map(r=>mkt(r).name), rider };
}

const MARKETS = [
  { id:"grand",  name:"Grand Lake",        city:"Oakland",     hours:"9:00 \u2013 2:00", sellHrs:5, fee:85,  driveMin:20, size:1.35,
    stall:"B-14", loadIn:"7:15am", manager:"Dana Whitfield", phone:"(510) 555-0142", ride:false },
  { id:"ferry",  name:"Ferry Building",    city:"San Francisco",hours:"8:00 \u2013 2:00", sellHrs:6, fee:145, driveMin:40, size:1.50,
    stall:"North Arcade 7", loadIn:"6:30am", manager:"Priya Raman", phone:"(415) 555-0188", ride:true },
  { id:"temes",  name:"Temescal",          city:"Oakland",     hours:"9:00 \u2013 1:00", sellHrs:4, fee:65,  driveMin:25, size:1.00,
    stall:"A-3", loadIn:"7:45am", manager:"Marcus Ellery", phone:"(510) 555-0119", ride:false },
  { id:"sanmat", name:"San Mateo",         city:"San Mateo",   hours:"9:00 \u2013 1:00", sellHrs:4, fee:70,  driveMin:45, size:0.85,
    stall:"C-22", loadIn:"7:30am", manager:"Joyce Tran", phone:"(650) 555-0164", ride:true },
  { id:"marin",  name:"Marin Civic Center",city:"San Rafael",  hours:"8:00 \u2013 1:00", sellHrs:5, fee:95,  driveMin:55, size:1.20,
    stall:"D-9", loadIn:"6:45am", manager:"Hal Brenner", phone:"(415) 555-0173", ride:true }
];
const mkt = id => MARKETS.find(m=>m.id===id);

const SELLERS = [
  { id:"maria", name:"Maria Reyes", phone:"(510) 555-0121",  base:1.16, urban:0.16,  cashSlip:0.02 },
  { id:"jose",  name:"Jos\u00E9 Luna", phone:"(510) 555-0148",    base:1.04, urban:-0.18, cashSlip:0.03 },
  { id:"carla", name:"Carla Mendez", phone:"(510) 555-0176", base:0.96, urban:0.02,  cashSlip:0.02 },
  { id:"danny", name:"Danny Ortiz", phone:"(510) 555-0193",  base:1.01, urban:0.0,   cashSlip:0.14 }
];
const slr = id => SELLERS.find(s=>s.id===id);

// Product mix differs by market \u2014 the app should find this
const MIX = {
  grand:  { verde:0.34, mole:0.44, rajas:0.22 },
  ferry:  { verde:0.29, mole:0.50, rajas:0.21 },
  temes:  { verde:0.38, mole:0.36, rajas:0.26 },
  sanmat: { verde:0.47, mole:0.28, rajas:0.25 },
  marin:  { verde:0.31, mole:0.41, rajas:0.28 }
};
// Urban-leaning markets, for seller affinity
const URBAN = { ferry:1, grand:1, temes:0.4, sanmat:0, marin:0.15 };

/* How much a given kind of day moves sales. Used two ways: to stop a rained-out
   Saturday from dragging down a market's average, and to size the send list to
   the forecast. In the prototype these are seeded - live weather needs a server. */
const WX_MULT = { "Clear":1.0, "Overcast":0.94, "Fog":0.90, "Rain":0.58, "Windy":0.88 };
const wxMult = t => WX_MULT[t] || 1;

const TODAY_WX = { t:"Clear", temp:74 };
const FORECAST = {
  grand:  { t:"Clear",    temp:76 },
  ferry:  { t:"Fog",      temp:58 },
  temes:  { t:"Clear",    temp:74 },
  sanmat: { t:"Rain",     temp:55 },
  marin:  { t:"Overcast", temp:63 }
};

const WEATHER = [
  { t:"Clear", temp:72, mult:1.0 }, { t:"Clear", temp:78, mult:1.02 },
  { t:"Overcast", temp:61, mult:0.94 }, { t:"Fog", temp:57, mult:0.9 },
  { t:"Clear", temp:69, mult:1.0 }, { t:"Rain", temp:54, mult:0.58 },
  { t:"Windy", temp:63, mult:0.88 }, { t:"Clear", temp:75, mult:1.03 }
];

/* ---- deterministic RNG so numbers never jump around ---- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd = mulberry32(20260828);

/* ---- dates ---- */
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const dISO = d => d.toISOString().slice(0,10);
const daysAgo = n => { const d=new Date(TODAY); d.setDate(d.getDate()-n); return d; };
const fmtDate = d => d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
const fmtShort = d => d.toLocaleDateString(undefined,{month:"short",day:"numeric"});

/* =========================================================
   Generate 8 weeks of history
   ========================================================= */

const ROTA = [ // who worked where, week by week (index = weeks ago - 1)
  { grand:"maria", ferry:"jose",  temes:"carla", sanmat:"danny", marin:"maria" },
  { grand:"carla", ferry:"maria", temes:"danny", sanmat:"jose",  marin:"carla" },
  { grand:"maria", ferry:"jose",  temes:"carla", sanmat:"danny", marin:"jose"  },
  { grand:"danny", ferry:"maria", temes:"jose",  sanmat:"carla", marin:"maria" },
  { grand:"maria", ferry:"jose",  temes:"danny", sanmat:"carla", marin:"carla" },
  { grand:"carla", ferry:"maria", temes:"maria", sanmat:"jose",  marin:"danny" },
  { grand:"jose",  ferry:"carla", temes:"danny", sanmat:"maria", marin:"maria" },
  { grand:"maria", ferry:"jose",  temes:"carla", sanmat:"danny", marin:"jose"  }
];

function sellerMult(sid, mid){
  const s = slr(sid);
  return s.base + s.urban * (URBAN[mid] ?? 0.5);
}

const HISTORY = [];
for(let w=8; w>=1; w--){
  const date = daysAgo(w*7);
  const wx = WEATHER[(w*3+1) % WEATHER.length];
  MARKETS.forEach(m => {
    const sid = ROTA[w-1][m.id];
    // baseline packs sold at this market
    const baseline = 100 * m.size;
    const seasonal = 1 + (8-w)*0.012;           // slow growth over the season
    const noise = 0.9 + rnd()*0.2;
    let total = Math.round(baseline * sellerMult(sid,m.id) * wx.mult * seasonal * noise);

    // opening was decided by gut \u2014 sometimes too little
    const gut = Math.round(baseline * 1.18 * seasonal / 12) * 12;
    const soldOut = total >= gut;
    const sold = soldOut ? gut : total;

    const opening={}, closing={}, samples={}, damaged={};
    let s_left = sold;
    P_IDS.forEach((pid,i)=>{
      const share = MIX[m.id][pid];
      const op = Math.round(gut*share/6)*6;
      opening[pid]=op;
      const sl = i===P_IDS.length-1 ? Math.min(s_left,op) : Math.min(Math.round(sold*share), op);
      closing[pid] = Math.max(0, op - sl);
      s_left -= sl;
      samples[pid] = Math.round(rnd()*4)+2;
      damaged[pid] = rnd()<0.12 ? 1 : 0;
      closing[pid] = Math.max(0, closing[pid] - samples[pid] - damaged[pid]);
    });

    const soldReal = P_IDS.reduce((a,pid)=>a+(opening[pid]-closing[pid]-samples[pid]-damaged[pid]),0);
    const revenue = P_IDS.reduce((a,pid)=>a+(opening[pid]-closing[pid]-samples[pid]-damaged[pid])*prod(pid).price,0);
    const cardShare = 0.62 + rnd()*0.14;
    const cardTotal = Math.round(revenue*cardShare);
    const expectedCash = revenue - cardTotal;
    const slip = slr(sid).cashSlip;
    const off = rnd() < slip ? -(Math.round(rnd()*5)+2)*prod("verde").price/13*8 : 0;
    const cashCounted = Math.max(0, Math.round(expectedCash + off));

    HISTORY.push({
      id:`${m.id}-${dISO(date)}`, date:dISO(date), dateObj:date,
      marketId:m.id, sellerId:sid, status:"done",
      opening, closing, samples, damaged,
      cardTotal, cashCounted, float:150,
      soldOut, soldOutAt: soldOut ? "1:10pm" : null,
      weather:{ t:wx.t, temp:wx.temp },
      arrived: rnd()<0.15 ? "late" : "ontime"
    });
  });
}

/* =========================================================
   Today
   ========================================================= */

const TODAY_PLAN = [
  { marketId:"grand",  sellerId:"carla", status:"done"    },
  { marketId:"ferry",  sellerId:"jose",  status:"selling" },
  { marketId:"marin",  sellerId:"danny", status:"selling" },
  { marketId:"sanmat", sellerId:"maria", status:"selling" },
  { marketId:"temes",  sellerId:"you",   status:"assigned"} // <- the phone user
];

/* ---- how much to send: the flagship calculation ---- */
function recommend(marketId, productId){
  const past = HISTORY.filter(d=>d.marketId===marketId).slice(-4);
  const sold = past.map(d => d.opening[productId]-d.closing[productId]-d.samples[productId]-d.damaged[productId]);
  const anySoldOut = past.some(d=>d.soldOut);

  // A rained-out day is not a weak market. Lift each past day back to what it
  // would have done in normal weather before averaging.
  const normalised = past.map((d,i) => sold[i] / wxMult(d.weather.t));
  const avg = normalised.reduce((a,b)=>a+b,0)/(normalised.length||1);

  const buffer = anySoldOut ? 1.30 : 1.15;
  const fc = FORECAST[marketId] || null;
  const wx = fc ? wxMult(fc.t) : 1;

  const cs = prod(productId).caseSize;
  const qty = Math.max(cs, Math.ceil(avg*buffer*wx/cs)*cs);
  const plain = Math.max(cs, Math.ceil(avg*buffer/cs)*cs);
  return { qty, sold, avg, anySoldOut, buffer, fc, wx, plain };
}
function recommendMarket(marketId){
  const out = {}; let total = 0, plain = 0;
  P_IDS.forEach(pid => { const r = recommend(marketId,pid); out[pid]=r; total += r.qty; plain += r.plain; });
  const fc = FORECAST[marketId] || null;
  return { byProduct: out, total, plain, fc, wx: fc ? wxMult(fc.t) : 1 };
}

/* ---- freezer stock ---- */
const FREEZER = { verde:148, mole:96, rajas:132 };
const BATCH_AGE = { verde:{made:"Aug 19", trips:2}, mole:{made:"Aug 22", trips:1}, rajas:{made:"Aug 8", trips:5} };

/* =========================================================
   Live state (the seller's own day) \u2014 persisted
   ========================================================= */

const STORE_KEY = "packout.v2";
const NOTE_KEY  = "packout.note.v1";
const DEFAULT_NOTE = "Rajas from the Aug 8 batch has to move today \u2014 run it 3 for $33 and lead with it when people walk up. Everything else stays full price.";
let NOTE = DEFAULT_NOTE, NOTE_AT = "6:40am";
function loadNote(){
  try{ const r = localStorage.getItem(NOTE_KEY); if(r!==null) NOTE = r; }catch(e){}
}
function saveNote(){ try{ localStorage.setItem(NOTE_KEY, NOTE); }catch(e){} }
const SELLER_SCREEN_NAMES = ["today","loadout","market","closeout","result"];

/* The phone is used before the market and after it. Never during. */
const BLANK = {
  screen:"today", mode:"seller", tab:"today",
  status:"assigned",             // assigned -> loaded -> setup -> closed
  arrivedAt:null, photo:null,
  opening:{}, closing:{}, samples:{verde:0,mole:0,rajas:0}, damaged:{verde:0,mole:0,rajas:0},
  endedAt:null,
  cashCounted:"", cardTotal:"", float:150,
  soldOut:null, soldOutAt:"", note:"", lead:"",
  showDamaged:false, showLead:false,
  submittedAt:null, showFix:false, corrections:[], marketOpen:null,
  packedAt:null, discounts:"", paidOut:"",
  expenses:[],
  travel:{ mode:"van", legs:0, passenger:"", marketId:"", gasMode:"claim", gasAmount:"" },
  packedBy:"you", showPacker:false
};
let S = load() || JSON.parse(JSON.stringify(BLANK));
loadNote();

function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); return true; }
  catch(e){
    // Almost always the photo pushing past the storage limit.
    // The counts are the paycheck; the photo is not. Drop it and keep the numbers.
    const hasReceipt = (S.expenses||[]).some(x=>x.photo);
    if(S.photo || hasReceipt){
      const keep = S.photo, keptReceipts = (S.expenses||[]).map(x=>x.photo);
      S.photo = null;
      (S.expenses||[]).forEach(x=>{ x.photo = null; });
      try{
        localStorage.setItem(STORE_KEY, JSON.stringify(S));
        toast("Photos were too big to keep \u2014 your counts and amounts are saved");
        return true;
      }catch(e2){
        S.photo = keep;
        (S.expenses||[]).forEach((x,i)=>{ x.photo = keptReceipts[i]; });
      }
    }
    toast("Couldn't save on this phone \u2014 write your counts down");
    return false;
  }
}
function load(){
  try{
    const r = localStorage.getItem(STORE_KEY);
    if(!r) return null;
    const saved = JSON.parse(r);
    if(!saved || typeof saved !== "object") return null;
    // A day saved by an older version is missing fields this one expects.
    // Start from a blank day and lay the saved values on top, so an update
    // can never leave someone staring at an empty screen mid-market.
    const fresh = JSON.parse(JSON.stringify(BLANK));
    const merged = Object.assign(fresh, saved);
    merged.opening  = Object.assign({}, fresh.opening,  saved.opening  || {});
    merged.closing  = Object.assign({}, fresh.closing,  saved.closing  || {});
    merged.samples  = Object.assign({}, fresh.samples,  saved.samples  || {});
    merged.damaged  = Object.assign({}, fresh.damaged,  saved.damaged  || {});
    if(!Array.isArray(merged.corrections)) merged.corrections = [];
    if(!Array.isArray(merged.expenses)) merged.expenses = [];
    merged.travel = Object.assign({mode:"van",legs:0,passenger:"",marketId:"",gasMode:"claim",gasAmount:""}, merged.travel || {});
    delete merged.drive;
    if(!SELLER_SCREEN_NAMES.includes(merged.screen)) merged.screen = "today";
    return merged;
  }catch(e){ return null; }
}
function reset(){ S = JSON.parse(JSON.stringify(BLANK)); save(); render(); }

const MY_MARKET = mkt("temes");
const MY_REC = recommendMarket("temes");

/* =========================================================
   Helpers
   ========================================================= */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => "$" + Math.round(n).toLocaleString();
const money2 = n => "$" + n.toFixed(2);

function soldByCount(pid){
  const op = S.opening[pid] ?? 0, cl = S.closing[pid] ?? 0;
  return Math.max(0, op - cl - (S.samples[pid]||0) - (S.damaged[pid]||0));
}
function openedTotal(){ return P_IDS.reduce((a,p)=>a+(S.opening[p]||0),0); }
function soldTotal(){ return P_IDS.reduce((a,p)=>a+soldByCount(p),0); }
function revenueTotal(){ return P_IDS.reduce((a,p)=>a+soldByCount(p)*prod(p).price,0); }
function expTotal(source){
  return (S.expenses||[]).reduce((a,e)=> a + ((!source || e.source===source) ? (Number(e.amount)||0) : 0), 0);
}
function packedByName(){
  if(!S.packedBy || S.packedBy==="you") return "You";
  const x = slr(S.packedBy);
  return x ? x.name : "You";
}
function packedBySomeoneElse(){ return !!S.packedBy && S.packedBy!=="you"; }
function driverPay(){
  const t = S.travel || {};
  return t.mode==="van" ? (t.legs||0) * DRIVER_LEG_PAY : 0;
}
// A flat gas allowance for taking your own car. If instead they filled the tank
// themselves, that is a receipt line under "money you spent" - never both, or
// the same gas gets paid twice.
function carAllowance(){

function countedAll(){ return P_IDS.every(p => S.closing[p] !== undefined && S.closing[p] !== null); }

function hoursWorked(m){ return m.sellHrs + 1 + 0.75 + 0.75 + (m.driveMin*2)/60; }

/* How a seller performs at a market, against that market's own average.
   Everything the People tab claims is derived from these. */
/* Prefer what actually got logged at that market. Fall back to the
   model only when this person hasn't worked it enough times yet. */
function observedAtMarket(sid, mid){
  const at = HISTORY.filter(d=>d.marketId===mid);
  const mine = at.filter(d=>d.sellerId===sid);
  if(at.length < 2 || mine.length < 2) return null;
  const avgAll  = at.reduce((a,d)=>a+dayStats(d).sold,0)/at.length;
  const avgMine = mine.reduce((a,d)=>a+dayStats(d).sold,0)/mine.length;
  const revMine = mine.reduce((a,d)=>a+dayStats(d).revenue,0)/mine.length;
  return { pct: avgMine/avgAll - 1, revenue: revMine, n: mine.length };
}
function perfPct(sid, mid){
  const o = observedAtMarket(sid, mid);
  if(o) return o.pct;
  const avg = SELLERS.reduce((a,s)=>a+sellerMult(s.id,mid),0)/SELLERS.length;
  return sellerMult(sid,mid)/avg - 1;
}
function estRevenue(sid, mid){
  const o = observedAtMarket(sid, mid);
  if(o) return o.revenue;
  return 100 * mkt(mid).size * sellerMult(sid,mid) * 12.7;
}
function bestSwap(){
  const plans = TODAY_PLAN.filter(p=>p.sellerId!=="you");
  let best = null;
  for(let i=0;i<plans.length;i++){
    for(let j=i+1;j<plans.length;j++){
      const a=plans[i], b=plans[j];
      const now = estRevenue(a.sellerId,a.marketId) + estRevenue(b.sellerId,b.marketId);
      const sw  = estRevenue(a.sellerId,b.marketId) + estRevenue(b.sellerId,a.marketId);
      if(!best || sw-now > best.gain) best = { a, b, gain: sw-now };
    }
  }
  return best;
}
function cashRecord(sid){
  const days = HISTORY.filter(d=>d.sellerId===sid).map(dayStats);
  const bad = days.filter(d=>d.variance < -15);
  const avgShort = bad.length ? bad.reduce((a,d)=>a+d.variance,0)/bad.length : 0;
  return { bad:bad.length, total:days.length, avgShort };
}

function dayStats(d){
  const sold = P_IDS.reduce((a,p)=>a+(d.opening[p]-d.closing[p]-d.samples[p]-d.damaged[p]),0);
  const revenue = P_IDS.reduce((a,p)=>a+(d.opening[p]-d.closing[p]-d.samples[p]-d.damaged[p])*prod(p).price,0);
  const money_in = d.cashCounted + d.cardTotal;
  const variance = money_in - revenue;
  const m = mkt(d.marketId);
  const hrs = hoursWorked(m);
  return { sold, revenue, money_in, variance, hrs, perHr:(revenue-m.fee)/hrs, commission:revenue*COMMISSION, opened:P_IDS.reduce((a,p)=>a+d.opening[p],0) };
}

function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("on"),1900);
}
function readImage(file, maxPx, quality, cb){
  const img = new Image();
  img.onload = () => {
    const sc = Math.min(1, maxPx/Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    let data = null;
    try{ data = c.toDataURL("image/jpeg", quality); }catch(err){}
    URL.revokeObjectURL(img.src);
    cb(data);
  };
  img.onerror = () => { toast("Couldn't read that photo"); cb(null); };
  img.src = URL.createObjectURL(file);
}
function buzz(ms){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }

let wakeLock=null;
async function keepAwake(on){
  try{
    if(on && "wakeLock" in navigator && !wakeLock){ wakeLock = await navigator.wakeLock.request("screen"); }
    else if(!on && wakeLock){ wakeLock.release(); wakeLock=null; }
  }catch(e){}
}

function liveDay(plan){
  // fabricate a plausible in-progress or finished day for the owner view
  if(plan.sellerId==="you"){
    const closed = S.screen==="result";
    let status = "Not started";
    if(closed) status="Closed";
    else if(S.photo) status="Set up "+(S.arrivedAt||"");
    else if(openedTotal()>0) status="Loaded";
    return { name:"You", phone:null, sold: closed?soldTotal():null, rev: closed?revenueTotal():null,
             status, live:!closed && !!S.photo, variance:null, out:openedTotal(),
             overSend: openedTotal() ? openedTotal()-MY_REC.total : 0,
             fixes: S.corrections.length,
             packedByOther: (openedTotal() && packedBySomeoneElse()) ? packedByName() : null,
             owed: closed ? (revenueTotal()*COMMISSION + driverPay() + expTotal("own") + carAllowance()) : 0 };
  }
  const m = mkt(plan.marketId), s = slr(plan.sellerId);
  const seed = mulberry32(plan.marketId.length*977 + plan.sellerId.length*31 + 7);
  const done = plan.status==="done";
  const sold = done ? Math.round(100*m.size*sellerMult(plan.sellerId,plan.marketId)*(0.95+seed()*0.12)) : null;
  const rev = done ? sold*12.7 : null;
  const sendListQty = recommendMarket(plan.marketId).total;
  // sellers normally take exactly what the send list says; deviations should be rare enough to mean something
  const out = plan.marketId==="ferry" ? sendListQty-24 : sendListQty;
  const hash = [...plan.marketId].reduce((a,c)=>a+c.charCodeAt(0),0);
  const setupAt = ["7:12am","6:38am","7:41am","7:26am","6:52am"][hash % 5];
  const sendList = sendListQty;
  return { name:s.name, phone:s.phone, sold, rev, out,
           status: done ? "Closed" : "Set up "+setupAt,
           live: !done, variance: done ? (plan.sellerId==="danny"?-31:-2) : null,
           overSend: out - sendList, fixes:0,
           owed: done ? sold*12.7*COMMISSION : 0 };
}

        </div>
        <div class="row" style="gap:8px">
          <button class="btn btn-sm" data-act="note-save" style="flex:2">Post to everyone</button>
          <button class="btn btn-quiet btn-sm" data-act="note-clear" style="flex:1">Clear</button>
        </div>
        <div class="hint">Everyone sees this on their setup screen, before they start selling &mdash; the one time the phone is already in their hand.
        For something meant for one market only, tap that person's name below and text them.</div>
      </div>
    </div>

    <h2 class="sec">Markets</h2>
    <div class="stack-sm">${cards}</div>
  </div>`;
}

function owner_send(){
  const rows = MARKETS.map(m=>{
    const r = recommendMarket(m.id);
    return `<tr>
      <td><div class="who">${esc(m.name)}</div><div class="sub">${esc(m.city)}</div></td>
      ${P_IDS.map(pid=>{
        const rec = r.byProduct[pid];
        const hi = rec.anySoldOut;
        return `<td class="n"><span class="chip ${hi?"chip-hi":""}">${rec.qty}</span></td>`;
      }).join("")}
      <td class="n" style="font-weight:600">${r.total}</td>
      <td class="n"><span class="sub">${esc(r.fc?r.fc.t:"")} ${r.fc?r.fc.temp+"&deg;":""}</span>
        ${r.wx<0.97?`<div class="delta down">${r.total-r.plain}</div>`:""}</td>
    </tr>`;
  }).join("");

  const totals = {}; let grand = 0;
  P_IDS.forEach(pid=>{ totals[pid]=0; });
  MARKETS.forEach(m=>{ const r=recommendMarket(m.id); P_IDS.forEach(pid=>{ totals[pid]+=r.byProduct[pid].qty; }); grand += r.total; });

  const toMake = {}; let makeTotal = 0;
  P_IDS.forEach(pid=>{ const n = Math.max(0, totals[pid]-FREEZER[pid]); toMake[pid]=Math.ceil(n/12)*12; makeTotal += toMake[pid]; });

  return `<div class="pad stack">
    <div>
      <div class="lbl">Week of ${esc(fmtShort(TODAY))}</div>
      <h1 class="page" style="margin-top:6px">Send list</h1>
      <p class="note" style="margin-top:5px">Built from the last 4 weeks at each market, by product, rounded to full cases.</p>
    </div>

    <div class="card">
      <div class="card-hd"><h3>Make this week</h3><span class="pill pill-live">${makeTotal} packs</span></div>
      <div class="card-pad">
        ${PRODUCTS.map(p=>`<div class="kv">
          <span class="kv-k">${esc(p.name)} <span class="sub">\u2014 need ${totals[p.id]}, freezer has ${FREEZER[p.id]}</span></span>
          <span class="kv-v">${toMake[p.id]}</span>
        </div>`).join("")}
        <div class="kv kv-total"><span class="kv-k">Total to make</span><span class="kv-v">${makeTotal}</span></div>
      </div>
    </div>

    <div class="insight">
      <div class="insight-mark">Move first</div>
      <p><b>Rajas made ${esc(BATCH_AGE.rajas.made)} has been out ${BATCH_AGE.rajas.trips} times.</b> Send that batch to Temescal and Grand Lake this week \u2014 they move rajas fastest \u2014 before it has to be written off.</p>
    </div>

    <div class="card">
      <div class="card-hd"><h3>By market</h3><span class="pill">${grand} packs out</span></div>
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>Market</th>${PRODUCTS.map(p=>`<th class="n">${esc(p.short)}</th>`).join("")}<th class="n">Total</th><th class="n">Weather</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
    <div class="hint">Highlighted numbers are markets that <b>sold out recently</b> \u2014 those get a bigger cushion so you stop losing the last hour.</div>
    ${(()=>{
      const wet = MARKETS.map(m=>({m, r:recommendMarket(m.id)})).filter(x=>x.r.wx<0.97);
      if(!wet.length) return "";
      const cut = wet.reduce((a,x)=>a+(x.r.plain-x.r.total),0);
      return `<div class="insight">
        <div class="insight-mark">Weather</div>
        <p><b>${wet.map(x=>esc(x.m.name)+" ("+esc(x.r.fc.t.toLowerCase())+")").join(", ")}.</b>
        That is <b>${cut} fewer packs</b> going out than a clear week, so they do not ride around all day and come back.
        Slow days at those markets will not count against the seller either &mdash; a rained-out Saturday is left out of their average.</p>
      </div>`;
    })()}
  </div>`;
}

function owner_people(){
  const rows = SELLERS.map(s=>{
    const days = HISTORY.filter(d=>d.sellerId===s.id);
    let vsSum=0, perHrSum=0, varSum=0, n=0, off=0;
    days.forEach(d=>{
      const st = dayStats(d);
      const peers = HISTORY.filter(x=>x.marketId===d.marketId);
      const peerAvg = peers.reduce((a,x)=>a+dayStats(x).sold,0)/peers.length;
      vsSum += (st.sold/peerAvg - 1);
      perHrSum += st.revenue/st.hrs;
      varSum += st.variance; if(Math.abs(st.variance)>15) off++;
      n++;
    });
    const vs = (vsSum/n)*100;
    const perHr = perHrSum/n;
    const acc = 100 - (off/n)*100;
    return { s, vs, perHr, acc, n, days };
  }).sort((a,b)=>b.vs-a.vs);

  const body = rows.map(r=>`<tr>
    <td><div class="who">${esc(r.s.name)}</div><div class="sub">${r.n} market days</div></td>
    <td class="n"><span class="delta ${r.vs>=0?"up":"down"}">${r.vs>=0?"+":""}${r.vs.toFixed(0)}%</span></td>
    <td class="n">${money(r.perHr)}</td>
    <td class="n">${r.acc>=90?`<span class="pill pill-good">${r.acc.toFixed(0)}%</span>`:`<span class="pill pill-warn">${r.acc.toFixed(0)}%</span>`}</td>
  </tr>`).join("");

  return `<div class="pad stack">
    <div>
      <h1 class="page">People</h1>
      <p class="note" style="margin-top:5px">Each person is measured against what that market normally does \u2014 not against each other. A big market doesn't make you a better seller.</p>
    </div>
    <div class="card">
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>Seller</th><th class="n">vs market avg</th><th class="n">$/hour</th><th class="n">Cash accuracy</th></tr></thead>
          <tbody>${body}</tbody>
        </table>
      </div>
    </div>
    ${(()=>{
      const sw = bestSwap();
      if(!sw || sw.gain < 40) return "";
      const aS=slr(sw.a.sellerId), bS=slr(sw.b.sellerId), aM=mkt(sw.a.marketId), bM=mkt(sw.b.marketId);
      const pct = (s,m)=>{ const v=Math.round(perfPct(s,m)*100); return (v>0?"+":v<0?"\u2212":"")+Math.abs(v)+"%"; };
      // whoever gains more by moving to the other's market goes first
      return `<div class="insight">
        <div class="insight-mark">Swap these two</div>
        <p>At <b>${esc(bM.name)}</b>, ${esc(aS.name)} runs <b>${pct(aS.id,bM.id)}</b> against that market's own average and
        ${esc(bS.name)} runs <b>${pct(bS.id,bM.id)}</b>. Today they're booked the other way around &mdash;
        ${esc(bS.name)} has ${esc(bM.name)} and ${esc(aS.name)} has ${esc(aM.name)}.
        Trading them is worth about <b>${money(sw.gain)}</b> today.</p>
      </div>`;
    })()}
    <div class="card">
      <div class="card-hd"><h3>This week's pay</h3><span class="pill">15% of sales</span></div>
      <div class="card-pad">
        ${SELLERS.map(s=>{
          const wk = HISTORY.filter(d=>d.sellerId===s.id).slice(-2);
          const amt = wk.reduce((a,d)=>a+dayStats(d).commission,0);
          return `<div class="kv"><span class="kv-k">${esc(s.name)} <span class="sub">\u2014 ${wk.length} days</span></span><span class="kv-v">${money2(amt)}</span></div>`;
        }).join("")}
        <div class="kv kv-total"><span class="kv-k">Total payroll</span><span class="kv-v">${money2(SELLERS.reduce((a,s)=>a+HISTORY.filter(d=>d.sellerId===s.id).slice(-2).reduce((b,d)=>b+dayStats(d).commission,0),0))}</span></div>
      </div>
    </div>
    <div class="hint">Sellers see this same screen for themselves. Same math on both phones, so there's nothing to argue about on payday.</div>
  </div>`;
}

function owner_markets(){
  const rows = MARKETS.map(m=>{
    const days = HISTORY.filter(d=>d.marketId===m.id);
    const st = days.map(dayStats);
    const rev = st.reduce((a,x)=>a+x.revenue,0)/st.length;
    const perHr = st.reduce((a,x)=>a+x.perHr,0)/st.length;
    const recent = st.slice(-3).reduce((a,x)=>a+x.revenue,0)/3;
    const older  = st.slice(0,3).reduce((a,x)=>a+x.revenue,0)/3;
    const trend = (recent/older-1)*100;
    const hrs = hoursWorked(m);
    const vc = vanCostFor(m.id);
    const dayCost = m.fee + vc.gas;
    const soloCost = m.fee + gasFor(m.driveMin);   // what it would cost on its own trip
    const perHrTrue = (rev - dayCost)/hrs;
    return { m, rev, perHr:perHrTrue, trend, hrs,
             rideCost:vc.ride, gas:vc.gas, dayCost, soloCost,
             shareNames:vc.shareNames, rider:vc.rider,
             soloPerHr:(rev - soloCost)/hrs,
             sold: st.reduce((a,x)=>a+x.sold,0)/st.length };
  }).sort((a,b)=>b.perHr-a.perHr);

  const best = rows[0], worst = rows[rows.length-1];

  const body = rows.map(r=>`<tr data-market="${r.m.id}" style="cursor:pointer">
    <td><div class="who" style="color:var(--accent)">${esc(r.m.name)}</div><div class="sub">${esc(r.m.city)} \u00B7 ${r.m.driveMin}min drive</div></td>
    <td class="n">${money(r.rev)}</td>
    <td class="n">${money(r.dayCost)}${r.shareNames.length?`<div class="sub">shares a van</div>`:""}</td>
    <td class="n">${r.hrs.toFixed(1)}</td>
    <td class="n" style="font-weight:600">${money(r.perHr)}</td>
    <td class="n"><span class="delta ${r.trend>=0?"up":"down"}">${r.trend>=0?"\u25B2":"\u25BC"} ${Math.abs(r.trend).toFixed(0)}%</span></td>
  </tr>`).join("");

  return `<div class="pad stack">
    <div>
      <h1 class="page">Markets</h1>
      <p class="note" style="margin-top:5px">Sorted by what each one actually pays per hour worked \u2014 including packing, driving both ways, setup and teardown. Not just the four hours of selling.</p>
    </div>
    <div class="tiles">
      <div class="tile"><div class="lbl">Best per hour</div><div class="mid">${money(best.perHr)}</div><div class="tile-sub">${esc(best.m.name)}</div></div>
      <div class="tile"><div class="lbl">Worst per hour</div><div class="mid">${money(worst.perHr)}</div><div class="tile-sub">${esc(worst.m.name)}</div></div>
      <div class="tile"><div class="lbl">Weekly revenue</div><div class="mid">${money(rows.reduce((a,r)=>a+r.rev,0))}</div><div class="tile-sub">5 markets</div></div>
      <div class="tile"><div class="lbl">Weekly costs</div><div class="mid">${money(rows.reduce((a,r)=>a+r.dayCost,0))}</div><div class="tile-sub">stalls, gas, rides</div></div>
    </div>
    <div class="card">
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>Market</th><th class="n">Avg day</th><th class="n">Costs</th><th class="n">Hours</th><th class="n">Per hour</th><th class="n">Trend</th></tr></thead>
          <tbody>${body}</tbody>
        </table>
      </div>
    </div>
    ${(()=>{
      const run = VAN_RUNS[0];
      if(!run) return "";
      const all = [run.driver].concat(run.riders);
      const soloGas = all.reduce((a,id)=>a+gasFor(mkt(id).driveMin), 0);
      const saved   = soloGas - gasFor(mkt(run.driver).driveMin);
      const riderNames = run.riders.map(id=>mkt(id).name).join(" and ");
      const driverName = mkt(run.driver).name;
      return `<div class="insight">
        <div class="insight-mark">These two go together</div>
        <p><b>${esc(driverName)} and ${esc(riderNames)} go out on one van.</b>
        Whoever is going furthest drives and drops the other off on the way, so the shop buys that gas once
        &mdash; two separate trips would burn about <b>${money(saved)}</b> more every time, which is why
        both markets look cheaper to run than they would alone.
        If you ever drop ${esc(driverName)}, ${esc(riderNames)} needs its own trip
        &mdash; look at it again before you keep it.</p>
      </div>`;
    })()}

    <div class="insight">
      <div class="insight-mark">Worth a look</div>
      <p><b>${esc(worst.m.name)} takes ${worst.hrs.toFixed(1)} hours door to door and pays ${money(worst.perHr)} an hour</b> once the ${money(worst.dayCost)} it costs to run comes out${worst.rideCost?" \u2014 stall, gas and the $20 driver run":" \u2014 stall and gas"}, against ${money(best.perHr)} at ${esc(best.m.name)}. On revenue alone it looks fine, which is why it's easy to miss.</p>
    </div>
    <div class="hint">Costs here are what the <b>market</b> takes: stall fee and gas. Driver pay, commission and anything the crew fronts are payroll &mdash; those sit on the Today screen under what the shop owes.</div>
  </div>`;
}

/* =========================================================
   Render + events
   ========================================================= */

const SELLER_SCREENS = { today:[scr_today,foot_today], loadout:[scr_loadout,foot_loadout],
  market:[scr_market,foot_market],
  closeout:[scr_closeout,foot_closeout], result:[scr_result,null] };

const OWNER_TABS = [["today","Today"],["send","Send list"],["people","People"],["markets","Markets"]];
const OWNER_SCREENS = { today:owner_today, send:owner_send, people:owner_people, markets:owner_markets };

/* The sticky footer is fixed, so it sits outside the flow and reserves no room
   on its own. Its height changes with the screen -- one button on Today, two
   stacked once you are at the market -- so any fixed padding is either wasted
   space or a clipped last line. Measure the footer we actually rendered. */
function syncFootSpace(){
  const bar = $("footHost").firstElementChild;
  $("app").style.paddingBottom = bar ? (bar.offsetHeight + 14) + "px" : "";
}


function render(){
  const app = $("app"), foot = $("footHost"), tabs = $("tabsHost");
  $("m-seller").setAttribute("aria-pressed", S.mode==="seller");
  $("m-owner").setAttribute("aria-pressed", S.mode==="owner");
  $("brandsub").textContent = S.mode==="seller" ? "Seller" : "Owner";

  if(S.mode==="owner"){
    app.className = "shell wide";
    tabs.innerHTML = `<div class="tabs"><div class="tabs-in">${
      OWNER_TABS.map(([k,l])=>`<button data-tab="${k}" aria-pressed="${S.tab===k}">${l}</button>`).join("")
    }</div></div>`;
    app.innerHTML = S.marketOpen ? owner_market(S.marketOpen) : OWNER_SCREENS[S.tab]();
    foot.innerHTML = "";
  } else {
    app.className = "shell";
    tabs.innerHTML = "";
    const [body, ft] = SELLER_SCREENS[S.screen] || SELLER_SCREENS.today;
    app.innerHTML = body();
    foot.innerHTML = ft ? `<div class="sticky-foot"><div class="sticky-foot-in">${ft()}</div></div>` : "";
  }
  syncFootSpace();
  save();
}

// Orientation change and the on-screen keyboard both resize the footer.
window.addEventListener("resize", syncFootSpace);

document.addEventListener("click", e => {
  if(e.target.closest("a")) return;          // let phone and text links through

  const opener = e.target.closest("[data-market]");
  if(opener && !e.target.closest("button")){
    S.marketOpen = opener.dataset.market; render(); window.scrollTo(0,0); return;
  }

  const t = e.target.closest("button");
  if(!t) return;
  if(t.dataset.act==="market-close"){ S.marketOpen=null; render(); window.scrollTo(0,0); return; }

  if(t.id==="m-seller"){ S.mode="seller"; S.marketOpen=null; render(); return; }
  if(t.id==="m-owner"){ S.mode="owner"; render(); return; }

  const tab = t.dataset.tab;
  if(tab){ S.tab=tab; S.marketOpen=null; render(); window.scrollTo(0,0); return; }

  const go = t.dataset.go;
  if(go){
    if(go==="loadout"){ P_IDS.forEach(p=>{ if(S.opening[p]==null) S.opening[p]=MY_REC.byProduct[p].qty; }); }
    if(go==="market" && !S.packedAt){
      S.packedAt = new Date().toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
    }
    if(go==="result"){
      S.status="closed"; S.endedAt=Date.now();
      if(!S.submittedAt) S.submittedAt = new Date().toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
    }
    S.screen = go; render(); window.scrollTo(0,0); return;
  }

  const adj = t.dataset.adj;
  if(adj){
    const p = t.dataset.p, d = Number(t.dataset.d);
    const cur = S[adj][p] ?? (adj==="opening" ? MY_REC.byProduct[p].qty : 0);
    S[adj][p] = Math.max(0, cur + d);
    render(); return;
  }

  const sold = t.dataset.sold;
  if(sold){ S.soldOut = sold==="yes"; render(); return; }

  const act = t.dataset.act;
  if(act==="toggle"){ const f=t.dataset.flag; S[f]=!S[f]; render(); return; }
  const pk = t.dataset.packer;
  if(pk){ S.packedBy = pk; S.showPacker = false; render(); return; }
  if(act==="jump"){
    const el = document.querySelector(t.dataset.sel);
    if(el){
      el.scrollIntoView({behavior:"smooth", block:"center"});
      el.classList.remove("flash");
      void el.offsetWidth;                 // restart the animation
      el.classList.add("flash");
      if(el.focus) setTimeout(()=>{ try{ el.focus({preventScroll:true}); }catch(e){} }, 380);
    }
    return;
  }
  if(act==="note-save"){
    const b = $("noteBox");
    NOTE = b ? b.value : NOTE;
    NOTE_AT = new Date().toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
    saveNote(); buzz(20); toast(NOTE.trim()?"Posted to everyone":"Message cleared"); render(); return;
  }
  if(act==="note-clear"){ NOTE=""; saveNote(); toast("Message cleared"); render(); return; }
  if(act==="exp-add"){
    if(!Array.isArray(S.expenses)) S.expenses=[];
    S.expenses.push({kind:"Gas", amount:"", source:"till"});
    render(); return;
  }
  const esrc = t.dataset.expsrc;
  if(esrc !== undefined){ S.expenses[Number(esrc)].source = t.dataset.v; render(); return; }
  const erm = t.dataset.exprm;
  if(erm !== undefined){ S.expenses[Number(erm)].photo = null; render(); return; }
  const edel = t.dataset.expdel;
  if(edel !== undefined){ S.expenses.splice(Number(edel),1); render(); return; }
  const tm = t.dataset.travel;
  if(tm){
    S.travel = Object.assign({}, S.travel, { mode:tm });
    if(tm!=="van"){ S.travel.legs=0; S.travel.passenger=""; S.travel.marketId=""; }
    if(tm!=="own"){ S.travel.gasAmount=""; }
    render(); return;
  }
  const gm = t.dataset.gasmode;
  if(gm){
    S.travel = Object.assign({}, S.travel, { gasMode:gm });
    if(gm!=="flat") S.travel.gasAmount="";
    render(); return;
  }
  const legs = t.dataset.legs;
  if(legs !== undefined){
    const n = Number(legs);
    S.travel = Object.assign({}, S.travel, { legs:n });
    if(n===0){ S.travel.passenger=""; S.travel.marketId=""; }
    render(); return;
  }
  if(act==="retake"){ S.photo=null; S.arrivedAt=null; render(); return; }
  if(act==="fix-send"){
    const box = $("fixBox");
    const v = box ? box.value.trim() : "";
    if(!v){ toast("Say what's wrong first"); return; }
    S.corrections.push({ text:v, at:new Date().toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}) });
    S.showFix = false; buzz(20); toast("Sent to the shop"); render(); return;
  }
  if(act==="reset"){ reset(); window.scrollTo(0,0); return; }
});

document.addEventListener("change", e => {
  if(e.target.id === "photoIn"){
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    readImage(f, 900, 0.7, data => {
      S.photo = data;
      S.arrivedAt = new Date().toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
      buzz(30); toast("Setup logged at "+S.arrivedAt); render();
    });
    return;
  }
  const el = e.target;

  const pf = el.dataset.photofor;
  if(pf !== undefined){
    const f = el.files && el.files[0];
    if(!f) return;
    readImage(f, 700, 0.6, data => {
      const row = S.expenses[Number(pf)];
      if(row){ row.photo = data; buzz(20); toast("Receipt attached"); render(); }
    });
    return;
  }

  const ei = el.dataset.exp;
  if(ei !== undefined){
    const row = S.expenses[Number(ei)];
    if(row){ row[el.dataset.f] = el.dataset.f==="amount" ? el.value : el.value; render(); }
    return;
  }

  const key = el.dataset.set;
  if(!key) return;
  if(key==="ownerNote"){ NOTE = el.value; return; }
  if(key==="passenger"){ S.travel = Object.assign({}, S.travel, {passenger:el.value}); render(); return; }
  if(key==="passengerMarket"){ S.travel = Object.assign({}, S.travel, {marketId:el.value}); render(); return; }
  if(key==="gasAmount"){ S.travel = Object.assign({}, S.travel, {gasAmount:el.value}); render(); return; }
  if(key==="opening" || key==="closing"){
    S[key][el.dataset.p] = Math.max(0, Math.round(Number(el.value)||0));
    render();
  } else {
    S[key] = el.value;
    if(key==="cashCounted"||key==="cardTotal") render();
  }
});

render();
})();
</script>

<script>
/* Offline support. Needs http/https, so this quietly does nothing when the
   file is opened straight off disk - the app still works, just without the
   cache. */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){ /* not fatal */ });
  });
}
</script>
