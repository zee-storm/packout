function owner_today(){
  const cards = TODAY_PLAN.map(plan=>{
    const m = mkt(plan.marketId);
    const d = liveDay(plan);
    const closed = d.status==="Closed";
    // Low yield is worth a look, never an accusation - it is mostly discount.
    const thin = closed && d.perPack!==null && d.perPack < d.fullPer*0.88;
    const stripe = closed ? (thin ? "warn" : "good") : (d.live ? "live" : "");
    const pill = closed
      ? (d.perPack!==null
          ? `<span class="pill ${thin?"pill-warn":"pill-good"}">${money2(d.perPack)} a pack</span>`
          : `<span class="pill pill-good">Closed</span>`)
      : d.live
        ? `<span class="pill pill-live"><span class="dot"></span>${esc(d.status)}</span>`
        : `<span class="pill">${esc(d.status)}</span>`;
    return `<div class="card stripe stripe-${stripe}" data-market="${m.id}" style="cursor:pointer">
      <div class="card-hd">
        <div><h3>${esc(m.name)}</h3>
          <div class="sub" style="margin-top:3px">
            ${d.phone
              ? `<a href="sms:${esc(d.phone.replace(/[^0-9+]/g,""))}" style="color:var(--accent);text-decoration:none;font-weight:600">${esc(d.name)}</a>`
              : esc(d.name)} \u00B7 ${esc(m.hours || (m.evening ? SHOP.eveningHours : DAY_FULL[m.day]))} \u00B7 <span style="color:var(--accent)">open</span>
          </div></div>
        ${pill}
      </div>
      <div class="card-pad row" style="gap:26px">
        ${closed
          ? `<div><div class="lbl">Packs</div><div class="mid" style="margin-top:5px">${d.sold}</div></div>
             <div><div class="lbl">Money</div><div class="mid" style="margin-top:5px">${money(d.rev)}</div></div>`
          : `<div><div class="lbl">Took out</div><div class="mid" style="margin-top:5px">${d.out||0}</div></div>
             <div><div class="lbl">Reports at</div><div class="mid" style="margin-top:5px">close</div></div>`}
        <div style="margin-left:auto;text-align:right"><div class="lbl">Stall fee</div><div class="mid" style="margin-top:5px">${money(feeOf(m))}</div></div>
      </div>
      ${(d.overSend || d.fixes || d.packedByOther) ? `<div class="card-pad" style="padding-top:0"><div class="chips">
        ${d.overSend ? `<span class="chip chip-hi">took ${d.overSend>0?"+":"\u2212"}${Math.abs(d.overSend)} vs send list</span>` : ""}
        ${d.fixes ? `<span class="chip chip-hi">${d.fixes} correction asked</span>` : ""}
        ${d.packedByOther ? `<span class="chip chip-hi">cooler packed by ${esc(d.packedByOther)}</span>` : ""}
      </div></div>` : ""}
    </div>`;
  }).join("");

  const all       = TODAY_PLAN.map(liveDay);
  const closedOnes= all.filter(d=>d.status==="Closed");
  const totSold   = closedOnes.reduce((a,d)=>a+d.sold,0);
  const totRev    = closedOnes.reduce((a,d)=>a+d.rev,0);
  const fees      = TODAY_PLAN.reduce((a,p)=>a+feeOf(mkt(p.marketId)),0);
  const feesAreGuessed = TODAY_PLAN.every(p => !feeKnown(mkt(p.marketId)));
  const nClosed   = closedOnes.length, nAll = TODAY_PLAN.length;
  const dayDriverPay = VAN_RUNS.length * DRIVER_LEG_PAY * 2;   // one drop-off run, both ways
  const owedCrew  = closedOnes.reduce((a,d)=>a+(d.owed||0),0) + dayDriverPay;

  return `<div class="pad stack">
    <div>
      <div class="lbl">${esc(fmtDate(TODAY))}</div>
      <h1 class="page" style="margin-top:6px">${nAll} market${nAll===1?"":"s"} running</h1>
      <p class="note" style="margin-top:5px">Numbers land as each market closes out. Nobody is on their phone while they sell.</p>
    </div>
    <div class="tiles">
      <div class="tile"><div class="lbl">Packs sold</div><div class="mid">${totSold}</div><div class="tile-sub">${nClosed} of ${nAll} closed</div></div>
      <div class="tile"><div class="lbl">Money in</div><div class="mid">${money(totRev)}</div><div class="tile-sub">cash + card</div></div>
      <div class="tile"><div class="lbl">Stall fees</div><div class="mid">${money(fees)}</div><div class="tile-sub">${feesAreGuessed?`estimate &mdash; no real fees entered yet`:`${money(dayDriverPay)} driving on top`}</div></div>
      <div class="tile"><div class="lbl">Owed to crew</div><div class="mid">${money(owedCrew)}</div><div class="tile-sub">commission, driving, money fronted</div></div>
    </div>
    ${(()=>{
      /* Who is getting the least out of each pack. Says what it costs, and
         nothing about why - free ones, their own deals and trades all land
         here, and none of it is provable from a count. */
      /* This is the screen that says whose packs bring in the least, and it
         is the one thing in here that must never run on made-up days. The
         sample history exists to show what the screens do; put a real name
         next to it and Nawid takes a number nobody earned to Habid.

         So until enough real days have been reported, it says what it will
         do and names nobody. */
      const realDays = REAL_DAYS ? Object.keys(REAL_DAYS).length : 0;
      if(realDays < 8){
        return `<div class="insight">
          <div class="insight-mark">Once the days add up</div>
          <p>This is where the app tells you <b>whose packs bring in the least money each</b>,
          and by how much across everything they have sold. It needs real reported days first
          &mdash; ${realDays === 0 ? "none have come in yet" : realDays + " so far"}. Nothing here is
          guessed at, because a guess with somebody's name on it is worse than nothing.</p>
        </div>`;
      }
      const crew = crewYield();
      const recs = SELLERS.map(s=>({s, r:yieldRecord(s.id)})).filter(x=>x.r.sold>0);
      if(recs.length < 2) return "";
      const low = recs.slice().sort((a,b)=>a.r.per-b.r.per)[0];
      const behind = crew - low.r.per;
      if(behind < 0.5) return "";
      const first = low.s.name.split(" ")[0];
      return `<div class="insight">
        <div class="insight-mark">Heads up</div>
        <p><b>${esc(first)}'s packs bring in ${money2(low.r.per)} each.</b>
        The crew averages ${money2(crew)}. Across the ${low.r.sold} packs ${esc(first)} has sold,
        that gap is ${money(behind*low.r.sold)} &mdash; free ones, deals and trades all land in it.
        Worth asking about, not worth accusing anyone over.</p>
      </div>`;
    })()}
    <div class="card">
      <div class="card-hd"><h3>Message to the crew</h3><span class="pill">${NOTE.trim()?"saved "+esc(NOTE_AT):"nothing saved"}</span></div>
      <div class="card-pad stack-sm">
        <div class="field">
          <textarea id="noteBox" placeholder="Push the oldest batch today." data-set="ownerNote">${esc(NOTE)}</textarea>
        </div>
        <div class="row" style="gap:8px">
          <button class="btn btn-sm" data-act="note-save" style="flex:2">Save this message</button>
          <button class="btn btn-quiet btn-sm" data-act="note-clear" style="flex:1">Clear</button>
        </div>
        <div class="hint"><b>This stays on your phone for now.</b> Getting it onto the
        crew's phones is not built yet, so for anything they need today, text them.</div>
      </div>
    </div>

    <h2 class="sec">Markets</h2>
    <div class="stack-sm">${cards}</div>
  </div>`;
}

function owner_people(){
  const rows = SELLERS.map(s=>{
    const days = HISTORY.filter(d=>d.sellerId===s.id);
    let vsSum=0, perHrSum=0, n=0;
    days.forEach(d=>{
      const st = dayStats(d);
      const peers = HISTORY.filter(x=>x.marketId===d.marketId);
      const peerAvg = peers.reduce((a,x)=>a+dayStats(x).sold,0)/peers.length;
      vsSum += (st.sold/peerAvg - 1);
      perHrSum += st.revenue/st.hrs;
      n++;
    });
    const vs = (vsSum/n)*100;
    const perHr = perHrSum/n;
    const y = yieldRecord(s.id);
    return { s, vs, perHr, per:y.per, fullPer:y.fullPer, n, days };
  }).sort((a,b)=>b.vs-a.vs);

  const body = rows.map(r=>`<tr>
    <td><div class="who">${esc(r.s.name)}</div><div class="sub">${r.n} market days</div></td>
    <td class="n"><span class="delta ${r.vs>=0?"up":"down"}">${r.vs>=0?"+":""}${r.vs.toFixed(0)}%</span></td>
    <td class="n">${money(r.perHr)}</td>
    <td class="n"><span class="pill ${r.per < r.fullPer*0.88 ? "pill-warn":"pill-good"}">${money2(r.per)}</span></td>
  </tr>`).join("");

  return `<div class="pad stack">
    <div>
      <h1 class="page">People</h1>
      <p class="note" style="margin-top:5px">Each person is measured against what that market normally does \u2014 not against each other. A big market doesn't make you a better seller.</p>
    </div>
    <div class="card card-pad stripe stripe-warn">
      <div class="lbl">Sample figures</div>
      <p class="note" style="margin-top:6px">Every number on this screen is worked from made-up days,
      so you can see what it does. It turns into your own the moment enough real days have been
      sent in. <b>Nothing here is a fact about anybody yet.</b></p>
    </div>
    <div class="card">
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>Seller</th><th class="n">vs market avg</th><th class="n">$/hour</th><th class="n">$ per pack</th></tr></thead>
          <tbody>${body}</tbody>
        </table>
      </div>
    </div>
    ${(()=>{
      const sw = bestSwap();
      if(!sw || sw.gain < 40) return "";
      const aS=slr(sw.a.sellerId), bS=slr(sw.b.sellerId), aM=mkt(sw.a.marketId), bM=mkt(sw.b.marketId);
      const pct = (s,m)=>{ const v=Math.round(perfPct(s,m)*100); return (v>0?"+":v<0?"\u2212":"")+Math.abs(v)+"%"; };
      // whoever gains more by moving to the other's market goes first
      return `<div class="insight">
        <div class="insight-mark">Swap these two</div>
        <p>At <b>${esc(bM.name)}</b>, ${esc(aS.name)} runs <b>${pct(aS.id,bM.id)}</b> against that market's own average and
        ${esc(bS.name)} runs <b>${pct(bS.id,bM.id)}</b>. Today they're booked the other way around &mdash;
        ${esc(bS.name)} has ${esc(bM.name)} and ${esc(aS.name)} has ${esc(aM.name)}.
        Trading them is worth about <b>${money(sw.gain)}</b> today.</p>
      </div>`;
    })()}
    <div class="card">
      <div class="card-hd"><h3>This week's pay</h3><span class="pill">day rate or commission, whichever is more</span></div>
      <div class="card-pad">
        ${SELLERS.map(s=>{
          const wk = HISTORY.filter(d=>d.sellerId===s.id).slice(-2);
          const amt = wk.reduce((a,d)=>a+dayStats(d).commission,0);
          return `<div class="kv"><span class="kv-k">${esc(s.name)} <span class="sub">\u2014 ${wk.length} days</span></span><span class="kv-v">${money2(amt)}</span></div>`;
        }).join("")}
        <div class="kv kv-total"><span class="kv-k">Total payroll</span><span class="kv-v">${money2(SELLERS.reduce((a,s)=>a+HISTORY.filter(d=>d.sellerId===s.id).slice(-2).reduce((b,d)=>b+dayStats(d).commission,0),0))}</span></div>
      </div>
    </div>
    <div class="hint">Each seller sees their own pay worked out the same way on their own phone, so there's nothing to argue about on payday.</div>
  </div>`;
}

function owner_markets(){
  const rows = MARKETS.map(m=>{
    const days = HISTORY.filter(d=>d.marketId===m.id);
    const st = days.map(dayStats);
    const rev = st.reduce((a,x)=>a+x.revenue,0)/st.length;
    const perHr = st.reduce((a,x)=>a+x.perHr,0)/st.length;
    const recent = st.slice(-3).reduce((a,x)=>a+x.revenue,0)/3;
    const older  = st.slice(0,3).reduce((a,x)=>a+x.revenue,0)/3;
    const trend = (recent/older-1)*100;
    const hrs = hoursWorked(m);
    const vc = vanCostFor(m.id);
    const dayCost = feeOf(m) + vc.gas;
    const soloCost = feeOf(m) + gasFor(m.driveMin);   // what it would cost on its own trip
    const perHrTrue = (rev - dayCost)/hrs;
    return { m, rev, perHr:perHrTrue, trend, hrs,
             rideCost:vc.ride, gas:vc.gas, dayCost, soloCost,
             shareNames:vc.shareNames, rider:vc.rider,
             soloPerHr:(rev - soloCost)/hrs,
             sold: st.reduce((a,x)=>a+x.sold,0)/st.length };
  }).sort((a,b)=>b.perHr-a.perHr);

  const best = rows[0], worst = rows[rows.length-1];

  const body = rows.map(r=>`<tr data-market="${r.m.id}" style="cursor:pointer">
    <td><div class="who" style="color:var(--accent)">${esc(r.m.name)}</div><div class="sub">${esc(r.m.day)} \u00B7 ${r.m.driveMin}min drive</div></td>
    <td class="n">${money(r.rev)}</td>
    <td class="n">${money(r.dayCost)}${r.shareNames.length?`<div class="sub">shares a van</div>`:""}</td>
    <td class="n">${r.hrs.toFixed(1)}</td>
    <td class="n" style="font-weight:600">${money(r.perHr)}</td>
    <td class="n"><span class="delta ${r.trend>=0?"up":"down"}">${r.trend>=0?"\u25B2":"\u25BC"} ${Math.abs(r.trend).toFixed(0)}%</span></td>
  </tr>`).join("");

  return `<div class="pad stack">
    <div>
      <h1 class="page">Markets</h1>
      <p class="note" style="margin-top:5px">Sorted by what each one actually pays per hour worked \u2014 including packing, driving both ways, setup and teardown. Not just the four hours of selling.</p>
    </div>
    <div class="card card-pad stripe stripe-warn">
      <div class="lbl">Sample figures</div>
      <p class="note" style="margin-top:6px">Every number on this screen is worked from made-up days,
      so you can see what it does. It turns into your own the moment enough real days have been
      sent in. <b>Nothing here is a fact about anybody yet.</b></p>
    </div>
    <div class="tiles">
      <div class="tile"><div class="lbl">Best per hour</div><div class="mid">${money(best.perHr)}</div><div class="tile-sub">${esc(best.m.name)}</div></div>
      <div class="tile"><div class="lbl">Worst per hour</div><div class="mid">${money(worst.perHr)}</div><div class="tile-sub">${esc(worst.m.name)}</div></div>
      <div class="tile"><div class="lbl">Weekly revenue</div><div class="mid">${money(rows.reduce((a,r)=>a+r.rev,0))}</div><div class="tile-sub">${MARKETS.length} slots a week</div></div>
      <div class="tile"><div class="lbl">Weekly costs</div><div class="mid">${money(rows.reduce((a,r)=>a+r.dayCost,0))}</div><div class="tile-sub">stalls, gas, rides</div></div>
    </div>
    <div class="card">
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>Market</th><th class="n">Avg day</th><th class="n">Costs</th><th class="n">Hours</th><th class="n">Per hour</th><th class="n">Trend</th></tr></thead>
          <tbody>${body}</tbody>
        </table>
      </div>
    </div>
    ${(()=>{
      const run = VAN_RUNS[0];
      if(!run) return "";
      const all = [run.driver].concat(run.riders);
      const soloGas = all.reduce((a,id)=>a+gasFor(mkt(id).driveMin), 0);
      const saved   = soloGas - gasFor(mkt(run.driver).driveMin);
      const riderNames = run.riders.map(id=>mkt(id).name).join(" and ");
      const driverName = mkt(run.driver).name;
      return `<div class="insight">
        <div class="insight-mark">These two go together</div>
        <p><b>${esc(driverName)} and ${esc(riderNames)} go out on one van.</b>
        Whoever is going furthest drives and drops the other off on the way, so the shop buys that gas once
        &mdash; two separate trips would burn about <b>${money(saved)}</b> more every time, which is why
        both markets look cheaper to run than they would alone.
        If you ever drop ${esc(driverName)}, ${esc(riderNames)} needs its own trip
        &mdash; look at it again before you keep it.</p>
      </div>`;
    })()}

    <div class="insight">
      <div class="insight-mark">Worth a look</div>
      <p><b>${esc(worst.m.name)} takes ${worst.hrs.toFixed(1)} hours door to door and pays ${money(worst.perHr)} an hour</b> once the ${money(worst.dayCost)} it costs to run comes out${worst.rideCost?" \u2014 stall, gas and the $20 driver run":" \u2014 stall and gas"}, against ${money(best.perHr)} at ${esc(best.m.name)}. On revenue alone it looks fine, which is why it's easy to miss.</p>
    </div>
    <div class="hint">Costs here are what the <b>market</b> takes: stall fee and gas. Driver pay, commission and anything the crew fronts are payroll &mdash; those sit on the Today screen under what the shop owes.</div>
  </div>`;
}

/* =========================================================
   Render + events
   ========================================================= */

const SELLER_SCREENS = { today:[scr_today,foot_today], loadout:[scr_loadout,foot_loadout],
  market:[scr_market,foot_market],
  closeout:[scr_closeout,foot_closeout], result:[scr_result,null] };

const OWNER_TABS = [["today","Today"],["send","Send list"],["people","People"],["markets","Markets"]];
const OWNER_SCREENS = { today:owner_today, send:owner_send, people:owner_people, markets:owner_markets };

/* The sticky footer is fixed, so it sits outside the flow and reserves no room
   on its own. Its height changes with the screen -- one button on Today, two
   stacked once you are at the market -- so any fixed padding is either wasted
   space or a clipped last line. Measure the footer we actually rendered. */
function syncFootSpace(){
  const bar = $("footHost").firstElementChild;
  $("app").style.paddingBottom = bar ? (bar.offsetHeight + 14) + "px" : "";
}


function render(){
  const app = $("app"), foot = $("footHost"), tabs = $("tabsHost");
  $("m-seller").setAttribute("aria-pressed", S.mode==="seller");
  $("m-owner").setAttribute("aria-pressed", S.mode==="owner");
  $("brandsub").textContent = S.mode==="seller" ? "Seller" : "Owner";

  if(S.mode==="owner"){
    app.className = "shell wide";
    tabs.innerHTML = `<div class="tabs"><div class="tabs-in">${
      OWNER_TABS.map(([k,l])=>`<button data-tab="${k}" aria-pressed="${S.tab===k}">${l}</button>`).join("")
    }</div></div>`;
    app.innerHTML = S.marketOpen ? owner_market(S.marketOpen) : OWNER_SCREENS[S.tab]();
    foot.innerHTML = "";
  } else {
    app.className = "shell";
    tabs.innerHTML = "";
    const enrolled = AUTH.person || AUTH.demo;
    const [body, ft] = !enrolled          ? [scr_whoami, null]
                     : !S.me              ? [scr_pickdemo, null]
                     : !myMarketToday()   ? [scr_dayoff, null]
                     : (SELLER_SCREENS[S.screen] || SELLER_SCREENS.today);
    app.innerHTML = body();
    foot.innerHTML = ft ? `<div class="sticky-foot"><div class="sticky-foot-in">${ft()}</div></div>` : "";
  }
  syncFootSpace();
  save();
}

// Orientation change and the on-screen keyboard both resize the footer.
window.addEventListener("resize", syncFootSpace);

document.addEventListener("click", e => {
  if(e.target.closest("a")) return;          // let phone and text links through

  const opener = e.target.closest("[data-market]");
  if(opener && !e.target.closest("button")){
    S.marketOpen = opener.dataset.market; render(); window.scrollTo(0,0); return;
  }

  const t = e.target.closest("button");
  if(!t) return;
  if(t.dataset.act==="market-close"){ S.marketOpen=null; render(); window.scrollTo(0,0); return; }

  if(t.id==="m-seller"){ S.mode="seller"; S.marketOpen=null; render(); return; }
  if(t.id==="m-owner"){
    S.mode="owner"; render();
    loadRealDays().then(()=>{ if(S.mode==="owner") render(); });
    return;
  }

  const tab = t.dataset.tab;
  if(tab){
    S.tab=tab; S.marketOpen=null; render(); window.scrollTo(0,0);
    if(tab==="today") loadRealDays().then(()=>{ if(S.mode==="owner" && S.tab==="today") render(); });
    return;
  }

  const go = t.dataset.go;
  if(go){
    if(go==="loadout"){ P_IDS.forEach(p=>{ if(S.opening[p]==null) S.opening[p]=MY_REC.byProduct[p].qty; }); }
    if(go==="market" && !S.packedAt){
      S.packedAt = new Date().toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
    }
    if(go==="result"){
      S.status="closed"; S.endedAt=Date.now();
      if(!S.submittedAt) S.submittedAt = new Date().toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
      // Fire and forget: a market with no signal must not block the screen.
      sendDay().then(() => render());
    }
    S.screen = go; render(); window.scrollTo(0,0); return;
  }

  const adj = t.dataset.adj;
  if(adj){
    const p = t.dataset.p, d = Number(t.dataset.d);
    const cur = S[adj][p] ?? (adj==="opening" ? MY_REC.byProduct[p].qty : 0);
    S[adj][p] = Math.max(0, cur + d);
    render(); return;
  }

  if(t.dataset.act==="retry-send"){
    sendDay().then(()=>render());
    toast("Trying…"); return;
  }
  if(t.dataset.act==="addpay"){
    S.otherPays = (S.otherPays||[]).concat([{how:"", amount:""}]);
    render(); return;
  }
  if(t.dataset.paydel!==undefined){
    S.otherPays.splice(Number(t.dataset.paydel), 1);
    render(); return;
  }

  if(t.dataset.act==="redeem"){
    // Phone keyboards turn a typed hyphen into an en dash and drop spaces in,
    // and a code that is right but punctuated wrong should still work.
    const code = (S.codeTyped||"").toUpperCase()
                   .replace(/[\u2010-\u2015]/g, "-")
                   .replace(/\s+/g, "")
                   .trim();
    if(!code){ S.codeError="Type the code Nawid gave you."; render(); return; }
    S.codeError = "Checking\u2026"; render();
    redeemCode(code).then(res => {
      if(res.ok){
        S.me = AUTH.person; S.codeError = null; S.codeTyped = "";
        MY_MARKET = marketOrAny(); MY_REC = recommendMarket(MY_MARKET.id);
        S.screen = "today";
      } else {
        S.codeError = res.msg;
      }
      render(); window.scrollTo(0,0);
    });
    return;
  }
  if(t.dataset.act==="demo"){
    AUTH.demo = true; saveAuth(); S.codeError=null; render(); window.scrollTo(0,0); return;
  }

  if(t.dataset.me){
    S.me = t.dataset.me;
    MY_MARKET = marketOrAny();
    MY_REC = recommendMarket(MY_MARKET.id);
    S.screen = "today";
    render(); window.scrollTo(0,0); return;
  }
  if(t.dataset.act==="switch-me"){
    /* This signs the phone out, and codes are single use - so the way back in
       is a new code from Nawid, which on a market morning he may not be awake
       to send. It sat on the seller's own market screen reading "Bahir · not
       you?", one tap, no warning. Somebody curious about their own app locks
       themselves out of the day they are about to work.

       Handing the phone to someone else is a real thing, so the button stays.
       It asks first. */
    if(!AUTH.demo && AUTH.person){
      const who = AUTH.name || "this phone";
      const ok = confirm("Sign " + who + " out of this phone?\n\n"
        + "You will need a new code from Nawid before you can use it again. "
        + "Only do this if somebody else is taking the phone.");
      if(!ok) return;
    }
    S.me = null;
    if(!AUTH.demo){ AUTH.person=null; AUTH.name=null; AUTH.business=null; AUTH.role=null; saveAuth(); }
    render(); window.scrollTo(0,0); return;
  }

  const sold = t.dataset.sold;
  if(sold){ S.soldOut = sold==="yes"; render(); return; }

  const act = t.dataset.act;
  if(act==="toggle"){ const f=t.dataset.flag; S[f]=!S[f]; render(); return; }
  const pk = t.dataset.packer;
  if(pk){ S.packedBy = pk; S.showPacker = false; render(); return; }
  if(act==="jump"){
    const el = document.querySelector(t.dataset.sel);
    if(el){
      el.scrollIntoView({behavior:"smooth", block:"center"});
      el.classList.remove("flash");
      void el.offsetWidth;                 // restart the animation
      el.classList.add("flash");
      if(el.focus) setTimeout(()=>{ try{ el.focus({preventScroll:true}); }catch(e){} }, 380);
    }
    return;
  }
  if(act==="note-save"){
    const b = $("noteBox");
    NOTE = b ? b.value : NOTE;
    NOTE_AT = new Date().toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
    saveNote(); buzz(20); toast(NOTE.trim()?"Saved on this phone":"Message cleared"); render(); return;
  }
  if(act==="note-clear"){ NOTE=""; saveNote(); toast("Message cleared"); render(); return; }
  if(act==="exp-add"){
    if(!Array.isArray(S.expenses)) S.expenses=[];
    S.expenses.push({kind:"Gas", amount:"", source:"till"});
    render(); return;
  }
  const esrc = t.dataset.expsrc;
  if(esrc !== undefined){ S.expenses[Number(esrc)].source = t.dataset.v; render(); return; }
  const erm = t.dataset.exprm;
  if(erm !== undefined){ S.expenses[Number(erm)].photo = null; render(); return; }
  const edel = t.dataset.expdel;
  if(edel !== undefined){ S.expenses.splice(Number(edel),1); render(); return; }
  const tm = t.dataset.travel;
  if(tm){
    S.travel = Object.assign({}, S.travel, { mode:tm });
    if(tm!=="van"){ S.travel.legs=0; S.travel.passenger=""; S.travel.marketId=""; }
    if(tm!=="own"){ S.travel.gasAmount=""; }
    render(); return;
  }
  const gm = t.dataset.gasmode;
  if(gm){
    S.travel = Object.assign({}, S.travel, { gasMode:gm });
    if(gm!=="flat") S.travel.gasAmount="";
    render(); return;
  }
  const legs = t.dataset.legs;
  if(legs !== undefined){
    const n = Number(legs);
    S.travel = Object.assign({}, S.travel, { legs:n });
    if(n===0){ S.travel.passenger=""; S.travel.marketId=""; }
    render(); return;
  }
  if(act==="retake"){ S.photo=null; S.arrivedAt=null; render(); return; }
  if(act==="fix-send"){
    const box = $("fixBox");
    const v = box ? box.value.trim() : "";
    if(!v){ toast("Say what's wrong first"); return; }
    S.corrections.push({ text:v, at:new Date().toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}) });
    S.showFix = false; buzz(20); toast("Sent to the shop"); render(); return;
  }
  if(act==="reset"){ reset(); window.scrollTo(0,0); return; }
});

/* Keep every keystroke.

   The app used to record a field only when you tapped away from it. Type a
   number, tap the button, and it was gone - which is exactly what happened
   to a seller who told us he had written down $50 of giveaway and then had
   to conclude he must have "messed up something else". He had not. The app
   ate it.

   So a value is stored as it is typed. Redrawing still waits for the field
   to be left, because replacing the box mid-word would throw the keyboard
   and the cursor away. */
document.addEventListener("input", e => {
  const el = e.target;
  if(!el || el.id === "photoIn") return;

  if(el.dataset.pay !== undefined){
    const row = S.otherPays[Number(el.dataset.pay)];
    if(row) row[el.dataset.f] = el.value;
    save(); return;
  }
  if(el.dataset.exp !== undefined){
    const row = S.expenses[Number(el.dataset.exp)];
    if(row) row[el.dataset.f] = el.value;
    save(); return;
  }

  const key = el.dataset.set;
  if(!key || key === "ownerNote") return;
  if(PER_PRODUCT.includes(key)){
    const v = el.value;
    const blank = key === "opening" || key === "closing" ? undefined : 0;
    S[key][el.dataset.p] = v === "" ? blank : Math.max(0, Math.round(Number(v) || 0));
  } else if(key === "passenger" || key === "passengerMarket" || key === "gasAmount"){
    return;                       // these are selects; change is enough
  } else {
    S[key] = el.value;
  }
  save();
});

document.addEventListener("change", e => {
  if(e.target.id === "photoIn"){
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    readImage(f, 900, 0.7, data => {
      S.photo = data;
      S.arrivedAt = new Date().toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
      buzz(30); toast("Setup logged at "+S.arrivedAt); render();
    });
    return;
  }
  const el = e.target;

  const pf = el.dataset.photofor;
  if(pf !== undefined){
    const f = el.files && el.files[0];
    if(!f) return;
    readImage(f, 700, 0.6, data => {
      const row = S.expenses[Number(pf)];
      if(row){ row.photo = data; buzz(20); toast("Receipt attached"); render(); }
    });
    return;
  }

  const ei = el.dataset.exp;
  if(ei !== undefined){
    const row = S.expenses[Number(ei)];
    if(row){ row[el.dataset.f] = el.dataset.f==="amount" ? el.value : el.value; render(); }
    return;
  }

  if(el.dataset.pay!==undefined){
    const row = S.otherPays[Number(el.dataset.pay)];
    if(row){ row[el.dataset.f] = el.value; if(el.dataset.f==="amount") render(); }
    return;
  }

  const key = el.dataset.set;
  if(!key) return;
  if(key==="ownerNote"){ NOTE = el.value; return; }
  if(key==="passenger"){ S.travel = Object.assign({}, S.travel, {passenger:el.value}); render(); return; }
  if(key==="passengerMarket"){ S.travel = Object.assign({}, S.travel, {marketId:el.value}); render(); return; }
  if(key==="gasAmount"){ S.travel = Object.assign({}, S.travel, {gasAmount:el.value}); render(); return; }
  if(PER_PRODUCT.includes(key)){
    S[key][el.dataset.p] = Math.max(0, Math.round(Number(el.value)||0));
    render();
  } else {
    S[key] = el.value;
    if(key==="cashCounted"||key==="cardTotal"||key==="chipsSold") render();
  }
});

ensureSession();

render();

/* A day that never made it off the phone goes again on its own - on
   load, and the moment the phone says it is back online. The seller
   should never have to remember to resend anything. */
if(S.mode === "owner") loadRealDays().then(()=>{ if(S.mode==="owner") render(); });

function resendIfPending(){
  if(S.status === "closed" && S.submittedAt && !S.sentAt) sendDay().then(() => render());
}
resendIfPending();
window.addEventListener("online", resendIfPending);
})();
</script>

<script>
/* Offline support. Needs http/https, so this quietly does nothing when the
   file is opened straight off disk - the app still works, just without the
   cache. */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){ /* not fatal */ });
  });
}
</script>
