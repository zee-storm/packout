        : (raw || "That code did not work.") };
    }
    const row = Array.isArray(d) ? d[0] : d;
    if(!row) return { ok:false, msg:"That code did not work." };
    AUTH.business = row.out_business_id;
    AUTH.person   = row.out_person_id;
    AUTH.name     = row.out_person_name;
    AUTH.role     = row.out_role;
    saveAuth();
    /* Which business this phone joined. Only used to know whether it is the
       sandbox - and it has to be stored, because the check runs before
       anything is fetched, on the very first line of the app. */
    // Never carry the last business's name into this one: a failed lookup
    // must read as "not the sandbox", not as whatever this phone was before.
    AUTH.businessName = null; saveAuth();
    try{
      const b = await fetch(CLOUD.url + "/rest/v1/businesses?select=name&id=eq."
        + encodeURIComponent(AUTH.business), { headers: cloudHeaders() });
      if(b.ok){ const rows = await b.json(); AUTH.businessName = (rows[0]||{}).name || null; saveAuth(); }
    }catch(e){ /* a missing name just means "not the sandbox", which is safe */ }
    return { ok:true };
  }catch(e){
    return { ok:false, msg:"No signal. Try again in a moment." };
  }
}

// What one finished day looks like on the wire - the paper, as data.
/* The market this day belongs to - not whichever one the phone is showing.
   They are the same on a market day and different on every other day. */
const dayMarket = () => (S.marketId && mkt(S.marketId)) || null;

function sellerNameForDay(){
  const id = S.submittedBy || S.me;
  return (slr(id) || {}).name
      || (id && id === S.submittedBy ? S.submittedByName : null)
      || (id && id === S.dayOwner ? S.dayOwnerName : null)
      || (id && id === AUTH.person ? AUTH.name : null)
      || null;
}
function dayPayload(){
  const m = dayMarket() || MY_MARKET, who = me();
  return {
    ...(S.dayRowId ? { id: S.dayRowId } : {}),
    business_id: CLOUD.business,
    market_id: m.id,
    market_name: m.name,
    day_date: S.dayOf || todayStamp(),
    seller_id: S.submittedBy || S.me || null,
    seller_name: sellerNameForDay(),
    // Whose count the cooler is: the seller's own name, not "You".
    packed_by: (!S.packedBy || S.packedBy === "you") ? sellerNameForDay() : packedByName(),
    cash: Number(S.cashCounted) || 0,
    card: Number(S.cardTotal) || 0,
    other_pays: (S.otherPays || []).filter(o => Number(o.amount)),
    chips_sold: chipsSold(),
    spent_from_till: expTotal("till"),
    // What the seller laid out of their own pocket. The shop owes this back on
    // top of pay, and until now it never left the phone - the seller's screen
    // said one number and the owner's said a smaller one.
    fronted: expTotal("own"),
    fronted_items: (S.expenses || []).filter(e => e.source === "own" && Number(e.amount)),
    discounts: Number(S.discounts) || 0,
    /* The note carries two answers that never left the phone before: whether
       they sold out, and when - asked on every count-up - and a big-order lead,
       a customer's name and number the seller was told was "saved". The day is
       wiped when the next one starts, so both were gone by the next market. */
    note: [String(S.note || "").trim(),
           S.soldOut ? "Sold out" + (String(S.soldOutAt || "").trim() ? " at " + String(S.soldOutAt).trim() : "") : "",
           String(S.lead || "").trim() ? "Big order: " + String(S.lead).trim() : ""]
          .filter(Boolean).join("\n") || null,
    /* How they got there, and what that adds to their pay. Both were on the
       seller's "shop owes you" from the start and never left the phone, so
       Nawid's figure was short by exactly that - $20 for one seller, $25 for another. */
    travel: travelRecord(),
    driving_pay: driverPay(),
    car_gas: carAllowance()
  };
}

// The travel card as the shop sees it: names, not ids.
function travelRecord(){
  const t = S.travel || {};
  const who = t.passenger ? slr(t.passenger) : null;
  const to  = t.marketId ? mkt(t.marketId) : null;
  return {
    how: t.mode || null,                               // van, own, ride
    legs: t.mode === "van" ? (Number(t.legs) || 0) : 0, // 1 one way, 2 drop off and pick up
    passenger: t.mode === "van" ? (who ? who.name : (String(t.passenger || "").trim() || null)) : null,
    to_market: t.mode === "van" && to ? to.name : null,
    gas: t.mode === "own" ? (t.gasMode || null) : null  // claim (a receipt) or flat
  };
}

/* Sending the sheet itself. The travel columns arrive with db/025; a phone
   that has the new app before that SQL is run must still get its day in, so
   if the database says it has no such column, the day goes again without
   them - exactly as it went before. Used by the day and by the waiting-days
   queue, which both post sheets. */
const TRAVEL_FIELDS = ["travel", "driving_pay", "car_gas"];
async function postDayRow(payload){
  const post = body => fetch(CLOUD.url + "/rest/v1/market_days", {
    method: "POST",
    headers: cloudHeaders({ "Prefer": "return=representation" }),
    body: JSON.stringify(body)
  });
  let res = await post(payload);
  /* 401 means the server did not accept this phone's pass - almost always an
     hour-old pass that could not be renewed a moment ago because the server
     hiccuped. That is not a dead sign-in, and telling the seller to get a new
     code would throw away a sign-in that still works. Renew once and try again.
     A sign-in that really is gone shows up in the renewal itself
     (AUTH.signinBroken), and a phone that isn't part of the business is refused
     with 403, not 401. */
  if(res.status === 401){
    AUTH.expires = 0;
    if(await ensureSession()) res = await post(payload);
  }
  if(res.status !== 400) return res;
  const d = await res.clone().json().catch(() => ({}));
  const missing = d.code === "PGRST204" || TRAVEL_FIELDS.some(k => String(d.message || "").includes(k));
  if(!missing) return res;
  const lean = Object.assign({}, payload);
  TRAVEL_FIELDS.forEach(k => { delete lean[k]; });
  return post(lean);
}

function countRows(dayId){
  return WENT_OUT().map(pid => ({
    business_id: CLOUD.business,
    market_day_id: dayId,
    product_id: pid,
    product_name: prod(pid).name,
    went_out: S.opening[pid] || 0,
    came_back: Number(S.closing[pid]) || 0,
    samples: S.samples[pid] || 0,
    damaged: S.damaged[pid] || 0
  }));
}

/* Days that have actually arrived, keyed by market. Null until fetched.

   Once a market day can be real, inventing one is worse than showing
   nothing: the owner cannot tell a made-up number from a reported one,
   and would trust both. So Today shows only what was really sent, and
   says plainly when a market has not reported yet. */
let REAL_DAYS = null;

async function loadRealDays(){
  if(AUTH.demo || !AUTH.business){ REAL_DAYS = REAL_DAYS || {}; return false; }
  try{
    await ensureSession();
    const today = todayStamp();
    const res = await fetch(CLOUD.url + "/rest/v1/market_days"
      + "?business_id=eq." + CLOUD.business
      + "&day_date=eq." + today
      + "&select=*,day_counts(product_id,went_out,came_back,samples,damaged)",
      { headers: cloudHeaders() });
    if(!res.ok) throw new Error(String(res.status));
    const rows = await res.json();
    REAL_DAYS = {};
    rows.forEach(r => REAL_DAYS[r.market_id] = r);
    await loadRealFixes(today);
    await loadRealUnfinished();
    await loadRealSecondSheets(today);
    await loadRealEarlier(today);
    return true;
  }catch(e){
    REAL_DAYS = REAL_DAYS || {};      // an empty answer, not a broken screen
    return false;
  }
}

/* Fixes and second sheets for an earlier date. Both used to be read for today
   only, on today's market cards - so a fix asked for the morning after an
   evening market, or a sheet refused when it finally found signal the next day,
   reached the database and no screen at all, while the seller's phone said Nawid
   had it. Three refused sheets from one Sunday were visible for an hour. Now
   the last two weeks are listed on Today, the same window as days never counted
   up. They can't be marked done - a fix is never changed - so they drop off
   when they're two weeks old. */
let REAL_EARLIER = { fixes:[], seconds:[], days:{} }, REAL_EARLIER_OK = true;
async function loadRealEarlier(today){
  try{
    const biz = "?business_id=eq." + encodeURIComponent(CLOUD.business);
    const range = "&day_date=gte." + localDay(daysAgo(14)) + "&day_date=lt." + today;
    const [f, s] = await Promise.all([
      fetch(CLOUD.url + "/rest/v1/day_corrections" + biz + range
        + "&select=id,market_id,day_date,seller_id,seller_name,message,asked_at&order=day_date.desc,asked_at.asc", { headers: cloudHeaders() }),
      fetch(CLOUD.url + "/rest/v1/second_sheets" + biz + range
        + "&select=id,market_id,day_date,seller_id,seller_name,sender_name,sheet,counts,refused_at&order=day_date.desc,refused_at.asc", { headers: cloudHeaders() })
    ]);
    if(!f.ok || !s.ok) throw new Error(f.status + "/" + s.status);
    const fixes = await f.json(), seconds = await s.json();
    // The sheet that was counted, for each second sheet to be compared with.
    const days = {};
    const slots = [...new Set(seconds.map(x => x.market_id + "|" + x.day_date))];
    if(slots.length){
      const or = slots.map(k => { const [m, d] = k.split("|"); return "and(market_id.eq." + m + ",day_date.eq." + d + ")"; }).join(",");
      const r = await fetch(CLOUD.url + "/rest/v1/market_days" + biz + "&or=(" + encodeURIComponent(or) + ")"
        + "&select=market_id,day_date,seller_id,seller_name,cash,card,chips_sold,day_counts(went_out,came_back,samples,damaged)", { headers: cloudHeaders() });
      if(!r.ok) throw new Error(String(r.status));
      (await r.json()).forEach(row => { days[row.market_id + "|" + row.day_date] = row; });
    }
    REAL_EARLIER = { fixes, seconds, days }; REAL_EARLIER_OK = true;
  }catch(e){
    REAL_EARLIER = { fixes:[], seconds:[], days:{} }; REAL_EARLIER_OK = false;
  }
}

/* Days packed and never counted up in the last two weeks, minus any whose real
   day has since arrived - once the seller counts it up and sends it, it stops
   being unfinished. If either question cannot be answered, nothing is listed:
   a wrong list here would point at somebody for nothing. */
let REAL_UNFINISHED = [];
async function loadRealUnfinished(){
  try{
    const since = localDay(daysAgo(14));
    const u = await fetch(CLOUD.url + "/rest/v1/unfinished_days"
      + "?business_id=eq." + encodeURIComponent(CLOUD.business)
      + "&day_date=gte." + since + "&day_date=lte." + todayStamp()
      + "&select=id,market_id,market_name,day_date,seller_id,seller_name,went_out,items_out,packed_at,reached,set_aside_at,reporter_name"
      + "&order=day_date.desc", { headers: cloudHeaders() });
    if(!u.ok) throw new Error(String(u.status));
    const rows = await u.json();
    if(!rows.length){ REAL_UNFINISHED = []; return; }
    const s = await fetch(CLOUD.url + "/rest/v1/market_days"
      + "?business_id=eq." + encodeURIComponent(CLOUD.business)
      + "&day_date=gte." + since + "&select=market_id,day_date,seller_id", { headers: cloudHeaders() });
    if(!s.ok) throw new Error(String(s.status));
    /* A day set aside and later counted up can land as a second sheet - the
       market already had one - and then it isn't unfinished any more either. It
       used to stay on this list after Nawid had the sheet (found in the launch
       rehearsal). */
    const ss = await fetch(CLOUD.url + "/rest/v1/second_sheets"
      + "?business_id=eq." + encodeURIComponent(CLOUD.business)
      + "&day_date=gte." + since + "&select=market_id,day_date,seller_id", { headers: cloudHeaders() });
    const sent = (await s.json()).concat(ss.ok ? await ss.json() : []);
    // Every unfinished day is its own day - two set aside for the same market
    // and date are two coolers that went out. A day taken back up and left
    // again keeps its id, so it is never listed twice.
    REAL_UNFINISHED = rows.filter(r => !(r.reached === "today" && !r.packed_at)).filter(r =>
      !sent.some(x => x.market_id === r.market_id && x.day_date === r.day_date && x.seller_id === r.seller_id));
  }catch(e){ REAL_UNFINISHED = []; }
}

/* Fixes sellers have asked for on today's days, keyed by market. Fetched on
   its own rather than folded into the days: if the corrections table is not
   there yet, the days must still show. REAL_FIXES_OK says whether we could
   actually look, so an empty list is never mistaken for "nobody asked". */
/* Second sheets: sheets refused because the market already had one that day,
   keyed by market. REAL_SECOND_OK says whether we could look at all. */
let REAL_SECOND = {}, REAL_SECOND_OK = false;
async function loadRealSecondSheets(day){
  try{
    const res = await fetch(CLOUD.url + "/rest/v1/second_sheets"
      + "?business_id=eq." + encodeURIComponent(CLOUD.business)
      + "&day_date=eq." + encodeURIComponent(day)
      + "&select=id,market_id,seller_id,seller_name,sender_name,sheet,counts,refused_at&order=refused_at.asc",
      { headers: cloudHeaders() });
    if(!res.ok) throw new Error(String(res.status));
    const rows = await res.json();
    REAL_SECOND = {};
    rows.forEach(r => (REAL_SECOND[r.market_id] ||= []).push(r));
    REAL_SECOND_OK = true;
  }catch(e){
    REAL_SECOND = {}; REAL_SECOND_OK = false;
  }
}

let REAL_FIXES = {}, REAL_FIXES_OK = false;
async function loadRealFixes(day){
  try{
    const res = await fetch(CLOUD.url + "/rest/v1/day_corrections"
      + "?business_id=eq." + encodeURIComponent(CLOUD.business)
      + "&day_date=eq." + encodeURIComponent(day)
      + "&select=id,market_id,seller_id,seller_name,message,asked_at,received_at&order=asked_at.asc",
      { headers: cloudHeaders() });
    if(!res.ok) throw new Error(String(res.status));
    const rows = await res.json();
    REAL_FIXES = {};
    rows.forEach(r => (REAL_FIXES[r.market_id] ||= []).push(r));
    REAL_FIXES_OK = true;
  }catch(e){
    REAL_FIXES = {}; REAL_FIXES_OK = false;
  }
}

/* The seller's name on anything reported: as sent, or - for a report that came
   without one (set aside or queued at a hand-over, before names travelled with
   the day) - from the owner's own list by the seller's id. */
const nameOf = r => (r && (r.seller_name || ((r.seller_id && slr(r.seller_id)) || {}).name)) || null;

// What one reported day looks like to the owner's screen.
function dayFromCloud(row, m){
  const counts = row.day_counts || [];
  const sold = counts.reduce((a,c)=>
    a + Math.max(0, c.went_out - c.came_back - c.samples - c.damaged), 0);
  const out  = counts.reduce((a,c)=>a + c.went_out, 0);
  const gross = Number(row.cash) + Number(row.card)
    + (row.other_pays||[]).reduce((a,o)=>a+(Number(o.amount)||0),0)
    + Number(row.spent_from_till);
  const packMoney = gross - (row.chips_sold * CHIPS.price);
  /* What the seller brought in - cash, card and other payments - the same
     figure as "Brought in" on their own phone. Nawid's card and "Money in" used
     to show the tamale money only, chips taken off and till spending put back,
     under a label that said cash + card: one market's card read $1,246 right
     above Cash $410 and Square $860, and every Saturday looked short of the bag
     by the chip sales. Tamale money is still what money per pack is worked on.
     Money spent out of the till isn't in it on either side: the seller's card
     shows it below Brought in, then what the day took. */
  const broughtIn = Number(row.cash) + Number(row.card)
    + (row.other_pays||[]).reduce((a,o)=>a+(Number(o.amount)||0),0);
  const listPer = PRODUCTS.reduce((a,p)=>a+p.price,0)/PRODUCTS.length;
  const fixList = (REAL_FIXES[row.market_id] || []);
  return {
    name: nameOf(row) || "Nobody assigned",
    phone: null, sold, rev: broughtIn, out,
    status: "Closed", live: false,
    perPack: sold ? packMoney/sold : null, fullPer: listPer,
    overSend: 0, fixes: fixList.length, fixList, row,
    seconds: REAL_SECOND[row.market_id] || [],
    // Pay, plus whatever they fronted, drove or were given for gas. None of
    // those are sales, so none counts towards commission - they are owed on top.
    // A day sent before db/025 has no travel columns and adds nothing, as before.
    owed: sentDayPay(row, gross).amount + Number(row.fronted || 0)
          + Number(row.driving_pay || 0) + Number(row.car_gas || 0),
    fronted: Number(row.fronted || 0),
    driving: Number(row.driving_pay || 0),
    carGas: Number(row.car_gas || 0),
    reported: true
  };
}

/* Is the day sitting on the server for this market and date ours?
   true  - yes, this phone's own day is in
   false - somebody else's day is in that slot
   null  - could not find out (no signal, no answer) */
/* The shop already has a sheet under this seller's name for this market and day.
   It is this very sheet - sent before, its answer lost - only if it says the
   same. The same person's day counted on a second phone (a phone handed over at
   a shared stall, or a borrowed phone while theirs was dead) used to be called
   "already in" and marked Sent, and its different cash, counts and notes were
   thrown away while the phone said Nawid had them. Different now means a second
   sheet, which Nawid sees next to the first. Money to the cent, give or take
   rounding; every count line once the shop has them. */
const SHEET_COLUMNS = "id,seller_id,cash,card,other_pays,chips_sold,spent_from_till,fronted,discounts,driving_pay,car_gas,note,day_counts(product_id,went_out,came_back,samples,damaged)";
function sameSheet(row, payload, counts){
  const near = (a, b) => Math.abs((Number(a) || 0) - (Number(b) || 0)) < 0.015;
  const others = list => (list || []).reduce((t, o) => t + (Number(o.amount) || 0), 0);
  for(const f of ["cash", "card", "chips_sold", "spent_from_till", "fronted", "discounts", "driving_pay", "car_gas"]){
    if(f in payload && f in row && !near(row[f], payload[f])) return false;
  }
  if(!near(others(row.other_pays), others(payload.other_pays))) return false;
  if(String(row.note || "").trim() !== String(payload.note || "").trim()) return false;
  const have = row.day_counts || [];
  if(have.length){   // none yet means the counts were what got lost; they are filled in
    const line = c => [c.product_id, Number(c.went_out) || 0, Number(c.came_back) || 0, Number(c.samples) || 0, Number(c.damaged) || 0].join(":");
    if(have.map(line).sort().join("|") !== (counts || []).map(line).sort().join("|")) return false;
  }
  return true;
}

async function dayAlreadyThere(){
  try{
    await ensureSession();
    const m = dayMarket();
    if(!m) return null;               // no market on this day: nothing to check
    const r = await fetch(CLOUD.url + "/rest/v1/market_days"
      + "?business_id=eq." + encodeURIComponent(CLOUD.business)
      + "&market_id=eq."   + encodeURIComponent(m.id)
      + "&day_date=eq."    + encodeURIComponent(S.dayOf || todayStamp())
      + "&select=" + SHEET_COLUMNS,
      { headers: cloudHeaders() });
    if(!r.ok) return null;
    const rows = await r.json();
    if(!rows.length) return false;
    const row = rows[0];
    /* Ours means counted by the person this day belongs to AND saying the same
       (sameSheet). A sheet that has landed can't be edited from the phone -
       "Check the numbers" only follows a refusal, which never lands - so a
       difference is a second count, not a corrected one. */
    dayAlreadyThere.id = row.id;
    // A day taken back off the shelf is ours only if it is this very sheet.
    if(S.dayRowId) return row.id === S.dayRowId;
    return row.seller_id === (S.submittedBy || S.me) && sameSheet(row, dayPayload(), countRows(null));
  }catch(e){ return null; }
}

/* A day this phone believes it sent, that is not actually there.

   It happened on the first real Friday: a test day was already occupying the
   slot, the send was refused, and the app called it sent anyway. The counts
   sat on his phone and nobody knew. Checking costs one request and only ever
   un-sends a day when the server answers plainly that it does not have it. */
async function verifySent(){
  if(!S.sentAt || AUTH.demo || !AUTH.business) return;
  /* Only ever re-check a day that knows its own market. This check was added
     to rescue a day the shop never received; pointed at the wrong market it
     did the opposite, and sent a second copy of a seller's takings in against
     a Monday market in another county. */
  if(!dayMarket()) return;
  const there = await dayAlreadyThere();
  if(there === false){
    S.sentAt = null;
    S.sendError = "notthere";
    save();
    const again = await sendDay();
    render();
    if(again === "sent") toast("Your day has gone in now");
  }
}

async function sendDay(){
  if(S.sentAt) return "already";
  if(AUTH.demo || !AUTH.business) return "local";
  if(!dayMarket()) return "local";     // nothing to file it against
  try{
    await ensureSession();
    if(AUTH.signinBroken){ S.sendError = "signin"; save(); return "signin"; }
    const res = await postDayRow(dayPayload());
    if(res.status === 409){
      /* One sheet per market per day, refused by the database. That is nearly
         always this phone sending its own day twice - harmless. But it is also
         what happens when somebody ELSE's day is already sitting in the slot,
         and then calling it "sent" is a lie that loses a whole market.

         So find out which. Only our own day counts as sent. */
      const mine = await dayAlreadyThere();
      if(mine === true){
        /* The day is in - but a send that dropped between the day and its
           counts leaves a day with no counts, and calling that "sent" loses
           every flavour. Put any missing counts in; ones already there are
           left alone. */
        const rows = countRows(dayAlreadyThere.id);
        if(rows.length){
          const rc = await fetch(CLOUD.url + "/rest/v1/day_counts?on_conflict=market_day_id,product_id", {
            method:"POST", headers: cloudHeaders({ "Prefer":"resolution=ignore-duplicates,return=minimal" }),
            body: JSON.stringify(rows)
          });
          if(rc.status === 400){ S.sendError = "countsrefused"; save(); return "refused"; }
          if(!rc.ok) throw new Error("counts " + rc.status);
        }
        S.sentAt = S.sentAt || new Date().toISOString();
        S.sendError = null;
        save();
        sendFixes().then(() => render());
        return "sent";
      }
      if(mine === false){
        S.sendError = "clash";
        // Tell the shop there's a second sheet, rather than rely on the seller.
        S.secondSheetId = queueSecondSheet(dayPayload(), countRows(null), S.secondSheetId) || S.secondSheetId;
        save();
        sendSecondSheets().then(() => render());
        return "clash";
      }
      throw new Error("day 409");        // could not tell - treat as not sent
    }
    if(res.status === 403 || (res.status === 401 && AUTH.signinBroken)){
      /* Refused because this phone's sign-in no longer belongs to the
         business, or the server said the sign-in itself is gone. Waiting for
         signal would never fix that. A plain 401 after a hiccup is not this -
         it falls through as a failed send and tries again. */
      S.sendError = "signin"; save(); return "signin";
    }
    if(res.status === 400){
      /* Turned away by the database itself - a number it cannot hold. More
         signal never fixes that, and a nine-digit cash figure sat on "Waiting
         for signal" for ever. (A column the database doesn't have yet was
         already dealt with in postDayRow.) */
      S.sendError = "refused"; save(); return "refused";
    }
    if(!res.ok) throw new Error("day " + res.status);
    const day = (await res.json())[0];

    const rows = countRows(day.id);
    if(rows.length){
      const r2 = await fetch(CLOUD.url + "/rest/v1/day_counts", {
        method: "POST", headers: cloudHeaders(), body: JSON.stringify(rows)
      });
      /* The day is in and only its counts were turned away. Its money is locked
         on the shop's side now, so nothing here may offer to change it - an
         edit would be dropped while the phone said Sent. */
      if(r2.status === 400){ S.sendError = "countsrefused"; save(); return "refused"; }
      if(!r2.ok) throw new Error("counts " + r2.status);
    }
    S.sentAt = new Date().toISOString();
    S.sendError = null;
    // The rate the shop wrote on the day, so this screen and Nawid's agree
    // even if the rate changes before the next market.
    if(day && day.pay_base != null && day.pay_rate != null)
      S.payAt = { base: Number(day.pay_base), rate: Number(day.pay_rate) };
    save();
    // A fix asked for before the day got a signal can follow it in now.
    sendFixes().then(() => render());
    return "sent";
  }catch(e){
    S.sendError = String(e.message || e);
    save();
    return "failed";
  }
}

/* =========================================================
   Asking the shop to fix a day that is already in

   This button used to put the request in the phone's own storage and say
   "Sent to the shop". Nothing ever left the phone. A seller who counted
   wrong and did the honest thing was told it was handled.

   A day is locked, so a fix is its own record, pointing at the day. It is
   kept in its own key - not inside the day - because the day is wiped when
   the next one starts, and a request that has not reached the shop yet must
   not go with it. Each one carries an id made here on the phone, so sending
   it twice on bad signal can never make two.

   Nothing here calls a request sent until the shop has answered that it
   has it.
   ========================================================= */

function loadFixes(){
  try{ const r = JSON.parse(localStorage.getItem(FIX_KEY)); return Array.isArray(r) ? r : []; }
  catch(e){ return []; }
}
function saveFixes(list){
  try{ localStorage.setItem(FIX_KEY, JSON.stringify(list)); return true; }
  catch(e){ return false; }
}
function newId(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  const b = new Uint8Array(16); crypto.getRandomValues(b);
  b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
  const h = [...b].map(x => x.toString(16).padStart(2,"0")).join("");
  return h.slice(0,8)+"-"+h.slice(8,12)+"-"+h.slice(12,16)+"-"+h.slice(16,20)+"-"+h.slice(20);
}
// The fixes asked about the day on this phone right now.
function fixesForDay(){
  if(!S.marketId || !S.dayOf) return [];
  return loadFixes().filter(f => f.market_id === S.marketId && f.day_date === S.dayOf
                              && (AUTH.demo || f.business_id === AUTH.business));
}

/* Before this, a fix lived only inside the day as {text, at} and was never
   sent. Anything a seller asked that way is still owed to the shop, so move
   it into the queue once, against the day it was asked about. */
function adoptOldFixes(day){
  if(!day || !Array.isArray(day.corrections) || !day.corrections.length) return;
  if(AUTH.demo || !AUTH.business || !day.marketId || !day.dayOf) return;
  const list = loadFixes();
  day.corrections.forEach(c => {
    if(!c || !c.text) return;
    list.push({ id:newId(), business_id:AUTH.business, market_id:day.marketId, day_date:day.dayOf,
                message: c.text + (c.at ? " (asked at " + c.at + ")" : ""),
                asked_at:new Date().toISOString(), sentAt:null, problem:null });
  });
  if(saveFixes(list)) day.corrections = [];
}

function sendFixes(){
  if(AUTH.demo || !AUTH.business) return Promise.resolve();
  // Already sending: go round once more when that finishes, so a fix that
  // was waiting on its day is not skipped because the day landed mid-run.
  if(sendFixes.busy) return sendFixes.busy.then(() => sendFixes());
  sendFixes.busy = sendFixesNow().catch(() => {}).then(() => { sendFixes.busy = null; });
  return sendFixes.busy;
}
async function sendFixesNow(){
  const due = loadFixes().filter(f => !f.sentAt && f.business_id === AUTH.business);
  if(!due.length) return;
  await ensureSession();
  for(const f of due){
    // A fix points at the day. If that day is still on this phone waiting
    // for signal, the shop has nothing to attach it to yet - it goes after.
    if(f.market_id === S.marketId && f.day_date === S.dayOf && !S.sentAt){
      markFix(f.id, { problem:"daynotin" }); continue;
    }
    let problem = null, ok = false;
    try{
      const res = await fetch(CLOUD.url + "/rest/v1/day_corrections", {
        method:"POST", headers: cloudHeaders({ "Prefer":"return=minimal" }),
        body: JSON.stringify({ id:f.id, business_id:f.business_id, market_id:f.market_id,
                               day_date:f.day_date, message:f.message, asked_at:f.asked_at })
      });
      if(res.ok) ok = true;
      else {
        const d = await res.json().catch(() => ({}));
        if(d.code === "23505") ok = true;                    // this very id is already there
        else if(d.code === "23503") problem = "daynotin";    // the shop does not have that day
        else if(res.status === 404 || d.code === "PGRST205" || d.code === "42P01") problem = "notready";
        else problem = "failed";
      }
    }catch(e){ problem = "nosignal"; }
    markFix(f.id, ok ? { sentAt:new Date().toISOString(), problem:null } : { problem });
  }
}
/* =========================================================
   Days still going to the shop

   A counted day that has not reached the shop yet - no signal, a slot
   already taken, a sign-in that stopped working - used to be deleted once it
   was twenty hours old, while its screen said nothing is lost.

   Now, when the next market day comes round first, the waiting day is set
   aside here with everything it needs to send - the sheet and every count,
   worked out while the day was still on the phone - and the phone moves on to
   the day in front of it. This queue keeps trying on its own, exactly like
   the day itself did, and tells the seller where it stands until it lands.
   ========================================================= */
const OUTBOX_KEY = "packout.outbox.v1";
const SHELF_KEY  = "packout.unfinished.v1";

function loadOutbox(){
  try{ const r = JSON.parse(localStorage.getItem(OUTBOX_KEY)); return Array.isArray(r) ? r : []; }
  catch(e){ return []; }
}
function saveOutbox(list){
  try{ localStorage.setItem(OUTBOX_KEY, JSON.stringify(list)); return true; }
  catch(e){ return false; }
}
function waitingDays(){
  return loadOutbox().filter(e => !e.sentAt && e.business === AUTH.business);
}

/* Runs once, when the app opens, before anything is drawn. */
function setAsideOldDay(){
  const blank = () => {
    const f = JSON.parse(JSON.stringify(BLANK));
    f.me = S.me; f.mode = S.mode; f.tab = S.tab;
    return f;
  };

  /* A counted day from an earlier date that hasn't reached the shop goes into the
     queue as soon as the date has moved on - it keeps trying from there, and the
     "not at the shop yet" card shows it. It used to wait for a market of the
     seller's own today, so someone with nothing rostered (covering a Thursday
     market, say) was stuck on yesterday's Day's done with no way to start. */
  if(S.parkMe && !S.sentAt && S.submittedAt && !AUTH.demo){
    const list = loadOutbox();
    list.push({
      id: newId(),
      business: AUTH.business,
      payload: dayPayload(),              // S is still the waiting day here
      counts: countRows(null),
      market: (dayMarket() || MY_MARKET).name, day: S.dayOf,
      problem: S.sendError || null,
      parkedAt: new Date().toISOString(), sentAt: null,
      /* Already reported as a second sheet, it keeps that report. Without it the
         queue sent Nawid the same second sheet again under a new id. */
      secondSheetId: S.secondSheetId || null
    });
    // Only move on once it is safely in the queue. If this phone cannot hold
    // it, the waiting day stays on screen rather than being lost.
    if(!saveOutbox(list)) return;
    S = blank(); save();
    MY_MARKET = marketOrAny(); MY_REC = recommendMarket(MY_MARKET.id);
    return;
  }

  // Begun, never counted up, long abandoned: put aside, not deleted.
  if(S.archiveMe && !S.submittedAt){
    if(onlyLooked(S)){                    // read the packing list, took nothing out
      S = blank(); save();
      MY_MARKET = marketOrAny(); MY_REC = recommendMarket(MY_MARKET.id);
      return;
    }
    const keep = Object.assign({}, S); delete keep.archiveMe;
    if(!shelveDay(keep)) return;          // could not keep it: leave it where it is
    S = blank(); save();
    MY_MARKET = marketOrAny(); MY_REC = recommendMarket(MY_MARKET.id);
  }
}

/* =========================================================
   Days packed and never counted up

   A seller taps Pack the cooler, takes 148 items out, and never counts up -
   forgot, the phone died, somebody else took the phone. The day is set aside,
   not deleted. It used to sit here where nobody could see it: the seller was
   never reminded, and Nawid never learned the stock went out.

   Now both hear about it. The seller gets a card on their home screen and can
   count it up; the shop gets a report (db/026) so Nawid's screen can list it
   until the real day arrives. Each set-aside day keeps the business and whose
   day it was from the moment it was set aside - by the time it is reported,
   the phone may belong to somebody else.
   ========================================================= */
/* Only looked. Pack the cooler opens the packing list and starts the day - so
   a change there survives the app closing - but a seller who read the list and
   tapped Back never took anything out. Set aside after twenty hours, or when the
   phone changed hands, that read as "You packed 145 items and never counted
   up", and Nawid was told to ask what happened to them: a rained-out market, or
   someone else working it, turned into a false alarm about stock. The cooler
   leaves at "Cooler is packed"; a day that never got that far is let go. */
function onlyLooked(d){ return !!d && !d.packedAt && !d.submittedAt && (d.screen || "today") === "today"; }

function loadShelf(){
  let list;
  try{ list = JSON.parse(localStorage.getItem(SHELF_KEY)); }catch(e){ return []; }
  if(!Array.isArray(list)) return [];
  // Ones set aside before this was known.
  if(list.some(e => onlyLooked(e.day))){ list = list.filter(e => !onlyLooked(e.day)); saveShelf(list); }
  // Days set aside before these were reported carry no id or owner. Give them
  // both once, from the day itself, so they can be counted up and reported too.
  let changed = false;
  list.forEach(e => {
    if(!e.id){ e.id = newId(); changed = true; }
    if(!e.owner && e.day){ e.owner = e.day.dayOwner || e.day.me || null; changed = true; }
    if(!("reportedAt" in e)){ e.reportedAt = null; changed = true; }
  });
  if(changed) saveShelf(list);
  return list;
}
function saveShelf(list){
  try{ localStorage.setItem(SHELF_KEY, JSON.stringify(list)); return true; }
  catch(e){ return false; }
}
function shelveDay(day){
  const copy = JSON.parse(JSON.stringify(day));
  copy.photo = null; (copy.expenses || []).forEach(x => { x.photo = null; });
  // A day taken back up and left again keeps its id, so the shop hears once.
  const id = copy.shelfId || newId();
  const list = loadShelf().filter(e => e.id !== id);
  const ownerId = copy.dayOwner || copy.me || null;
  list.push({ id, business: AUTH.business || null, owner: ownerId,
              // The name now, while this phone still holds it: after a hand-over it won't.
              ownerName: ((ownerId && slr(ownerId)) || {}).name || copy.dayOwnerName || null,
              setAsideAt: new Date().toISOString(), day: copy, reportedAt: null, problem: null });
  // Only ever trim days the shop already knows about. It used to keep the last
  // five, whatever they were.
  while(list.length > 10){
    const i = list.findIndex(e => e.reportedAt);
    if(i < 0) break;
    list.splice(i, 1);
  }
  if(!saveShelf(list)) return false;
  setTimeout(() => { sendUnfinished().then(() => { try{ render(); }catch(e){} }); }, 0);
  return true;
}

function sendUnfinished(){
  if(AUTH.demo || !AUTH.business) return Promise.resolve();
  if(sendUnfinished.busy) return sendUnfinished.busy.then(() => sendUnfinished());
  sendUnfinished.busy = sendUnfinishedNow().catch(() => {}).then(() => { sendUnfinished.busy = null; });
  return sendUnfinished.busy;
}
async function sendUnfinishedNow(){
  const due = loadShelf().filter(e => !e.reportedAt && e.day && e.day.marketId && e.day.dayOf
                                   && (e.business || AUTH.business) === AUTH.business);
  if(!due.length) return;
  await ensureSession();
  if(AUTH.signinBroken) return;
  for(const e of due){
    const d = e.day, m = mkt(d.marketId);
    const owner = e.owner || d.dayOwner || d.me || null;
    const who = (owner && slr(owner)) || (e.ownerName ? { name: e.ownerName } : null);
    const out = {}; let items = 0;
    Object.keys(d.opening || {}).forEach(p => { const k = Number(d.opening[p]) || 0; if(k > 0){ out[p] = k; items += k; } });
    const packer = (!d.packedBy || d.packedBy === "you") ? (who ? who.name : null)
                 : ((slr(d.packedBy) || {}).name || String(d.packedBy).trim() || null);
    let problem = null, ok = false;
    try{
      const res = await fetch(CLOUD.url + "/rest/v1/unfinished_days", {
        method:"POST", headers: cloudHeaders({ "Prefer":"return=minimal" }),
        body: JSON.stringify({ id:e.id, business_id:AUTH.business, market_id:d.marketId,
          market_name: m ? m.name : d.marketId, day_date:d.dayOf,
          seller_id:owner, seller_name: who ? who.name : null,
          went_out:out, items_out:items, packed_by:packer,
          packed_at:d.packedAt || null, booth_up_at:d.arrivedAt || null,
          reached:d.screen || null, set_aside_at:e.setAsideAt })
      });
      if(res.ok) ok = true;
      else {
        const x = await res.json().catch(() => ({}));
        if(x.code === "23505") ok = true;                                   // this very report is already there
        else if(res.status === 404 || x.code === "PGRST205" || x.code === "42P01") problem = "notready";  // db/026 not run yet
        else problem = "failed";
      }
    }catch(err){ problem = "nosignal"; }
    const list = loadShelf();
    const item = list.find(x => x.id === e.id);
    if(item){ Object.assign(item, ok ? { reportedAt:new Date().toISOString(), problem:null } : { problem }); saveShelf(list); }
  }
}

/* The seller's card for a day of theirs that was never counted up. Only their
   own days - a handed-over phone also holds the last person's - and "count it
   up now" only when no other day is in hand, so an old day can never wipe
   today's count. Never says the shop knows until the shop has it. */
/* A set-aside day for the same person, market and date as the day this phone
   has now sent is superseded: the shop has that sheet, and counting the old one
   up would only run into it (one sheet per market per day). Dropped - but only
   once the shop has also been told about it, so nothing goes unrecorded. */
function pruneShelf(){
  if(!S.sentAt || !S.marketId || !S.dayOf) return;
  const who = S.dayOwner || S.submittedBy || S.me;
  const list = loadShelf();
  const keep = list.filter(e => !(e.reportedAt && e.day && e.day.marketId === S.marketId
    && e.day.dayOf === S.dayOf && (e.owner || e.day.dayOwner || e.day.me) === who));
  if(keep.length !== list.length) saveShelf(keep);
}

function unfinishedNotice(){
  if(AUTH.demo || !S.me) return "";
  pruneShelf();
  const mine = loadShelf().filter(e => e.day && e.day.marketId
    && (e.owner || e.day.dayOwner || e.day.me) === S.me
    && (!e.business || e.business === AUTH.business));
  if(!mine.length) return "";
  const busy = !!S.startedAt && !S.sentAt;
  return mine.map(e => {
    const d = e.day, m = mkt(d.marketId), name = m ? m.name : "your market";
    const items = Object.values(d.opening || {}).reduce((a, v) => a + (Number(v) || 0), 0);
    const when = d.dayOf ? fmtDate(new Date(d.dayOf + "T12:00:00")) : "An earlier day";
    return `<div class="alert-card">
      <div class="spread"><div class="lbl">Never counted up</div><span class="pill pill-warn">${esc(name)}</span></div>
      <div class="alert-title">${d.screen === "loadout" && !d.packedAt ? `You started packing ${items} items` : `You packed ${items} items`} and never counted up</div>
      <p class="note"><b>${esc(when)}</b> at ${esc(name)}. Count up what came back so the shop has the whole day.${e.reportedAt ? " Nawid has been told." : ""}</p>
      ${busy
        ? `<p class="note" style="font-size:12.5px">Finish and send the day you're on first, then count this one up.</p>`
        : `<button class="btn" data-act="shelf-resume" data-shelf="${esc(e.id)}">Count it up now</button>`}
    </div>`;
  }).join("");
}

function sendOutbox(){
  if(AUTH.demo || !AUTH.business) return Promise.resolve();
  if(sendOutbox.busy) return sendOutbox.busy.then(() => sendOutbox());
  sendOutbox.busy = sendOutboxNow().catch(() => {}).then(() => { sendOutbox.busy = null; });
  return sendOutbox.busy;
}
async function sendOutboxNow(){
  const due = waitingDays();
  if(!due.length) return;
  await ensureSession();
  for(const e of due){
    let problem = null, ok = false;
    try{
      if(AUTH.signinBroken){ problem = "signin"; }
      else {
        const res = await postDayRow(e.payload);
        let dayId = null;
        if(res.status === 403 || (res.status === 401 && AUTH.signinBroken)) problem = "signin";
        else if(res.status === 409){
          // Already there. Ours only if it was sent under the same name - or,
          // for a day taken back off the shelf, only if it is this very sheet.
          const g = await fetch(CLOUD.url + "/rest/v1/market_days"
            + "?business_id=eq." + encodeURIComponent(e.payload.business_id)
            + "&market_id=eq."   + encodeURIComponent(e.payload.market_id)
            + "&day_date=eq."    + encodeURIComponent(e.payload.day_date)
            + "&select=" + SHEET_COLUMNS, { headers: cloudHeaders() });
          if(!g.ok) problem = "failed";
          else {
            const rows = await g.json();
            const ours = rows.length && (e.payload.id ? rows[0].id === e.payload.id
                                                      : rows[0].seller_id === e.payload.seller_id && sameSheet(rows[0], e.payload, e.counts));
            if(ours) dayId = rows[0].id;
            else {
              problem = "clash";
              e.secondSheetId = queueSecondSheet(e.payload, e.counts, e.secondSheetId) || e.secondSheetId;
            }
          }
        }
        else if(res.ok) dayId = (await res.json())[0].id;
        else problem = res.status === 400 ? "refused" : "failed";   // turned away, not waiting on signal

        if(dayId){
          const rows = (e.counts || []).map(c => Object.assign({}, c, { market_day_id: dayId }));
          if(rows.length){
            const rc = await fetch(CLOUD.url + "/rest/v1/day_counts?on_conflict=market_day_id,product_id", {
              method:"POST", headers: cloudHeaders({ "Prefer":"resolution=ignore-duplicates,return=minimal" }),
              body: JSON.stringify(rows)
            });
            if(rc.ok) ok = true;
            else problem = rc.status === 403 ? "signin" : rc.status === 400 ? "refused" : "failed";
          } else ok = true;
        }
      }
    }catch(x){ problem = "nosignal"; }
    const list = loadOutbox();
    const item = list.find(x => x.id === e.id);
    if(item){
      /* A day already refused as a second sheet stays a second sheet when a later
         try simply finds no signal - its card said "keeps trying, nothing is lost"
         in between, as if it might still go in. */
      const stillClash = (problem === "nosignal" || problem === "failed") && (item.problem === "clash" || item.secondSheetId);
      Object.assign(item, ok ? { sentAt:new Date().toISOString(), problem:null } : { problem: stillClash ? "clash" : problem });
      if(e.secondSheetId) item.secondSheetId = e.secondSheetId;
      saveOutbox(list);
    }
  }
  if(loadSecondSheets().some(x => !x.sentAt && !x.closed)) await sendSecondSheets();
}

/* A sign-in the server has already refused. It used to surface only after the
   seller had counted everything and tapped Send; the phone knew as soon as it
   opened. Said first, before any work, with the way back in. */
function signinNotice(){
  if(AUTH.demo || !AUTH.person || !AUTH.signinBroken) return "";
  if(waitingDays().some(e => e.problem === "signin")) return "";   // the waiting-day card already says it
  return `<div class="card card-pad stack-sm stripe stripe-warn">
      <div class="lbl">Your code has stopped working</div>
      <p class="note">The shop has stopped accepting this phone &mdash; it was taken off the shop's list, or its sign-in ran out. <b>It isn't your signal.</b> Nothing can reach the shop until you type in a new code, so get one from Nawid before you start. ${CATALOGUE.source === "missing" ? "Your markets load as soon as the new code is in." : "You can still count your day; it goes up as soon as the new code is in."}</p>
      <button class="btn" data-act="resignin">Type a new code</button>
    </div>`;
}

/* What a seller sees on their own home screen while a day is still waiting. */
function outboxNotice(){
  if(AUTH.demo) return "";
  const list = waitingDays();
  if(!list.length) return "";
  const signin = list.some(e => e.problem === "signin");
  return list.map(e => {
    const when = e.day ? fmtDate(new Date(e.day + "T12:00:00")) : "An earlier day";
    const why = e.problem === "signin"
      ? "Your code has stopped working on this phone, so it can't be sent. It isn't your signal. It's saved here - get a new code from Nawid."
      : e.problem === "refused" || e.problem === "countsrefused"
      ? "The shop's system wouldn't take one of its numbers, so it can't go in as it is. It isn't your signal. It's saved on this phone - tell Nawid."
      : e.problem === "clash"
      ? ((secondSheetWith(e.secondSheetId) || {}).sentAt
          ? "Another day is already logged for that market and date. Nawid can see this sheet next to it."
          : "Another day is already logged for that market and date. It's saved on this phone. Tell Nawid.")
      : "It's saved on this phone and keeps trying on its own. Nothing is lost.";
    return `<div class="card card-pad stack-sm stripe stripe-warn">
      <div class="spread"><div class="lbl">Not at the shop yet</div><span class="pill pill-warn">${esc(e.market || "Market")}</span></div>
      <p class="note"><b>${esc(when)}</b> at ${esc(e.market || "your market")} hasn't reached the shop. ${why}</p>
    </div>`;
  }).join("") + (signin
    ? `<button class="btn" data-act="resignin">Type a new code</button>`
    // A day the shop's system turned away can only be turned away again: no button for those alone.
    : list.some(e => e.problem !== "refused" && e.problem !== "countsrefused")
    ? `<button class="btn btn-quiet btn-sm" data-act="outbox-retry">Try sending again</button>` : "");
}

/* =========================================================
   A second sheet for a market that already has one

   One sheet per market per day is refused on purpose - a day must never be
   counted twice. But the refused sheet used to stay on that seller's phone,
   and the only way Nawid heard about it was the seller remembering to tell
   him. Now it is sent on its own to the shop, kept apart from the day already
   in, and shown to Nawid on that market's page to compare.

   Queued first, sent second, with an id made here so a retry can never make
   two. The day itself stays exactly where it is on the phone.
   ========================================================= */
const SECOND_KEY = "packout.secondsheets.v1";

function loadSecondSheets(){
  try{ const r = JSON.parse(localStorage.getItem(SECOND_KEY)); return Array.isArray(r) ? r : []; }
  catch(e){ return []; }
}
function saveSecondSheets(list){
  try{ localStorage.setItem(SECOND_KEY, JSON.stringify(list)); return true; }
  catch(e){ return false; }
}
function queueSecondSheet(payload, counts, id){
  const list = loadSecondSheets();
  if(id && list.some(x => x.id === id)) return id;
  id = id || newId();
  list.push({
    id, business_id: payload.business_id, market_id: payload.market_id, day_date: payload.day_date,
    seller_id: payload.seller_id || null, seller_name: payload.seller_name || null,
    sheet: payload,
    counts: (counts || []).map(c => ({ product_id:c.product_id, product_name:c.product_name,
                                       went_out:c.went_out, came_back:c.came_back,
                                       samples:c.samples, damaged:c.damaged })),
    refused_at: new Date().toISOString(), sentAt: null, problem: null
  });
  return saveSecondSheets(list) ? id : null;
}
const secondSheetWith = id => id ? loadSecondSheets().find(x => x.id === id) || null : null;

function sendSecondSheets(){
  if(AUTH.demo || !AUTH.business) return Promise.resolve();
  if(sendSecondSheets.busy) return sendSecondSheets.busy.then(() => sendSecondSheets());
  sendSecondSheets.busy = sendSecondSheetsNow().catch(() => {}).then(() => { sendSecondSheets.busy = null; });
  return sendSecondSheets.busy;
}
async function sendSecondSheetsNow(){
  const due = loadSecondSheets().filter(x => !x.sentAt && !x.closed && x.business_id === AUTH.business);
  if(!due.length) return;
  await ensureSession();
  for(const x of due){
    let changes;
    try{
      const res = await fetch(CLOUD.url + "/rest/v1/second_sheets", {
        method:"POST", headers: cloudHeaders({ "Prefer":"return=minimal" }),
        body: JSON.stringify({ id:x.id, business_id:x.business_id, market_id:x.market_id, day_date:x.day_date,
                               seller_id:x.seller_id, seller_name:x.seller_name,
                               sheet:x.sheet, counts:x.counts, refused_at:x.refused_at })
      });
      if(res.ok) changes = { sentAt:new Date().toISOString(), problem:null };
      else {
        const d = await res.json().catch(() => ({}));
        if(d.code === "23505") changes = { sentAt:new Date().toISOString(), problem:null };   // already there
        else if(d.code === "23503") changes = { closed:true, problem:"noday" };  // no day in that slot any more
        else if(res.status === 404 || d.code === "PGRST205" || d.code === "42P01") changes = { problem:"notready" };
        else changes = { problem:"failed" };
      }
    }catch(e){ changes = { problem:"nosignal" }; }
    const list = loadSecondSheets();
    const item = list.find(y => y.id === x.id);
    if(item){ Object.assign(item, changes); saveSecondSheets(list); }
  }
}

function markFix(id, changes){
  const list = loadFixes();

  if(f){ Object.assign(f, changes); saveFixes(list); }
}

   Helpers

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => "$" + Math.round(n).toLocaleString();
const money2 = n => "$" + n.toFixed(2);

/* Everything that came in, however it arrived. Cash, Square and Venmo are the
   three normal channels - they are what gets added on the paper. Anything
   rarer goes in otherPays, because a payment kept in a notes box is a payment
   missing from the total, and every money-per-pack reading would be wrong. */
function moneyIn(){
  return (Number(S.cashCounted)||0) + (Number(S.cardTotal)||0)
       + (S.otherPays||[]).reduce((a,o)=>a+(Number(o.amount)||0), 0);
}

/* A count that cannot be true, caught while the cooler is still open.

   soldByCount clamps at zero, so a typo - 51 back instead of 15 - quietly
   records nothing sold and says nothing. The seller finds out at the very end,
   when the money does not add up, and by then the cooler is packed away and
   they are re-counting from memory. Both businesses named exactly that as the
   worst part of the day.

   Only impossible things are flagged. Nothing here guesses at what a normal
   number looks like - there is no real history to judge that against yet, and
   a wrong guess would train people to ignore the warning. */
function countProblem(pid){
  const op = S.opening[pid] ?? 0;
  const cl = S.closing[pid];
  if(cl === undefined || cl === null || cl === "") return null;
  const back = Number(cl) || 0;
  const extra = (S.samples[pid]||0) + (S.damaged[pid]||0);
  if(back > op) return `${back} back, but only ${op} went out`;
  if(back + extra > op) return `${back} back plus ${extra} sampled or damaged is more than the ${op} that went out`;
  return null;
}
function anyCountProblem(){ return WENT_OUT().some(p => countProblem(p)); }

function soldByCount(pid){
  const op = S.opening[pid] ?? 0, cl = S.closing[pid] ?? 0;
  return Math.max(0, op - cl - (S.samples[pid]||0) - (S.damaged[pid]||0));
}
function openedTotal(){ return P_IDS.reduce((a,p)=>a+(S.opening[p]||0),0); }
function soldTotal(){ return P_IDS.reduce((a,p)=>a+soldByCount(p),0); }
function revenueTotal(){ return P_IDS.reduce((a,p)=>a+soldByCount(p)*prod(p).price,0); }
function expTotal(source){
  return (S.expenses||[]).reduce((a,e)=> a + ((!source || e.source===source) ? (Number(e.amount)||0) : 0), 0);
}
function packedByName(){
  if(!S.packedBy || S.packedBy==="you") return "You";
  const x = slr(S.packedBy);
  return x ? x.name : String(S.packedBy).trim() || "You";   // a name typed in
}
/* The other people this phone may name. A seller's phone holds only its own
   person, so on it "who packed" and "who you drove" are typed in. */
const othersOnPhone = () => SELLERS.filter(x => x.id !== S.me);
function passengerName(){
  const p = (S.travel || {}).passenger;
  if(!p) return "";
  const x = slr(p);
  return x ? x.name : String(p).trim();
}
function packedBySomeoneElse(){ return !!S.packedBy && S.packedBy!=="you"; }
/* Dropping another seller off and collecting them is paid, and it still is
   here. What the app does not do is advertise the rate. A card headed "$10 a
   leg for driving", or a figure ticking up as they pick the option, turns a
   favour into something to chase - and then everybody wants to drop somebody
   off. It gets paid and it shows up in the payout at the end, which is where
   a seller should learn what they earned. */
function driverPay(){
  const t = S.travel || {};
  return t.mode==="van" ? (t.legs||0) * DRIVER_LEG_PAY : 0;
}
// A flat gas allowance for taking your own car. If instead they filled the tank
// themselves, that is a receipt line under "money you spent" - never both, or
// the same gas gets paid twice.
function carAllowance(){
  const t = S.travel || {};
  return (t.mode==="own" && t.gasMode==="flat") ? (Number(t.gasAmount)||0) : 0;
}
// A set gas amount AND a gas receipt out of their own pocket: the same tank, paid twice.
function gasTwice(){
  return carAllowance() > 0 && (S.expenses||[]).some(e => e.kind==="Gas" && e.source==="own" && Number(e.amount));
}
const WENT_OUT = () => P_IDS.filter(p => (S.opening[p]||0) > 0);
function countedAll(){ return WENT_OUT().every(p => S.closing[p] !== undefined && S.closing[p] !== null); }

function hoursWorked(m){ return m.sellHrs + 1 + 0.75 + 0.75 + (m.driveMin*2)/60; }

/* How a seller performs at a market, against that market's own average.
   Everything the People tab claims is derived from these. */
/* Prefer what actually got logged at that market. Fall back to the
   model only when this person hasn't worked it enough times yet. */
function observedAtMarket(sid, mid){
  const at = HISTORY.filter(d=>d.marketId===mid);
  const mine = at.filter(d=>d.sellerId===sid);
  if(at.length < 2 || mine.length < 2) return null;
  const avgAll  = at.reduce((a,d)=>a+dayStats(d).sold,0)/at.length;
  const avgMine = mine.reduce((a,d)=>a+dayStats(d).sold,0)/mine.length;
  const revMine = mine.reduce((a,d)=>a+dayStats(d).revenue,0)/mine.length;
  return { pct: avgMine/avgAll - 1, revenue: revMine, n: mine.length };
}
function perfPct(sid, mid){
  const o = observedAtMarket(sid, mid);
  if(o) return o.pct;
  const avg = SELLERS.reduce((a,s)=>a+sellerMult(s.id,mid),0)/SELLERS.length;
  return sellerMult(sid,mid)/avg - 1;
}
function estRevenue(sid, mid){
  const o = observedAtMarket(sid, mid);
  if(o) return o.revenue;
  return 100 * mkt(mid).size * sellerMult(sid,mid) * 12.7;
}
function bestSwap(){
  // Only slots with a real name can be swapped. Fourteen markets have nobody
  // written down, and Thursday is all four of them - suggesting a swap
  // between two blanks is meaningless, and looking one up would crash.
  const plans = TODAY_PLAN.filter(p => p.sellerId && p.sellerId !== "you" && slr(p.sellerId));
  let best = null;
  for(let i=0;i<plans.length;i++){
    for(let j=i+1;j<plans.length;j++){
      const a=plans[i], b=plans[j];
      const now = estRevenue(a.sellerId,a.marketId) + estRevenue(b.sellerId,b.marketId);
      const sw  = estRevenue(a.sellerId,b.marketId) + estRevenue(b.sellerId,a.marketId);
      if(!best || sw-now > best.gain) best = { a, b, gain: sw-now };
    }
  }
  return best;
}
/* What a seller's packs actually bring in, across everything they have sold.
   This replaces counting short tills. With free fifths, invented deals and
   trades all in play, "came up short" was measuring the discount rather than
   the person - and would have called honest sellers thieves on day one. */
function yieldRecord(sid){
  const days  = HISTORY.filter(d=>d.sellerId===sid).map(dayStats);
  const sold  = days.reduce((a,d)=>a+d.sold,0);
  const money = days.reduce((a,d)=>a+d.money_in,0);
  const full  = days.reduce((a,d)=>a+d.revenue,0);
  return { days:days.length, sold, money, full, given:full-money,
           per: sold?money/sold:0, fullPer: sold?full/sold:0 };
}

// The whole crew's money per pack, so one seller can be read against the rest.
function crewYield(){
  const all  = HISTORY.map(dayStats);
  const sold = all.reduce((a,d)=>a+d.sold,0);
  return sold ? all.reduce((a,d)=>a+d.money_in,0)/sold : 0;
}

function dayStats(d){
  const sold = P_IDS.reduce((a,p)=>a+(d.opening[p]-d.closing[p]-d.samples[p]-d.damaged[p]),0);
  const revenue = P_IDS.reduce((a,p)=>a+(d.opening[p]-d.closing[p]-d.samples[p]-d.damaged[p])*prod(p).price,0);
  const money_in = d.cashCounted + d.cardTotal;
  const m = mkt(d.marketId);
  const hrs = hoursWorked(m);
  // What each pack that left the cooler actually brought in. Free fifths,
  // deals the seller made up and trades with other vendors all land here, and
  // both inputs get counted anyway - nobody has to declare anything.
  const yieldPer = sold>0 ? money_in/sold : 0;
  const fullPer  = sold>0 ? revenue/sold  : 0;
  return { sold, revenue, money_in, yieldPer, fullPer, given:revenue-money_in,
           hrs, perHr:(revenue-feeOf(m))/hrs, commission:dayPay(d.sellerId, money_in, d.marketId).amount, opened:P_IDS.reduce((a,p)=>a+d.opening[p],0) };
}

function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("on"),1900);
}
function readImage(file, maxPx, quality, cb){
  const img = new Image();
  img.onload = () => {
    const sc = Math.min(1, maxPx/Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    let data = null;
    try{ data = c.toDataURL("image/jpeg", quality); }catch(err){}
    URL.revokeObjectURL(img.src);
    if(!data) toast("Couldn't read that photo");
    cb(data);
  };
  img.onerror = () => { toast("Couldn't read that photo"); cb(null); };
  img.src = URL.createObjectURL(file);
}
function buzz(ms){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }

let wakeLock=null;
async function keepAwake(on){
  try{
    if(on && "wakeLock" in navigator && !wakeLock){ wakeLock = await navigator.wakeLock.request("screen"); }
    else if(!on && wakeLock){ wakeLock.release(); wakeLock=null; }
  }catch(e){}
}

/* Numbers that cannot be true, box by box.

   A minus Square figure was accepted, sent, and taken off the day's takings;
   a minus expense took $40 off a seller's pay. A stuck key's nine-digit cash
   was turned away by the database, and the phone said "Waiting for signal"
   for ever. Nothing a seller's phone keyboard can type should get as far as
   the shop wrong - so each one is named, while the day is still in front of
   them. The ceilings are far above any real market and far below what the
   database refuses. */
const MONEY_MAX = 20000, COUNT_MAX = 5000;
function numberProblems(){
  const m = [];
  const money = (label, raw, sel) => {
    if(raw === "" || raw === null || raw === undefined) return;
    const v = Number(raw);
    if(!Number.isFinite(v)) m.push({ label: label + " isn't a number", sel });
    else if(v < 0) m.push({ label: label + " can't be below $0", sel });
    else if(v > MONEY_MAX) m.push({ label: label + " looks too big — check it", sel });
  };
  money("Cash", S.cashCounted, "#cash");
  money("Square", S.cardTotal, "#card");
  (S.otherPays || []).forEach((o, i) =>
    money(String(o.how || "Other payment").trim().slice(0, 24) || "Other payment", o.amount, `[data-pay='${i}'][data-f='amount']`));
  (S.expenses || []).forEach((e, i) =>
    money(String(e.kind || "Expense").trim().slice(0, 24) || "Expense", e.amount, `[data-exp='${i}'][data-f='amount']`));
  money("Discounts", S.discounts, "#disc");
  const t = S.travel || {};
  if(t.mode === "own" && t.gasMode === "flat") money("Gas", t.gasAmount, "#gasamt");
  if(S.chipsSold !== "" && S.chipsSold !== null && S.chipsSold !== undefined){
    const c = Number(S.chipsSold);
    if(!Number.isFinite(c) || c < 0 || !Number.isInteger(c)) m.push({ label:"chips has to be a whole number", sel:"#chips" });
    else if(c > COUNT_MAX) m.push({ label:"chips looks too big — check it", sel:"#chips" });
  }
  WENT_OUT().forEach(p => {
    if((S.opening[p] || 0) > COUNT_MAX)
      m.push({ label: prod(p).short + " went out looks too big", sel:"[data-set='closing'][data-p='" + p + "']" });
  });
  return m;
}

function closeoutMissing(){
  const m = numberProblems();
  /* Wrong before blank. A number that cannot be true needs fixing while the
     cooler is still open and the row is still fresh in their head - being sent
     to the next empty box first is how a typo survives to the end of the day. */
  WENT_OUT().forEach(p=>{
    if(countProblem(p)) m.push({ label:prod(p).short+" doesn't add up", sel:"[data-set='closing'][data-p='"+p+"']" });
  });
  WENT_OUT().forEach(p=>{
    const v = S.closing[p];
    if(v===undefined || v===null || v==="")
      m.push({ label:prod(p).short+" count", sel:"[data-set='closing'][data-p='"+p+"']" });
  });
  if(S.soldOut===null) m.push({ label:"did you sell out", sel:"[data-sold='no']" });
  if(S.cashCounted==="") m.push({ label:"cash counted", sel:"#cash" });
  if(S.cardTotal==="")   m.push({ label:"Square total",  sel:"#card" });
  if(S.chipsSold==="")   m.push({ label:"chips sold",    sel:"#chips" });
  (S.expenses||[]).forEach((e,i)=>{
    if(Number(e.amount) && !e.source)
      m.push({ label:"who paid for the "+String(e.kind||"expense").toLowerCase(),
               sel:"[data-expsrc='"+i+"']" });
  });
  /* Getting there. Asked, not assumed: an unanswered card used to read as
     "company van, drove nobody", which paid a driver nothing and an own-car
     seller no gas. Driving pay needs a name, and gas can only be paid once. */
  const t = S.travel || {};
  if(!t.mode) m.push({ label:"how you got there", sel:"[data-travel='van']" });
  if(t.mode==="van" && (t.legs===null || t.legs===undefined))
    m.push({ label:"did you drive someone", sel:"[data-legs='0']" });
  if(t.mode==="van" && t.legs>0 && !String(t.passenger || "").trim())
    m.push({ label:"who you drove", sel:"#pass" });
  if(t.mode==="own" && !t.gasMode)
    m.push({ label:"how the gas is covered", sel:"[data-gasmode='claim']" });
  if(t.mode==="own" && t.gasMode==="flat" && !(Number(t.gasAmount) > 0))
    m.push({ label:"the gas amount", sel:"#gasamt" });
  if(gasTwice()) m.push({ label:"gas is in twice", sel:"#gasamt" });
  return m;
}
function foot_closeout(){
  const miss = closeoutMissing();
  if(!miss.length){
    return `<button class="btn" data-go="result">Send it in</button>
            <button class="btn btn-quiet" data-go="market">Back</button>`;
  }
  const first = miss[0];
  return `<button class="btn btn-ghost" data-act="jump" data-sel="${first.sel}">
            <span>${miss.length} left &mdash; next: ${esc(first.label)}</span>
          </button>
          <button class="btn btn-quiet" data-go="market">Back</button>`;
}
