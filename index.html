<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#E9EEF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#060A0F" media="(prefers-color-scheme: dark)">
<title>PackOut</title>

<!-- Installed to the home screen, this opens full screen with no address bar. -->
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./favicon-32.png" sizes="32x32" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PackOut">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600..700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap">

<style>
/* ============================================================
   PackOut — liquid glass over a dawn ground.

   Glass only reads as glass when there is something behind it to
   refract, so the page sits on a fixed dawn wash and the surfaces
   above it blur what they cover. Three layers of depth:

     ground   the dawn wash. fixed, never scrolls
     glass    cards and panels. translucent, blurred, lit on top
     chrome   top bar, tabs, action bar. denser, tinted, above all

   Two rules that keep this fast and honest:

   1. Blur only surfaces that sit directly on the ground. Anything
      inside an already-blurred card has nothing left to refract, so
      blurring it again costs frames and shows nothing. That matters
      on a mid-range phone at a market.

   2. Chrome is a TINTED material, not white at low alpha. In the
      dark theme it tints toward the ground, or page content reads
      straight through the bar it is supposed to sit above.

   The hairline on the top edge of every surface is the specular
   rim. It is the single detail that makes a flat translucent box
   read as a lit physical object rather than a faded rectangle.
   ============================================================ */

:root{
  /* --- ground: dawn --- */
  --ground-0:#E9EEF3;
  --wash-a:rgba(6,124,156,.26);
  --wash-b:rgba(58,78,190,.15);
  --wash-c:rgba(226,132,54,.22);

  /* --- materials --- */
  --glass:rgba(255,255,255,.50);
  --glass-2:rgba(255,255,255,.72);
  --glass-3:rgba(255,255,255,.30);
  --chrome:rgba(250,252,254,.68);
  --glass-line:rgba(14,32,48,.11);
  --glass-line-2:rgba(14,32,48,.07);
  --sheen:rgba(255,255,255,.85);
  --lens:rgba(255,255,255,.5);
  --blur:blur(20px) saturate(175%);
  --blur-lg:blur(30px) saturate(190%);

  /* --- ink --- */
  --ink:#0A141C;
  --ink-2:#3A4A58;
  --muted:#6B7B8A;

  /* --- accents --- */
  --accent:#04687F;
  --accent-lit:#0B8FAE;
  --accent-ink:#FFFFFF;
  --accent-soft:rgba(6,140,172,.13);
  --ember:#B4560E;
  --ember-soft:rgba(200,110,30,.14);
  --good:#0C6B48;
  --good-soft:rgba(16,140,95,.14);
  --warn:#8E5405;
  --warn-soft:rgba(190,120,10,.15);
  --bad:#A11F16;
  --bad-soft:rgba(190,45,32,.13);

  --shadow:0 1px 1px rgba(16,32,48,.05), 0 14px 34px -16px rgba(16,32,48,.30);
  --shadow-lg:0 2px 3px rgba(16,32,48,.07), 0 26px 56px -22px rgba(16,32,48,.40);
  --rim:inset 0 1px 0 var(--sheen);

  --r-lg:22px;
  --r:16px;
  --r-sm:11px;
  --r-xs:8px;
  --topbar-h:58px;

  --f-display:"Fraunces","Iowan Old Style",Georgia,serif;
  --f-ui:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;

  /* Aliases. The app's markup names these directly in a few inline
     styles; keeping them defined means nothing can quietly break. */
  --line:var(--glass-line);
  --surface:var(--glass);
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground-0:#060A0F;
    --wash-a:rgba(26,118,152,.34);
    --wash-b:rgba(48,58,158,.27);
    --wash-c:rgba(150,68,22,.23);

    --glass:rgba(255,255,255,.055);
    --glass-2:rgba(255,255,255,.09);
    --glass-3:rgba(255,255,255,.032);
    --chrome:rgba(8,13,19,.66);
    --glass-line:rgba(255,255,255,.13);
    --glass-line-2:rgba(255,255,255,.068);
    --sheen:rgba(255,255,255,.17);
    --lens:rgba(255,255,255,.085);

    --ink:#EBF2F8;
    --ink-2:#AFC0CE;
    --muted:#7C8D9D;

    --accent:#5AD1F0;
    --accent-lit:#8AE3FF;
    --accent-ink:#04222D;
    --accent-soft:rgba(90,209,240,.15);
    --ember:#FFA95C;
    --ember-soft:rgba(255,150,70,.15);
    --good:#4FD9A0;
    --good-soft:rgba(79,217,160,.14);
    --warn:#FFC062;
    --warn-soft:rgba(255,180,80,.14);
    --bad:#FF8078;
    --bad-soft:rgba(255,110,100,.15);

    --shadow:0 1px 1px rgba(0,0,0,.40), 0 14px 34px -16px rgba(0,0,0,.80);
    --shadow-lg:0 2px 4px rgba(0,0,0,.45), 0 28px 60px -22px rgba(0,0,0,.90);
  }
}

:root[data-theme="dark"]{
  --ground-0:#060A0F;
  --wash-a:rgba(26,118,152,.34);
  --wash-b:rgba(48,58,158,.27);
  --wash-c:rgba(150,68,22,.23);

  --glass:rgba(255,255,255,.055);
  --glass-2:rgba(255,255,255,.09);
  --glass-3:rgba(255,255,255,.032);
  --chrome:rgba(8,13,19,.66);
  --glass-line:rgba(255,255,255,.13);
  --glass-line-2:rgba(255,255,255,.068);
  --sheen:rgba(255,255,255,.17);
  --lens:rgba(255,255,255,.085);

  --ink:#EBF2F8;
  --ink-2:#AFC0CE;
  --muted:#7C8D9D;

  --accent:#5AD1F0;
  --accent-lit:#8AE3FF;
  --accent-ink:#04222D;
  --accent-soft:rgba(90,209,240,.15);
  --ember:#FFA95C;
  --ember-soft:rgba(255,150,70,.15);
  --good:#4FD9A0;
  --good-soft:rgba(79,217,160,.14);
  --warn:#FFC062;
  --warn-soft:rgba(255,180,80,.14);
  --bad:#FF8078;
  --bad-soft:rgba(255,110,100,.15);

  --shadow:0 1px 1px rgba(0,0,0,.40), 0 14px 34px -16px rgba(0,0,0,.80);
  --shadow-lg:0 2px 4px rgba(0,0,0,.45), 0 28px 60px -22px rgba(0,0,0,.90);
}

*{box-sizing:border-box}

/* Base colour lives on <html> so body::before can sit above it and
   below the content without fighting the canvas background. */
html{background:var(--ground-0)}

body{
  margin:0;
  background:transparent;
  color:var(--ink);
  font-family:var(--f-ui);
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
}

/* The dawn. Fixed, so the glass has a stable thing to refract while
   the page travels over it. */
body::before{
  content:"";
  position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(120% 78% at 8% -12%,  var(--wash-a), transparent 64%),
    radial-gradient(105% 70% at 98% 2%,   var(--wash-b), transparent 62%),
    radial-gradient(125% 85% at 46% 112%, var(--wash-c), transparent 64%);
}

button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-lit);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.num{font-variant-numeric:tabular-nums;letter-spacing:-.012em}
.lbl{
  font-family:var(--f-num);
  font-size:9.5px;font-weight:500;
  letter-spacing:.15em;text-transform:uppercase;
  color:var(--muted);
}

/* ---------- shell ---------- */
.shell{max-width:520px;margin:0 auto;padding:0 0 108px}
.shell.wide{max-width:1000px}

.topbar{
  position:sticky;top:0;z-index:30;
  background:var(--chrome);
  -webkit-backdrop-filter:var(--blur-lg);backdrop-filter:var(--blur-lg);
  border-bottom:1px solid var(--glass-line);
  box-shadow:var(--rim);
}
.topbar-in{
  max-width:1000px;margin:0 auto;min-height:var(--topbar-h);
  display:flex;align-items:center;gap:12px;padding:9px 16px;
}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;min-width:0}
.brand b{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:-.024em}
.brand span{
  font-family:var(--f-num);font-size:8.5px;font-weight:500;
  letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
}

.modesw{
  display:flex;gap:2px;padding:3px;border-radius:999px;
  background:var(--glass-3);border:1px solid var(--glass-line-2);box-shadow:var(--rim);
}
.modesw button{
  border:0;background:transparent;cursor:pointer;
  font-size:12.5px;font-weight:600;padding:7px 15px;border-radius:999px;
  color:var(--muted);white-space:nowrap;letter-spacing:-.005em;
  transition:color .18s,background .18s;
}
.modesw button[aria-pressed="true"]{
  background:linear-gradient(180deg,var(--accent-lit),var(--accent));
  color:var(--accent-ink);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.34),0 2px 8px -2px rgba(0,0,0,.4);
}

/* ---------- generic ---------- */
.pad{padding:18px 16px}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-sm{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px}
.row-b{display:flex;align-items:baseline;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grow{flex:1;min-width:0}

/* ---------- glass surfaces (blurred: these sit on the ground) ---------- */
.card,.tile,.tap,.ticker,.insight,.toast,.tap-out{
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
}

.card{
  position:relative;
  background:var(--glass);
  border:1px solid var(--glass-line);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow),var(--rim);
  overflow:hidden;
}
/* The lens: light raking across the top of the panel. */
.card::before,.tile::before{
  content:"";position:absolute;left:0;right:0;top:0;height:50%;
  pointer-events:none;background:linear-gradient(180deg,var(--lens),transparent);
}
.card>*,.tile>*{position:relative}
.card-pad{padding:16px}
.card-hd{
  padding:13px 16px;border-bottom:1px solid var(--glass-line-2);
  display:flex;align-items:center;justify-content:space-between;
  gap:8px 10px;flex-wrap:wrap;
}
/* The title keeps the line; a long pill beside it drops underneath rather
   than squeezing a two-word heading into two ragged lines. */
.card-hd h3{
  margin:0;font-family:var(--f-display);font-size:16px;font-weight:600;
  letter-spacing:-.018em;flex:1 1 auto;min-width:0;
}
.card-hd .pill{flex:0 1 auto;max-width:100%;overflow:hidden;text-overflow:ellipsis}

.stripe{border-left:3px solid var(--glass-line)}
.stripe-good{border-left-color:var(--good)}
.stripe-warn{border-left-color:var(--warn)}
.stripe-bad{border-left-color:var(--bad)}
.stripe-live{border-left-color:var(--accent)}

/* Small parts: translucent, never blurred — they sit on glass already. */
.pill{
  display:inline-flex;align-items:center;gap:5px;
  font-family:var(--f-num);font-size:9px;font-weight:500;
  letter-spacing:.12em;text-transform:uppercase;
  padding:4px 9px;border-radius:999px;
  background:var(--glass-3);color:var(--muted);
  border:1px solid var(--glass-line-2);white-space:nowrap;
}
.pill-good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill-warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill-bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill-live{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill-live .dot{animation:blip 1.8s ease-in-out infinite;box-shadow:0 0 8px currentColor}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.22}}

h1.page{
  margin:0;font-family:var(--f-display);
  font-size:33px;font-weight:700;line-height:1.03;
  letter-spacing:-.032em;text-wrap:balance;
}
h2.sec{
  margin:0;font-family:var(--f-num);font-size:9.5px;font-weight:500;
  letter-spacing:.15em;text-transform:uppercase;color:var(--muted);
}
p.note{margin:0;color:var(--muted);font-size:13.5px;line-height:1.5}

.big{font-weight:600;font-size:38px;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.mid{font-weight:600;font-size:24px;letter-spacing:-.032em;line-height:1;font-variant-numeric:tabular-nums}

/* ---------- buttons ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;border:1px solid transparent;cursor:pointer;
  background:linear-gradient(180deg,var(--accent-lit),var(--accent));
  color:var(--accent-ink);
  font-size:15.5px;font-weight:600;letter-spacing:-.014em;
  padding:17px;border-radius:var(--r);min-height:56px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.36),
    0 1px 2px rgba(0,0,0,.20),
    0 12px 26px -14px var(--accent);
  transition:transform .12s ease,box-shadow .18s ease,filter .18s ease;
}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(1px) scale(.995)}
/* Disabled has to stay opaque. This button floats over the page in the fixed
   footer, so dimming it with opacity lets whatever is scrolling underneath
   show straight through the label. */
.btn[disabled]{
  background:var(--glass-3);color:var(--muted);
  border-color:var(--glass-line-2);cursor:not-allowed;
  box-shadow:var(--rim);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
}
.btn[disabled]:hover{filter:none}
.btn[disabled]:active{transform:none}

.btn-ghost{
  background:var(--glass);color:var(--ink);
  border:1px solid var(--glass-line);
  box-shadow:var(--shadow),var(--rim);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
}
.btn-ghost:hover{filter:none;background:var(--glass-2)}
.btn-quiet{
  background:transparent;color:var(--muted);
  border:1px solid var(--glass-line);
  min-height:46px;font-size:13px;font-weight:600;padding:11px;box-shadow:none;
}
.btn-quiet:hover{filter:none;color:var(--ink-2)}
.btn-sm{min-height:42px;padding:10px 16px;font-size:13px;width:auto}

/* The action bar. Blur fades out through a mask instead of a colour
   gradient — a colour fade cannot match a ground that is washed with
   gradients, and would show as a band. */
.sticky-foot{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  padding:22px 16px calc(16px + env(safe-area-inset-bottom));
  pointer-events:none;
}
.sticky-foot::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top,var(--chrome),transparent);
  -webkit-backdrop-filter:var(--blur-lg);backdrop-filter:var(--blur-lg);
  -webkit-mask-image:linear-gradient(to top,#000 56%,transparent);
  mask-image:linear-gradient(to top,#000 56%,transparent);
}
.sticky-foot-in{
  position:relative;pointer-events:auto;
  max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:9px;
}

/* ---------- stepper ---------- */
.step-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--glass-line-2)}
.step-row:last-child{border-bottom:0}
.step-name{font-weight:600;font-size:15.5px;letter-spacing:-.018em}
.step-sub{font-family:var(--f-num);font-size:9.5px;color:var(--muted);letter-spacing:.07em;margin-top:3px}
.stepper{display:flex;align-items:center;flex:none}
.stepper button{
  width:44px;height:46px;border:1px solid var(--glass-line);
  background:var(--glass-3);font-size:19px;font-weight:500;cursor:pointer;color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--rim);transition:background .15s;
}
.stepper button:hover{background:var(--glass-2)}
.stepper button:active{background:var(--accent-soft)}
.stepper button:first-child{border-radius:var(--r-sm) 0 0 var(--r-sm)}
.stepper button:last-child{border-radius:0 var(--r-sm) var(--r-sm) 0}
.stepper input{
  width:62px;height:46px;text-align:center;
  border:1px solid var(--glass-line);border-left:0;border-right:0;
  background:var(--glass);color:var(--ink);
  font-family:var(--f-ui);font-weight:600;font-size:19px;
  font-variant-numeric:tabular-nums;letter-spacing:-.022em;
  -moz-appearance:textfield;box-shadow:var(--rim);
}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* ---------- tap cards ---------- */
.tap{
  position:relative;width:100%;
  border:1px solid var(--glass-line);
  background:var(--glass);color:var(--ink);
  border-radius:var(--r-lg);padding:18px 20px;cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  min-height:100px;text-align:left;
  box-shadow:var(--shadow),var(--rim);
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  transition:background .15s,border-color .15s,transform .1s;
}
.tap:active{background:var(--accent-soft);border-color:var(--accent);transform:scale(.99)}
.tap-name{font-size:19px;font-weight:600;letter-spacing:-.024em;line-height:1.15}
.tap-left{font-family:var(--f-num);font-size:9.5px;letter-spacing:.09em;color:var(--muted);margin-top:6px}
.tap-count{font-size:44px;font-weight:600;letter-spacing:-.048em;line-height:1;font-variant-numeric:tabular-nums}
.tap-out{
  position:absolute;inset:0;border-radius:var(--r-lg);
  background:var(--bad-soft);color:var(--bad);
  display:flex;align-items:center;justify-content:center;
  font-weight:600;font-size:15px;letter-spacing:-.012em;
}

.ticker{
  display:grid;grid-template-columns:1fr 1fr 1fr;
  background:var(--glass);border:1px solid var(--glass-line);
  border-radius:var(--r-lg);box-shadow:var(--shadow),var(--rim);overflow:hidden;
}
.ticker div{padding:13px 14px;border-right:1px solid var(--glass-line-2)}
.ticker div:last-child{border-right:0}
.ticker .mid{margin-top:5px}

/* ---------- key/value ---------- */
.kv{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--glass-line-2)}
.kv:last-child{border-bottom:0}
.kv-k{font-size:13.5px;color:var(--ink-2)}
.kv-v{font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.018em}
.kv-total{border-top:1px solid var(--glass-line);border-bottom:0;margin-top:5px;padding-top:13px}
.kv-total .kv-k{font-weight:600;font-size:14.5px;color:var(--ink)}
.kv-total .kv-v{font-size:22px;letter-spacing:-.03em}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  font-family:var(--f-num);font-size:10px;font-weight:400;
  padding:5px 9px;border-radius:var(--r-xs);
  background:var(--glass-3);color:var(--ink-2);
  border:1px solid var(--glass-line-2);
  font-variant-numeric:tabular-nums;letter-spacing:.03em;
}
.chip-hi{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:500}

/* ---------- fields ---------- */
.field{display:flex;flex-direction:column;gap:7px}
.field input,.field textarea,.field select,.inp{
  width:100%;padding:14px 15px;
  border:1px solid var(--glass-line);border-radius:var(--r-sm);
  background:var(--glass);color:var(--ink);font-size:16px;
  font-family:var(--f-ui);font-variant-numeric:tabular-nums;
  box-shadow:var(--rim);transition:border-color .15s,background .15s;
}
.field input:focus,.field textarea:focus,.field select:focus,.inp:focus{
  outline:none;border-color:var(--accent);background:var(--glass-2);
}
.field textarea{min-height:106px;resize:vertical;line-height:1.5}
.inp-sm{padding:12px 12px;font-size:15px;border-radius:var(--r-xs)}
.field-money{position:relative}
.field-money input{padding-left:32px}
.field-money::before{
  content:"$";position:absolute;left:15px;top:40px;
  color:var(--muted);font-size:16px;z-index:1;font-weight:500;
}
/* A money field with no label above it — the $ rides at the input's own top. */
.field-money.bare::before{top:13px;left:13px;font-size:15px}
.thumb{width:46px;height:46px;object-fit:cover;border-radius:var(--r-xs);border:1px solid var(--glass-line)}

.seg{display:flex;gap:7px}
.seg button{
  flex:1;border:1px solid var(--glass-line);background:var(--glass);
  padding:13px 8px;border-radius:var(--r-sm);cursor:pointer;
  font-size:14px;font-weight:600;color:var(--ink-2);min-height:50px;

<script>
(function(){
"use strict";

/* =========================================================
   Seed data \u2014 realistic Bay Area operation
   ========================================================= */

/* The real range, from the people who pack the coolers. Every pack is two

   All eleven are normal stock, though any one of them might simply not get
   made on a given day, so nothing here should assume eleven every morning.

   caseSize is 1 on purpose. The old value of 12 was invented, and rounding a

   turn out to pack in dozens, this is the one line to change. */
const PRODUCTS = [
  { id:"chilicorn",  name:"Cheese Chili Corn",   short:"Chili corn",  price:15, caseSize:1, kind:"tamale", diet:"veg" },
  { id:"cheddar",    name:"Smoked Cheddar",      short:"Cheddar",     price:15, caseSize:1, kind:"tamale", diet:"veg" },
  // The shop's paper sheets call this one "4 cheese". Same tamale.
  { id:"beancheese", name:"Bean and Cheese",     short:"Bean & cheese", price:15, caseSize:1, kind:"tamale", diet:"veg" },
  { id:"goat",       name:"Goat Cheese",         short:"Goat cheese", price:15, caseSize:1, kind:"tamale", diet:"veg" },
  { id:"veggie",     name:"Summer Veggie",       short:"Summer veggie", price:15, caseSize:1, kind:"tamale", diet:"vegan" },
  { id:"cauli",      name:"Spicy Cauliflower",   short:"Cauliflower", price:15, caseSize:1, kind:"tamale", diet:"vegan" },
  { id:"chicken",    name:"Chicken",             short:"Chicken",     price:15, caseSize:1, kind:"tamale", diet:"chicken" },
  { id:"beef",       name:"Beef and Cheese",     short:"Beef",        price:15, caseSize:1, kind:"tamale", diet:"beef" },
  { id:"pumpkin",    name:"Pumpkin",             short:"Pumpkin",     price:15, caseSize:1, kind:"tamale", diet:"vegan" },
  { id:"beans",      name:"Red and Black Beans", short:"Red & black", price:15, caseSize:1, kind:"tamale", diet:"vegan" },
  { id:"breakfast",  name:"Breakfast",           short:"Breakfast",   price:15, caseSize:1, kind:"tamale", diet:"veg" },
  { id:"eggplant",   name:"Eggplant",            short:"Eggplant",    price:15, caseSize:1, kind:"tamale", diet:"vegan" },

  /* Salsas ride along in the same list so they get counted, priced and paid
     out exactly like everything else. The kind is what keeps them out of the
     tamale-only language and out of the batch-age logic. */
  { id:"classic",   name:"Classic Salsa",         short:"Classic",   price:8, caseSize:1, kind:"salsa", diet:"vegan" },
  { id:"chipotle",  name:"Chipotle Salsa",        short:"Chipotle",  price:8, caseSize:1, kind:"salsa", diet:"vegan" },
  { id:"mango",     name:"Mango Salsa",           short:"Mango",     price:8, caseSize:1, kind:"salsa", diet:"vegan" },
  { id:"pineapple", name:"Spicy Pineapple Salsa", short:"Pineapple", price:8, caseSize:1, kind:"salsa", diet:"vegan" },
  { id:"tomatillo", name:"Tomatillo Salsa",       short:"Tomatillo", price:8, caseSize:1, kind:"salsa", diet:"vegan" }
];
/* Chips are not a counted product and never can be. The shop says "take two
   bags", one big bag becomes five to seven little ones depending on who is
   bagging, and nobody counts what comes back. So there is no opening count
   worth having and no closing count at all.

   What there is, is money: $6 a bag, landing in the same till. Left
   unattributed it would inflate every tamale's money-per-pack - on a good day
   yield could read higher than full price, which looks broken. So the seller
   gives one number at close, and chip takings come back out of the yield. */
// $6 a bag, confirmed. It matters more than it looks: chip money comes off the
// takings before the packs are divided into them, so a wrong price here would
// skew every seller's money-per-pack figure.
const CHIPS = { price:6, bagsPerBig:6 };
const chipsSold = () => Math.max(0, Number(S.chipsSold)||0);
const chipMoney = () => chipsSold() * CHIPS.price;
// Rough guide only - the shop just says take two, more at the busier markets.
const chipBagsFor = mid => Math.min(7, Math.max(2, Math.round(mkt(mid).size * 3)));

const TAMALE_IDS = PRODUCTS.filter(p=>p.kind==="tamale").map(p=>p.id);
const SALSA_IDS  = PRODUCTS.filter(p=>p.kind==="salsa").map(p=>p.id);
const KINDS = [["tamale","Tamales"],["salsa","Salsas"]];
const TAMALES_PER_PACK = 2;
/* Every tamale is lard free and gluten free - a blanket fact, so it is said
   once rather than tagged on all eleven. Only the vegan/vegetarian split
   varies, and customers ask about it constantly. */
const DIET_TAG = { vegan:"Vegan", veg:"Vegetarian" };
const PACKS_PER_COOLER = 50;   // rough, from the shop
const P_IDS = PRODUCTS.map(p=>p.id);
const prod = id => PRODUCTS.find(p=>p.id===id);

/* 20% of everything the day sold, not of what the cooler was worth at list
   price. Anything bought out of the till - ice, parking - is the shop's cost
   rather than the seller's, so it does not shrink their pay. Anything given
   away is money they never earn on, which is the point.

   Paying on list value instead would overpay whoever discounts hardest and
   underpay whoever sells chips well, which is backwards on both counts. */
const COMMISSION = 0.20;

/* What one person earns for a day. Placeholder until the real figures are in
   - "most is like 160" but Nawid raises and lowers it per person, so a single
   shop-wide number would quietly pay several people the wrong amount. */
/* Nawid said "most is like 160". Both sellers asked directly said 150. Going
   with the people who receive it - but this default is still a guess, and the
   aim is that nobody relies on it: Zack is 220 at one market and 120 at
   another, so any single number is wrong for somebody. */
const BASE_PAY_DEFAULT = 150;

/* A person carries their usual deal, and a market can override it. Zack is the
   case that proves it is needed: $220 or 22% at Alameda on Saturday, $120 or
   20% at Montclair on Sunday. Same man, same week. One figure against his name
   would be wrong on at least one of those days. */
function rateFor(sid, mid){
  const s = slr(sid);
  const m = mid ? mkt(mid) : null;
  const over = (m && m.payBy) ? m.payBy[sid] : null;
  const base = (over && over.basePay != null) ? over.basePay
             : (s && typeof s.basePay === "number") ? s.basePay
             : BASE_PAY_DEFAULT;
  const rate = (over && over.rate != null) ? over.rate
             : (s && typeof s.rate === "number") ? s.rate
             : COMMISSION;
  return { base, rate };
}
const basePayFor = sid => rateFor(sid, null).base;

// The floor and the commission do not stack: whichever is more.
function dayPay(sid, took, mid){
  const { base, rate } = rateFor(sid, mid || null);
  const commission = took * rate;
  return commission >= base
    ? { amount: commission, kind: "commission", commission, base, rate }
    : { amount: base,       kind: "base",       commission, base, rate };
}
const DRIVER_LEG_PAY = 10;    // $10 to drop off, $10 to pick up
const EXPENSE_KINDS = ["Gas","Ice","Parking","Supplies","Other"];

/* One van, two markets. The person going furthest drives and drops the other
   off on the way, so the shop pays that gas once and it gets split between them.
   The $20 driver pay is NOT charged to a market - it is payroll the shop owes
   the driver, same as commission or paying someone back for ice. */
function gasFor(min){ return Math.round(min * 2 * 0.35); }
function vanRunFor(mid){ return VAN_RUNS.find(r => r.driver===mid || r.riders.indexOf(mid)>=0); }
function vanCostFor(mid){
  const run = vanRunFor(mid);
  if(!run) return { ride:0, gas:gasFor(mkt(mid).driveMin), shareNames:[], rider:false };
  const stops = 1 + run.riders.length;
  const gas = Math.round(gasFor(mkt(run.driver).driveMin) / stops);
  const rider = run.riders.indexOf(mid) >= 0;
  const others = (run.driver===mid ? run.riders : [run.driver].concat(run.riders.filter(r=>r!==mid)));
  return { ride: rider ? DRIVER_LEG_PAY*2 : 0, gas, shareNames: others.map(r=>mkt(r).name), rider };
}

/* ---- The real operation ----
   Forty-six market slots a week across the seven days. A place that runs on
   more than one day is a separate market each time: Berkeley on Monday sells
   nothing like Berkeley on Thursday, and lumping them would average away the
   only thing worth knowing. The Kaiser sites are their own markets too, not
   versions of the town they sit in.

   crew is who normally works it. Fourteen slots have nobody listed - those are
   worked, the name just was not written down, so they show as unassigned
   rather than as days off.

   What is NOT here yet, because nobody has been asked market by market: the
   stall fee, the opening hours, and the drive. The owner gave ranges only -
   $45 to $95, four hours almost everywhere, around 45 minutes - so those live
   in SHOP below as shop-wide defaults and every screen marks them as guesses.
   Fill a real value in on a market and the guess label goes away by itself. */

const SHOP = {
  sellHrs: 4,          // he says 99% of them are four hours - this one is real
  eveningHours: "4:00 - 8:00",   // seasonal, and only on the markets marked evening
  setupBefore: 1,                // "be there an hour before" - per market where known
  fee: null,           // $45-$95 depending on the market, nobody has said which
  driveMin: 45,        // "avg 45, sometimes more or less"
  feeLow: 45, feeHigh: 95
};

const SELLERS = [
  { id:"ali", name:"Ali" },
  { id:"almas", name:"Almas" },
  { id:"amin", name:"Amin" },
  { id:"bahir", name:"Bahir", basePay:150 },
  { id:"billal", name:"Billal" },
  { id:"brook", name:"Brook" },
  { id:"daud", name:"Daud" },
  { id:"emilio", name:"Emilio" },
  { id:"habid", name:"Habid" },
  { id:"joey", name:"Joey" },
  { id:"musawir", name:"Musawir" },
  { id:"muzamil", name:"Muzamil" },
  { id:"nawid", name:"Nawid" },
  { id:"suliman", name:"Suliman", basePay:150 },
  { id:"young", name:"Young" },
  { id:"zack", name:"Zack" }
];

const MARKETS = [
  { id:"fairfield-mon", name:"Fairfield", day:"Mon", crew:["emilio"], vehicle:null },
  { id:"modesto-mon", name:"Modesto", day:"Mon", crew:["muzamil"], vehicle:null },
  { id:"berkeley-mon", name:"Berkeley", day:"Mon", crew:[], vehicle:null },
  { id:"oakland-mon", name:"Oakland", day:"Mon", crew:["billal"], vehicle:null },
  { id:"martinezkaiser-mon", name:"Martinez Kaiser", day:"Mon", crew:[], vehicle:null },
  { id:"concord-tue", name:"Concord", day:"Tue", crew:[], vehicle:null },
  { id:"berkeley-tue", name:"Berkeley", day:"Tue", crew:["billal"], vehicle:null },
  { id:"sanleandro-tue", name:"San Leandro", day:"Tue", crew:[], vehicle:null },
  { id:"martinez-tue", name:"Martinez", day:"Tue", crew:[], vehicle:null },
  { id:"walnutcreekkaiser-wed", name:"Walnut Creek Kaiser", day:"Wed", crew:["habid"], vehicle:null },
  { id:"paloalto-wed", name:"Palo Alto", day:"Wed", crew:[], vehicle:null },
  { id:"santarosa-wed", name:"Santa Rosa", day:"Wed", crew:[], vehicle:null },
  { id:"sanleandro-wed", name:"San Leandro", day:"Wed", crew:["bahir"], vehicle:null,
    evening:true, hours:"3:00 - 7:00", setupBefore:1.5 },
  { id:"sanrafael-thu", name:"San Rafael", day:"Thu", crew:[], vehicle:null },
  { id:"richmondkaiser-thu", name:"Richmond Kaiser", day:"Thu", crew:[], vehicle:null },
  { id:"losaltos-thu", name:"Los Altos", day:"Thu", crew:[], vehicle:null },
  { id:"berkeley-thu", name:"Berkeley", day:"Thu", crew:[], vehicle:null },
  { id:"vallejokaiser-fri", name:"Vallejo Kaiser", day:"Fri", crew:["muzamil"], vehicle:null },
  { id:"oaklandkaiser-fri", name:"Oakland Kaiser", day:"Fri", crew:["joey"], vehicle:null },
  { id:"martinezkaiser-fri", name:"Martinez Kaiser", day:"Fri", crew:[], vehicle:null },
  { id:"rossmoor-fri", name:"Rossmoor", day:"Fri", crew:["bahir"], vehicle:null },
  { id:"natomas-sat", name:"Natomas", day:"Sat", crew:["bahir"], vehicle:"Grey minivan" },
  { id:"orinda-sat", name:"Orinda", day:"Sat", crew:["ali"], vehicle:null },
  { id:"pleasanthill-sat", name:"Pleasant Hill", day:"Sat", crew:["suliman"], vehicle:null },
  { id:"sunnyvale-sat", name:"Sunnyvale", day:"Sat", crew:["muzamil"], vehicle:null },
  { id:"diablo-sat", name:"Diablo", day:"Sat", crew:["billal"], vehicle:null },
  { id:"oakland-sat", name:"Oakland", day:"Sat", crew:["almas","musawir"], vehicle:null },
  { id:"pinole-sat", name:"Pinole", day:"Sat", crew:["muzamil","young"], vehicle:null },
  { id:"brentwood-sat", name:"Brentwood", day:"Sat", crew:["daud"], vehicle:null },
  { id:"northbeach-sat", name:"North Beach", day:"Sat", crew:[], vehicle:null },
  { id:"alameda-sat", name:"Alameda", day:"Sat", crew:["zack"], vehicle:null, payBy:{ zack:{ basePay:220, rate:0.22 } } },
  { id:"hayward-sat", name:"Hayward", day:"Sat", crew:["emilio"], vehicle:null },

  { id:"stonestown-sun", name:"Stonestown", day:"Sun", crew:["bahir"], vehicle:"Gold van" },

];
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DAY_FULL = { Sun:"Sunday", Mon:"Monday", Tue:"Tuesday", Wed:"Wednesday",
                   Thu:"Thursday", Fri:"Friday", Sat:"Saturday" };
// Shown wherever a number is the shop-wide guess rather than this market's own.
const GUESS = ' <span class="chip">not set</span>';
const feeKnown = m => m.fee != null;
const feeOf    = m => m.fee != null ? m.fee : Math.round((SHOP.feeLow + SHOP.feeHigh) / 2);

const mkt = id => MARKETS.find(m=>m.id===id);
const slr = id => SELLERS.find(s=>s.id===id);

/* Placeholder traits behind the sample history below. How well somebody sells,
   how big a market is, how much walks out free - none of that exists until
   real days are recorded. Seeded so the demo is stable, and attached to real
   names only because the screens need something to draw. Nothing here is a
   claim about an actual person. */
(() => {
  const r = mulberry32(31337);
  SELLERS.forEach(s => { s.base = 0.92 + r()*0.26; s.urban = -0.18 + r()*0.36; s.giveRate = 0.02 + r()*0.12; });
  MARKETS.forEach(m => { m.size = 0.80 + r()*0.70; m.sellHrs = SHOP.sellHrs; m.driveMin = SHOP.driveMin; });
})();

/* Who shares a van. The schedule records a vehicle against some slots, so two
   markets on the same vehicle on the same day are one run - derived rather
   than declared, and empty on days nobody doubled up. */
const VAN_RUNS = (()=>{
  const byDayVehicle = {};
  MARKETS.forEach(m => {
    if(!m.vehicle || m.vehicle === "Own car") return;
    (byDayVehicle[m.day + "|" + m.vehicle] ||= []).push(m.id);
  });
  return Object.values(byDayVehicle).filter(ids => ids.length > 1)
    .map(ids => ({ driver: ids[0], riders: ids.slice(1) }));
})();

// Product mix differs by market \u2014 the app should find this
/* Placeholder demand mix. Which flavours move at which market can only come
   from real recorded days - this is seeded noise so the send list has
   something to work on until then. Do not hand-tune it; replace it. */
const MIX = (()=>{
  const out = {};
  MARKETS.forEach((m, mi) => {
    const r = mulberry32(9001 + mi*131);
    const w = P_IDS.map(() => 0.55 + r());
    const tot = w.reduce((a,b)=>a+b, 0);
    out[m.id] = {};
    P_IDS.forEach((pid, i) => out[m.id][pid] = w[i]/tot);
  });
  return out;
})();
// Urban-leaning markets, for seller affinity
const URBAN = (()=>{ const r = mulberry32(5150), o = {}; MARKETS.forEach(m => o[m.id] = r()); return o; })();

/* How much a given kind of day moves sales. Used two ways: to stop a rained-out
   Saturday from dragging down a market's average, and to size the send list to
   the forecast. In the prototype these are seeded - live weather needs a server. */
const WX_MULT = { "Clear":1.0, "Overcast":0.94, "Fog":0.90, "Rain":0.58, "Windy":0.88 };
const wxMult = t => WX_MULT[t] || 1;


const WEATHER = [
  { t:"Clear", temp:72, mult:1.0 }, { t:"Clear", temp:78, mult:1.02 },
  { t:"Overcast", temp:61, mult:0.94 }, { t:"Fog", temp:57, mult:0.9 },
  { t:"Clear", temp:69, mult:1.0 }, { t:"Rain", temp:54, mult:0.58 },
  { t:"Windy", temp:63, mult:0.88 }, { t:"Clear", temp:75, mult:1.03 }
];

/* ---- deterministic RNG so numbers never jump around ---- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd = mulberry32(20260828);

/* ---- dates ---- */
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const dISO = d => d.toISOString().slice(0,10);
/* The seller's own calendar day, not UTC. An evening market runs past 5pm
   California time, which is already tomorrow in UTC - stamping the day with
   toISOString would wipe a seller's counts halfway through the market. */
const localDay = d => d.getFullYear() + "-" +
  String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const daysAgo = n => { const d=new Date(TODAY); d.setDate(d.getDate()-n); return d; };
const fmtDate = d => d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
const fmtShort = d => d.toLocaleDateString(undefined,{month:"short",day:"numeric"});

/* =========================================================
   Generate 8 weeks of history
   ========================================================= */

const ROTA = (()=>{
  // Prefer the person who normally works that market; fall back to anyone,
  // since the owner rotates people through when somebody is not doing well.
  const r = mulberry32(8642);
  return Array.from({length:8}, () => {
    const week = {};
    MARKETS.forEach(m => {
      const pool = m.crew.length ? m.crew : SELLERS.map(s=>s.id);
      week[m.id] = pool[Math.floor(r()*pool.length)];
    });
    return week;
  });
})();

function sellerMult(sid, mid){
  const s = slr(sid);
  // A slot with nobody written down has no track record to lean on. Treat it
  // as an average seller rather than letting the screen die on a missing name.
  if(!s) return 1;
  return s.base + s.urban * (URBAN[mid] ?? 0.5);
}

const HISTORY = [];
for(let w=8; w>=1; w--){
  const date = daysAgo(w*7);
  const wx = WEATHER[(w*3+1) % WEATHER.length];
  MARKETS.forEach(m => {
    const sid = ROTA[w-1][m.id];
    // baseline packs sold at this market
    const baseline = 100 * m.size;
    const seasonal = 1 + (8-w)*0.012;           // slow growth over the season
    const noise = 0.9 + rnd()*0.2;
    let total = Math.round(baseline * sellerMult(sid,m.id) * wx.mult * seasonal * noise);

    // opening was decided by gut \u2014 sometimes too little
    const gut = Math.round(baseline * 1.18 * seasonal / 12) * 12;
    const soldOut = total >= gut;
    const sold = soldOut ? gut : total;

    const opening={}, closing={}, samples={}, damaged={};
    let s_left = sold;
    P_IDS.forEach((pid,i)=>{
      const share = MIX[m.id][pid];
      const op = Math.round(gut*share/6)*6;
      opening[pid]=op;
      const sl = i===P_IDS.length-1 ? Math.min(s_left,op) : Math.min(Math.round(sold*share), op);
      closing[pid] = Math.max(0, op - sl);
      s_left -= sl;
      samples[pid] = Math.round(rnd()*4)+2;
      damaged[pid] = rnd()<0.12 ? 1 : 0;
      closing[pid] = Math.max(0, closing[pid] - samples[pid] - damaged[pid]);
    });

    const soldReal = P_IDS.reduce((a,pid)=>a+(opening[pid]-closing[pid]-samples[pid]-damaged[pid]),0);
    const revenue = P_IDS.reduce((a,pid)=>a+(opening[pid]-closing[pid]-samples[pid]-damaged[pid])*prod(pid).price,0);
    const cardShare = 0.62 + rnd()*0.14;
    const cardTotal = Math.round(revenue*cardShare);
    const expectedCash = revenue - cardTotal;
    // How often packs walk out without money: free fifths, deals the seller
    // invented, trades with other vendors. Not theft - the owner does not
    // chase any of it, and none of it can be derived from a count.
    // Giving away is steady, not occasional: a few free ones most days, the
    // odd invented deal, a trade with the stall across the aisle. It scales
    // with how loose a seller is, which is what the yield number surfaces.
    const given = revenue * slr(sid).giveRate * (0.6 + rnd()*0.8);
    const cashCounted = Math.max(0, Math.round(expectedCash - given));

    HISTORY.push({
      id:`${m.id}-${dISO(date)}`, date:dISO(date), dateObj:date,
      marketId:m.id, sellerId:sid, status:"done",
      opening, closing, samples, damaged,
      cardTotal, cashCounted, float:150,
      soldOut, soldOutAt: soldOut ? "1:10pm" : null,
      weather:{ t:wx.t, temp:wx.temp },
      arrived: rnd()<0.15 ? "late" : "ontime"
    });
  });
}

/* ---- how much to send: the flagship calculation ---- */
function recommend(marketId, productId){
  const past = HISTORY.filter(d=>d.marketId===marketId).slice(-4);
  const sold = past.map(d => d.opening[productId]-d.closing[productId]-d.samples[productId]-d.damaged[productId]);
  const anySoldOut = past.some(d=>d.soldOut);

  // A rained-out day is not a weak market. Lift each past day back to what it
  // would have done in normal weather before averaging.
  const normalised = past.map((d,i) => sold[i] / wxMult(d.weather.t));
  const avg = normalised.reduce((a,b)=>a+b,0)/(normalised.length||1);

  const buffer = anySoldOut ? 1.30 : 1.15;
  /* There is no weather feed. FORECAST is a seeded random number that never
     changes, and it used to both show as "Clear, 74° today" and quietly move
     the quantity. A made-up forecast that changes what somebody loads into a
     van is worse than no forecast, so it moves nothing until a real one
     exists. */
  const fc = null;
  const wx = 1;

  const cs = prod(productId).caseSize;
  const qty = Math.ceil(avg*buffer*wx/cs)*cs;
  const plain = Math.ceil(avg*buffer/cs)*cs;
  return { qty, sold, avg, anySoldOut, buffer, fc, wx, plain };
}
function recommendMarket(marketId){
  const out = {}; let total = 0, plain = 0;
  P_IDS.forEach(pid => { const r = recommend(marketId,pid); out[pid]=r; total += r.qty; plain += r.plain; });
  return { byProduct: out, total, plain, fc: null, wx: 1 };
}

  const out={}, r=mulberry32(7717);

function load(){
  try{
    const r = localStorage.getItem(STORE_KEY);
    if(!r) return null;
    const saved = JSON.parse(r);
    if(!saved || typeof saved !== "object") return null;
    // A day saved by an older version is missing fields this one expects.
    // Start from a blank day and lay the saved values on top, so an update
    // can never leave someone staring at an empty screen mid-market.
    const fresh = JSON.parse(JSON.stringify(BLANK));
    const merged = Object.assign(fresh, saved);
    merged.opening  = Object.assign({}, fresh.opening,  saved.opening  || {});
    merged.closing  = Object.assign({}, fresh.closing,  saved.closing  || {});
    // A phone that already typed into samples has a string saved there.
    // Take the object if it is one, and the blank row if it is not.
    const obj = v => (v && typeof v === "object" && !Array.isArray(v)) ? v : {};
    merged.samples  = Object.assign({}, fresh.samples,  obj(saved.samples));
    merged.damaged  = Object.assign({}, fresh.damaged,  obj(saved.damaged));
    if(!Array.isArray(merged.corrections)) merged.corrections = [];
    if(!Array.isArray(merged.expenses)) merged.expenses = [];
    merged.travel = Object.assign({mode:"van",legs:0,passenger:"",marketId:"",gasMode:"claim",gasAmount:""}, merged.travel || {});
    delete merged.drive;
    if(!SELLER_SCREEN_NAMES.includes(merged.screen)) merged.screen = "today";

    /* When to throw a saved day away and start clean.

       NOT at midnight. San Leandro runs to 7pm, they drive back, and they
       count at the shop - Bahir's first real day was sent in at 2:53am. The
       old rule was "different calendar date, start fresh", which wiped an
       entire market's counts the moment the clock rolled over, mid-count,
       with no warning and nothing to get back.

       A market day ends when it is sent in, or when it is old enough that the
       next one has clearly begun. Twenty hours covers a market that starts at
       6am and gets counted at 2am; the closest two markets anybody works are
       a full day apart, so it can never carry yesterday's counts into today's
       cooler. Who they are always carries over. */
    const today = localDay(new Date());
    const AGE_LIMIT = 20 * 60 * 60 * 1000;
    const newCalendarDay = !!merged.dayOf && merged.dayOf !== today;
    const tooOld = merged.startedAt
      ? (Date.now() - merged.startedAt) > AGE_LIMIT
      : newCalendarDay;                  // days saved before this rule existed
    // A sent day stays on screen until the date changes, so they can look at
    // what they sent. An unsent day stays until it is genuinely old.
    if(merged.sentAt ? newCalendarDay : tooOld){
      const fresh = JSON.parse(JSON.stringify(BLANK));
      fresh.me = merged.me;
      fresh.dayOf = today;
      fresh.startedAt = Date.now();
      return fresh;
    }
    merged.dayOf = merged.dayOf || today;
    merged.startedAt = merged.startedAt || Date.now();
    return merged;
  }catch(e){ return null; }
}

/* Who this phone is.

   Kept apart from the day, in its own key, because the day is wiped every
   morning and an identity must not be. A phone signs in once, anonymously -
   no email, no password, nothing to type at 6am - and that identity means
   nothing until a one-time code attaches it to a person at a business.

   Every read and write below carries this session, and the database decides
   what it may see. A phone with no code sees nothing at all, which is the
   answer to "so not anybody can access my name". */

async function ensureSession(){
  if(AUTH.demo) return null;
  const now = Date.now();
  if(AUTH.token && AUTH.expires && now < AUTH.expires - 60000) return AUTH.token;

  // Expired but refreshable - a seller should never be logged out mid-market.
  if(AUTH.refresh){
    try{
      const r = await fetch(CLOUD.url + "/auth/v1/token?grant_type=refresh_token", {
        method:"POST",
        headers:{ "apikey": CLOUD.key, "Content-Type":"application/json" },
        body: JSON.stringify({ refresh_token: AUTH.refresh })
      });
      if(r.ok){
        const d = await r.json();
        AUTH.token = d.access_token; AUTH.refresh = d.refresh_token;
        AUTH.expires = Date.now() + (d.expires_in || 3600) * 1000;
        saveAuth(); return AUTH.token;
      }
    }catch(e){ /* fall through to a new anonymous identity */ }
  }

  try{
    const r = await fetch(CLOUD.url + "/auth/v1/signup", {
      method:"POST",
      headers:{ "apikey": CLOUD.key, "Content-Type":"application/json" },
      body: "{}"
    });
    if(!r.ok) return null;
    const d = await r.json();
    AUTH.token = d.access_token; AUTH.refresh = d.refresh_token;
    AUTH.expires = Date.now() + (d.expires_in || 3600) * 1000;
    saveAuth(); return AUTH.token;
  }catch(e){ return null; }
}

function cloudHeaders(extra){
  return Object.assign({
    "apikey": CLOUD.key,
    "Authorization": "Bearer " + (AUTH.token || CLOUD.key),
    "Content-Type": "application/json"
  }, extra || {});
}

// Turning a code into a person. The database checks it; the app only asks.
async function redeemCode(code){
  const tok = await ensureSession();
  if(!tok) return { ok:false, msg:"No signal. Try again in a moment." };
  try{
    const r = await fetch(CLOUD.url + "/rest/v1/rpc/redeem_code", {
      method:"POST", headers: cloudHeaders(), body: JSON.stringify({ p_code: code })
    });
    const d = await r.json();
    if(!r.ok) return { ok:false, msg: (d && d.message) || "That code did not work." };
    const row = Array.isArray(d) ? d[0] : d;
    if(!row) return { ok:false, msg:"That code did not work." };
    AUTH.business = row.out_business_id;
    AUTH.person   = row.out_person_id;
    AUTH.name     = row.out_person_name;
    AUTH.role     = row.out_role;
    saveAuth();
    return { ok:true };
  }catch(e){
    return { ok:false, msg:"No signal. Try again in a moment." };
  }
}

/* Days that have actually arrived, keyed by market. Null until fetched.

   Once a market day can be real, inventing one is worse than showing
   nothing: the owner cannot tell a made-up number from a reported one,
   and would trust both. So Today shows only what was really sent, and
   says plainly when a market has not reported yet. */
let REAL_DAYS = null;

async function loadRealDays(){
  if(AUTH.demo || !AUTH.business){ REAL_DAYS = REAL_DAYS || {}; return false; }
  try{
    await ensureSession();
    const today = localDay(new Date());
    const res = await fetch(CLOUD.url + "/rest/v1/market_days"
      + "?business_id=eq." + CLOUD.business
      + "&day_date=eq." + today
      + "&select=*,day_counts(product_id,went_out,came_back,samples,damaged)",
      { headers: cloudHeaders() });
    if(!res.ok) throw new Error(String(res.status));
    const rows = await res.json();
    REAL_DAYS = {};
    rows.forEach(r => REAL_DAYS[r.market_id] = r);
    return true;
  }catch(e){
    REAL_DAYS = REAL_DAYS || {};      // an empty answer, not a broken screen
    return false;
  }
}

// What one reported day looks like to the owner's screen.
function dayFromCloud(row, m){
  const counts = row.day_counts || [];
  const sold = counts.reduce((a,c)=>
    a + Math.max(0, c.went_out - c.came_back - c.samples - c.damaged), 0);
  const out  = counts.reduce((a,c)=>a + c.went_out, 0);
  const gross = Number(row.cash) + Number(row.card)
    + (row.other_pays||[]).reduce((a,o)=>a+(Number(o.amount)||0),0)
    + Number(row.spent_from_till);
  const packMoney = gross - (row.chips_sold * CHIPS.price);
  const listPer = PRODUCTS.reduce((a,p)=>a+p.price,0)/PRODUCTS.length;
  return {
    name: row.seller_name || "Nobody assigned",
    phone: null, sold, rev: Math.round(packMoney), out,
    status: "Closed", live: false,
    perPack: sold ? packMoney/sold : null, fullPer: listPer,
    overSend: 0, fixes: 0,
    owed: dayPay(row.seller_id, gross, row.market_id).amount,
    reported: true
  };
}

async function sendDay(){
  if(S.sentAt) return "already";
  if(AUTH.demo || !AUTH.business) return "local";
  try{
    await ensureSession();
    const res = await fetch(CLOUD.url + "/rest/v1/market_days", {
      method: "POST",
      headers: cloudHeaders({ "Prefer": "return=representation" }),
      body: JSON.stringify(dayPayload())
    });
    if(res.status === 409){
      // Same market, same date, already in. Nothing to do and nothing wrong.
      S.sentAt = S.sentAt || new Date().toISOString();
      S.sendError = null;
      save();
      return "sent";
    }
    if(!res.ok) throw new Error("day " + res.status);
    const day = (await res.json())[0];

    const rows = countRows(day.id);
    if(rows.length){
      const r2 = await fetch(CLOUD.url + "/rest/v1/day_counts", {
        method: "POST", headers: cloudHeaders(), body: JSON.stringify(rows)
      });
      if(!r2.ok) throw new Error("counts " + r2.status);
    }
    S.sentAt = new Date().toISOString();
    S.sendError = null;
    save();
    return "sent";
  }catch(e){
    S.sendError = String(e.message || e);
    save();
    return "failed";
  }
}

/* =========================================================
   Helpers
   ========================================================= */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => "$" + Math.round(n).toLocaleString();
const money2 = n => "$" + n.toFixed(2);

/* Everything that came in, however it arrived. Cash, Square and Venmo are the
   three normal channels - they are what gets added on the paper. Anything
   rarer goes in otherPays, because a payment kept in a notes box is a payment
   missing from the total, and every money-per-pack reading would be wrong. */
function moneyIn(){
  return (Number(S.cashCounted)||0) + (Number(S.cardTotal)||0)
       + (S.otherPays||[]).reduce((a,o)=>a+(Number(o.amount)||0), 0);
}

/* A count that cannot be true, caught while the cooler is still open.

   soldByCount clamps at zero, so a typo - 51 back instead of 15 - quietly
   records nothing sold and says nothing. The seller finds out at the very end,
   when the money does not add up, and by then the cooler is packed away and
   they are re-counting from memory. Both businesses named exactly that as the
   worst part of the day.

   Only impossible things are flagged. Nothing here guesses at what a normal
   number looks like - there is no real history to judge that against yet, and
   a wrong guess would train people to ignore the warning. */
function countProblem(pid){
  const op = S.opening[pid] ?? 0;
  const cl = S.closing[pid];
  if(cl === undefined || cl === null || cl === "") return null;
  const back = Number(cl) || 0;
  const extra = (S.samples[pid]||0) + (S.damaged[pid]||0);
  if(back > op) return `${back} back, but only ${op} went out`;
  if(back + extra > op) return `${back} back plus ${extra} sampled or damaged is more than the ${op} that went out`;
  return null;
}
function anyCountProblem(){ return WENT_OUT().some(p => countProblem(p)); }

function soldByCount(pid){
  const op = S.opening[pid] ?? 0, cl = S.closing[pid] ?? 0;
  return Math.max(0, op - cl - (S.samples[pid]||0) - (S.damaged[pid]||0));
}
function openedTotal(){ return P_IDS.reduce((a,p)=>a+(S.opening[p]||0),0); }
function soldTotal(){ return P_IDS.reduce((a,p)=>a+soldByCount(p),0); }
function revenueTotal(){ return P_IDS.reduce((a,p)=>a+soldByCount(p)*prod(p).price,0); }
function expTotal(source){
  return (S.expenses||[]).reduce((a,e)=> a + ((!source || e.source===source) ? (Number(e.amount)||0) : 0), 0);
}
function packedByName(){
  if(!S.packedBy || S.packedBy==="you") return "You";
  const x = slr(S.packedBy);
  return x ? x.name : "You";
}
function packedBySomeoneElse(){ return !!S.packedBy && S.packedBy!=="you"; }
/* Dropping another seller off and collecting them is paid, and it still is
   here. What the app does not do is advertise the rate. A card headed "$10 a
   leg for driving", or a figure ticking up as they pick the option, turns a
   favour into something to chase - and then everybody wants to drop somebody
   off. It gets paid and it shows up in the payout at the end, which is where
   a seller should learn what they earned. */
function driverPay(){
  const t = S.travel || {};
  return t.mode==="van" ? (t.legs||0) * DRIVER_LEG_PAY : 0;
}
// A flat gas allowance for taking your own car. If instead they filled the tank
// themselves, that is a receipt line under "money you spent" - never both, or
// the same gas gets paid twice.
function carAllowance(){
  const t = S.travel || {};
  return (t.mode==="own" && t.gasMode==="flat") ? (Number(t.gasAmount)||0) : 0;
}
const WENT_OUT = () => P_IDS.filter(p => (S.opening[p]||0) > 0);
function countedAll(){ return WENT_OUT().every(p => S.closing[p] !== undefined && S.closing[p] !== null); }

function hoursWorked(m){ return m.sellHrs + 1 + 0.75 + 0.75 + (m.driveMin*2)/60; }

/* How a seller performs at a market, against that market's own average.
   Everything the People tab claims is derived from these. */
/* Prefer what actually got logged at that market. Fall back to the
   model only when this person hasn't worked it enough times yet. */
function observedAtMarket(sid, mid){
  const at = HISTORY.filter(d=>d.marketId===mid);
  const mine = at.filter(d=>d.sellerId===sid);
  if(at.length < 2 || mine.length < 2) return null;
  const avgAll  = at.reduce((a,d)=>a+dayStats(d).sold,0)/at.length;
  const avgMine = mine.reduce((a,d)=>a+dayStats(d).sold,0)/mine.length;
  const revMine = mine.reduce((a,d)=>a+dayStats(d).revenue,0)/mine.length;
  return { pct: avgMine/avgAll - 1, revenue: revMine, n: mine.length };
}
function perfPct(sid, mid){
  const o = observedAtMarket(sid, mid);
  if(o) return o.pct;
  const avg = SELLERS.reduce((a,s)=>a+sellerMult(s.id,mid),0)/SELLERS.length;
  return sellerMult(sid,mid)/avg - 1;
}
function estRevenue(sid, mid){
  const o = observedAtMarket(sid, mid);
  if(o) return o.revenue;
  return 100 * mkt(mid).size * sellerMult(sid,mid) * 12.7;
}
function bestSwap(){
  // Only slots with a real name can be swapped. Fourteen markets have nobody
  // written down, and Thursday is all four of them - suggesting a swap
  // between two blanks is meaningless, and looking one up would crash.
  const plans = TODAY_PLAN.filter(p => p.sellerId && p.sellerId !== "you" && slr(p.sellerId));
  let best = null;
  for(let i=0;i<plans.length;i++){
    for(let j=i+1;j<plans.length;j++){
      const a=plans[i], b=plans[j];
      const now = estRevenue(a.sellerId,a.marketId) + estRevenue(b.sellerId,b.marketId);
      const sw  = estRevenue(a.sellerId,b.marketId) + estRevenue(b.sellerId,a.marketId);
      if(!best || sw-now > best.gain) best = { a, b, gain: sw-now };
    }
  }
  return best;
}
/* What a seller's packs actually bring in, across everything they have sold.
   This replaces counting short tills. With free fifths, invented deals and
   trades all in play, "came up short" was measuring the discount rather than
   the person - and would have called honest sellers thieves on day one. */
function yieldRecord(sid){
  const days  = HISTORY.filter(d=>d.sellerId===sid).map(dayStats);
  const sold  = days.reduce((a,d)=>a+d.sold,0);
  const money = days.reduce((a,d)=>a+d.money_in,0);
  const full  = days.reduce((a,d)=>a+d.revenue,0);
  return { days:days.length, sold, money, full, given:full-money,
           per: sold?money/sold:0, fullPer: sold?full/sold:0 };
}

// The whole crew's money per pack, so one seller can be read against the rest.
function crewYield(){
  const all  = HISTORY.map(dayStats);
  const sold = all.reduce((a,d)=>a+d.sold,0);
  return sold ? all.reduce((a,d)=>a+d.money_in,0)/sold : 0;
}

function dayStats(d){
  const sold = P_IDS.reduce((a,p)=>a+(d.opening[p]-d.closing[p]-d.samples[p]-d.damaged[p]),0);
  const revenue = P_IDS.reduce((a,p)=>a+(d.opening[p]-d.closing[p]-d.samples[p]-d.damaged[p])*prod(p).price,0);
  const money_in = d.cashCounted + d.cardTotal;
  const m = mkt(d.marketId);
  const hrs = hoursWorked(m);
  // What each pack that left the cooler actually brought in. Free fifths,
  // deals the seller made up and trades with other vendors all land here, and
  // both inputs get counted anyway - nobody has to declare anything.
  const yieldPer = sold>0 ? money_in/sold : 0;
  const fullPer  = sold>0 ? revenue/sold  : 0;
  return { sold, revenue, money_in, yieldPer, fullPer, given:revenue-money_in,
           hrs, perHr:(revenue-feeOf(m))/hrs, commission:dayPay(d.sellerId, money_in, d.marketId).amount, opened:P_IDS.reduce((a,p)=>a+d.opening[p],0) };
}

function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("on"),1900);
}
function readImage(file, maxPx, quality, cb){
  const img = new Image();
  img.onload = () => {
    const sc = Math.min(1, maxPx/Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    let data = null;
    try{ data = c.toDataURL("image/jpeg", quality); }catch(err){}
    URL.revokeObjectURL(img.src);
    cb(data);
  };
  img.onerror = () => { toast("Couldn't read that photo"); cb(null); };
  img.src = URL.createObjectURL(file);
}
function buzz(ms){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }

let wakeLock=null;
async function keepAwake(on){
  try{
    if(on && "wakeLock" in navigator && !wakeLock){ wakeLock = await navigator.wakeLock.request("screen"); }
    else if(!on && wakeLock){ wakeLock.release(); wakeLock=null; }
  }catch(e){}
}

    </div>`;
  };
  // One card per kind, so a salsa count never reads as a tamale count.
  const rows = KINDS.map(([k,label])=>{
    const list = TOOK.filter(p=>p.kind===k);

    return `<div class="card">

  return `<div class="pad stack">

      ${S.soldOut===true ? `<div class="field" style="margin-top:8px">

      </div>
      <div class="hint">Good to know &mdash; next week's send list goes up so you're not turning people away.</div>` : ""}
    </div>

    <div class="card">
      <div class="card-hd"><h3>The money</h3><span class="pill">${money2(moneyIn())}</span></div>
      <div class="card-pad stack">
        <div class="field field-money">

          <input id="cash" type="number" inputmode="decimal" placeholder="0" value="${esc(S.cashCounted)}" data-set="cashCounted">
        </div>
        <div class="field field-money">

          <input id="card" type="number" inputmode="decimal" placeholder="0" value="${esc(S.cardTotal)}" data-set="cardTotal">
        </div>

        ${(S.otherPays||[]).map((o,i)=>`

        <div class="field">

              <select id="pass" data-set="passenger">

` : ""}` : ""}

function closeoutMissing(){
  const m = [];
  /* Wrong before blank. A number that cannot be true needs fixing while the
     cooler is still open and the row is still fresh in their head - being sent
     to the next empty box first is how a typo survives to the end of the day. */
  WENT_OUT().forEach(p=>{
    if(countProblem(p)) m.push({ label:prod(p).short+" doesn't add up", sel:"[data-set='closing'][data-p='"+p+"']" });
  });
  WENT_OUT().forEach(p=>{
    const v = S.closing[p];
    if(v===undefined || v===null || v==="")
      m.push({ label:prod(p).short+" count", sel:"[data-set='closing'][data-p='"+p+"']" });
  });
  if(S.soldOut===null) m.push({ label:"did you sell out", sel:"[data-sold='no']" });
  if(S.cashCounted==="") m.push({ label:"cash counted", sel:"#cash" });
  if(S.cardTotal==="")   m.push({ label:"Square total",  sel:"#card" });
  if(S.chipsSold==="")   m.push({ label:"chips sold",    sel:"#chips" });
  return m;
}
function foot_closeout(){
  const miss = closeoutMissing();
  if(!miss.length){
    return `<button class="btn" data-go="result">Send it in</button>
            <button class="btn btn-quiet" data-go="market">Back</button>`;
  }
  const first = miss[0];
  return `<button class="btn btn-ghost" data-act="jump" data-sel="${first.sel}">
            <span>${miss.length} left &mdash; next: ${esc(first.label)}</span>
          </button>
          <button class="btn btn-quiet" data-go="market">Back</button>`;
}

function scr_result(){
  const sold = soldTotal();
  const rev = revenueTotal();
  const cash = Number(S.cashCounted)||0, card = Number(S.cardTotal)||0;
  const otherPay = (S.otherPays||[]).reduce((a,o)=>a+(Number(o.amount)||0), 0);
  const disc = Number(S.discounts)||0;
  const fromTill = expTotal("till");   // spent out of the register: the till is legitimately light
  const fromOwn  = expTotal("own");    // fronted by the seller: the shop owes it back
  const drivePay = driverPay();
  const inHand = moneyIn();
  const dayTook = inHand + fromTill;             // everything the day sold
  const pay = dayPay(S.me, dayTook, MY_MARKET.id);
  const commission = pay.amount;
  const carGas = carAllowance();
  const owed = commission + drivePay + fromOwn + carGas;
  const returning = P_IDS.reduce((a,p)=>a+(S.closing[p]||0),0);
  const samples = P_IDS.reduce((a,p)=>a+(S.samples[p]||0),0);
  const sampleValue = P_IDS.reduce((a,p)=>a+(S.samples[p]||0)*prod(p).price,0);

  /* Money per pack, not a shortfall. Anything spent out of the till was still
     collected, so it counts as money in. What is left of full price is what got
     given away to make the sale - free ones, deals the seller made up, trades
     with another vendor. None of that is provable from a count, and the owner
     does not chase it, so the app reports the number and passes no verdict.
     Only a genuinely broken figure - a miscount, a lost envelope - is flagged. */
  const gross      = dayTook;
  /* Chips are not counted stock, so their takings must come out before the
     packs are divided into the money. Left in, every pack would look like it
     brought in more than $15 and the number would stop meaning anything. */
  const packMoney  = gross - chipMoney();
  const perPack    = sold>0 ? packMoney/sold : 0;
  const fullPack   = sold>0 ? rev/sold   : 0;
  const given      = rev - packMoney;
  const tooLow  = sold>0 && perPack < fullPack*0.55;
  const tooHigh = sold>0 && packMoney > rev + 6;
  const broken  = tooLow || tooHigh;
  const vClass  = broken ? "bad" : "good";
  const vLabel  = broken ? "Worth a recount" : "Logged";

  return `<div class="pad stack">
    <div>
      <div class="lbl">${esc(fmtDate(TODAY))} \u00B7 ${esc(MY_MARKET.name)}</div>
      <h1 class="page" style="margin-top:6px">Day's done</h1>
    </div>

    <div class="card">
      <div class="card-pad">
        <div class="lbl">The shop owes you</div>
        <div class="big" style="margin-top:8px">${money2(owed)}</div>
        <p class="note" style="margin-top:8px">${sold} items sold at ${esc(MY_MARKET.name)}</p>
      </div>
      <div class="card-pad" style="padding-top:0">
        ${pay.kind === "commission"
          ? `<div class="kv"><span class="kv-k">Commission &mdash; ${Math.round(pay.rate*100)}% of ${money2(dayTook)}</span><span class="kv-v">${money2(pay.commission)}</span></div>`
          : `<div class="kv"><span class="kv-k">Your day rate</span><span class="kv-v">${money2(pay.base)}</span></div>
             <div class="kv"><span class="kv-k" style="color:var(--muted)">${Math.round(pay.rate*100)}% would have been ${money2(pay.commission)}</span><span class="kv-v" style="color:var(--muted)">&mdash;</span></div>`}
        ${drivePay ? `<div class="kv"><span class="kv-k">Driving${S.travel.passenger?` &mdash; ${esc((slr(S.travel.passenger)||{}).name||"")}`:""}${S.travel.legs===2?" both ways":" one way"}</span><span class="kv-v">${money2(drivePay)}</span></div>` : ""}
        ${carGas ? `<div class="kv"><span class="kv-k">Gas for your own car</span><span class="kv-v">${money2(carGas)}</span></div>` : ""}
        ${fromOwn ? `<div class="kv"><span class="kv-k">Paid back for what you fronted</span><span class="kv-v">${money2(fromOwn)}</span></div>` : ""}
        <div class="kv kv-total"><span class="kv-k">Total</span><span class="kv-v">${money2(owed)}</span></div>
      </div>
    </div>
    ${fromOwn ? `<div class="hint">The ${money2(fromOwn)} you fronted is on top of your commission &mdash; that's money back, not pay.</div>` : ""}

    <div class="card stripe stripe-${vClass}">
      <div class="card-hd"><h3>The money you took</h3><span class="pill pill-${vClass}">${esc(vLabel)}</span></div>
      <div class="card-pad">
        <div class="big">${money2(gross)}</div>
        <p class="note" style="margin-top:8px">across ${sold} items sold</p>
      </div>
      <div class="card-pad" style="padding-top:0">
        <div class="kv"><span class="kv-k">Cash taken</span><span class="kv-v">${money2(cash)}</span></div>
        <div class="kv"><span class="kv-k">Square</span><span class="kv-v">${money2(card)}</span></div>
        ${(S.otherPays||[]).filter(o=>Number(o.amount)).map(o=>`<div class="kv"><span class="kv-k">${esc(o.how||"Other")}</span><span class="kv-v">${money2(Number(o.amount)||0)}</span></div>`).join("")}
        ${fromTill ? `<div class="kv"><span class="kv-k">Spent out of the till</span><span class="kv-v">${money2(fromTill)}</span></div>` : ""}
        <div class="kv kv-total"><span class="kv-k">Brought in</span><span class="kv-v">${money2(gross)}</span></div>
      </div>
    </div>

    ${tooHigh
      ? `<div class="hint"><b>There is more money here than the count explains.</b> About ${money2(Math.abs(given))} more, which usually means a flavour got counted wrong or more chips went out than were written down. Worth a second look.</div>`
      : tooLow
      ? `<div class="hint"><b>That does not look right.</b> The money is a long way below what ${sold} items normally bring in, so it is probably a miscount or cash still in a pocket. Worth a second look.</div>`
      : ""}

    <div class="tiles">
      <div class="tile"><div class="lbl">Going back</div><div class="mid">${returning}</div><div class="tile-sub">to the freezer</div></div>
      <div class="tile"><div class="lbl">Chips</div><div class="mid">${chipsSold()}</div><div class="tile-sub">bags sold</div></div>
      <div class="tile"><div class="lbl">Samples</div><div class="mid">${samples}</div><div class="tile-sub">${money2(sampleValue)} given</div></div>
      <div class="tile"><div class="lbl">Sell-through</div><div class="mid">${openedTotal()>0?Math.round(sold/openedTotal()*100):0}%</div><div class="tile-sub">of what you took</div></div>
    </div>

    <div class="card card-pad stack-sm stripe stripe-${S.sentAt || AUTH.demo ? "good" : "warn"}">
      <div class="spread">
        <div class="lbl">${AUTH.demo ? "Nothing sent \u2014 just a look" : S.sentAt ? "Sent to the shop" : "Waiting for signal"}</div>
        ${S.sentAt || AUTH.demo ? "" : `<button class="btn btn-quiet btn-sm" data-act="retry-send">Try again</button>`}
      </div>
      <p class="note">${AUTH.demo
        ? "This is the look-around version, so nothing left this phone. On a real phone this day would already be with Nawid."
        : S.sentAt
        ? "Nawid has this day. The counts, the money and your notes went up on their own \u2014 nobody has to retype anything."
        : "Saved on your phone. It goes on its own as soon as you have signal, even if you close the app. Nothing is lost."}</p>
      <div class="chips" style="margin-top:4px">
        ${WENT_OUT().map(pid=>`<span class="chip">${esc(prod(pid).short)} ${soldByCount(pid)} sold \u00B7 ${S.closing[pid]||0} back</span>`).join("")}
      </div>
    </div>

    <div class="card stripe stripe-good">
      <div class="card-hd">
        <div><h3>Sent in</h3><div class="sub" style="margin-top:3px">${esc(S.submittedAt||"")}</div></div>
        <span class="pill pill-good">Locked</span>
      </div>
      <div class="card-pad stack-sm">
        <p class="note">These numbers are final. Nothing in here can be quietly changed now.</p>
        ${S.corrections.length ? `<div class="chips">${S.corrections.map(c=>`<span class="chip chip-hi">fix asked ${esc(c.at)}</span>`).join("")}</div>` : ""}
        ${S.showFix
          ? `<div class="field" style="margin-top:6px">
               <label class="lbl" for="fixBox">What's wrong?</label>
               <textarea id="fixBox" placeholder="Counted 15 chicken but wrote 51"></textarea>
             </div>
             <div class="row" style="gap:8px">
               <button class="btn btn-sm" data-act="fix-send" style="flex:2">Ask the shop to fix it</button>
               <button class="btn btn-quiet btn-sm" data-act="toggle" data-flag="showFix" style="flex:1">Cancel</button>
             </div>
             <div class="hint">The shop sees what you first sent <b>and</b> what you're asking to change. Nothing gets overwritten.</div>`
          : `<button class="btn btn-quiet" data-act="toggle" data-flag="showFix">Something's wrong with these numbers</button>`}
      </div>
    </div>

    <div style="text-align:center;padding-top:10px">
      <button class="btn btn-quiet" data-act="reset" style="width:auto;margin:0 auto;opacity:.65">Demo: start a fresh day</button>
      <p class="note" style="margin-top:7px;font-size:11px">Demo control only. The real app has no way to redo a day.</p>
    </div>
  </div>`;
}

function liveDay(plan){
  const reported = REAL_DAYS && REAL_DAYS[plan.marketId];
  if(reported) return dayFromCloud(reported, mkt(plan.marketId));

  // The day being counted on this very phone, if the owner also sells today.
  if(plan.sellerId && S.me && plan.sellerId === S.me && plan.marketId === MY_MARKET.id){
    const closed = S.screen==="result";
    let status = "Not started";
    if(closed) status="Closed";
    else if(S.photo) status="Set up "+(S.arrivedAt||"");
    else if(openedTotal()>0) status="Loaded";
    return { name:"You", phone:null, sold: closed?soldTotal():null, rev: closed?revenueTotal():null,
             status, live:!closed && !!S.photo, perPack:null, fullPer:null, out:openedTotal(),
             overSend: openedTotal() ? openedTotal()-MY_REC.total : 0,
             fixes: S.corrections.length,
             packedByOther: (openedTotal() && packedBySomeoneElse()) ? packedByName() : null,
             owed: closed ? (dayPay(S.me, moneyIn()+expTotal("till"), MY_MARKET.id).amount + driverPay() + expTotal("own") + carAllowance()) : 0 };
  }
  const m = mkt(plan.marketId), s = slr(plan.sellerId);

  const real = REAL_DAYS && REAL_DAYS[plan.marketId];
  if(real) return dayFromCloud(real, m);
  if(REAL_DAYS){
    // We have looked, and this market has not sent anything in. Say that,
    // rather than dressing a guess up as a closed day.
    return { name: s ? s.name : "Nobody assigned", phone:null, sold:null, rev:null,
             out: recommendMarket(plan.marketId).total,
             status: s ? "Not reported yet" : "No name yet",
             live:false, perPack:null, fullPer:null, overSend:0, fixes:0, owed:0,
             unassigned: !s };
  }

  if(!s){
    // Nobody written down for this slot. It still runs - the owner needs to
    // see the gap rather than have the market quietly vanish off Today.
    return { name:"Nobody assigned", phone:null, sold:null, rev:null,
             out:recommendMarket(plan.marketId).total, status:"No name yet",
             live:false, perPack:null, fullPer:null, overSend:0, fixes:0, owed:0,
             unassigned:true };
  }
  const seed = mulberry32(plan.marketId.length*977 + plan.sellerId.length*31 + 7);
  const done = plan.status==="done";
  const sold = done ? Math.round(100*m.size*sellerMult(plan.sellerId,plan.marketId)*(0.95+seed()*0.12)) : null;
  // Money actually in, not list value: whatever this seller gives away -
  // free ones, their own deals, trades - comes straight off it.
  const listPer = PRODUCTS.reduce((a,p)=>a+p.price,0)/PRODUCTS.length;
  const rev = done ? Math.round(sold*listPer*(1-s.giveRate)) : null;
  const sendListQty = recommendMarket(plan.marketId).total;
  // sellers normally take exactly what the send list says; deviations should be rare enough to mean something
  const out = sendListQty;
  const hash = [...plan.marketId].reduce((a,c)=>a+c.charCodeAt(0),0);
  const setupAt = ["7:12am","6:38am","7:41am","7:26am","6:52am"][hash % 5];
  const sendList = sendListQty;
  return { name:s.name, phone:null, sold, rev, out,
           status: done ? "Closed" : "Set up "+setupAt,
           live: !done, perPack: done ? rev/sold : null, fullPer: listPer,
           overSend: out - sendList, fixes:0,
           owed: done ? dayPay(plan.sellerId, rev, plan.marketId).amount : 0 };
}
