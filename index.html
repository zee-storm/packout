*{box-sizing:border-box}

body{

button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-lit);outline-offset:2px;border-radius:6px}

.shell{max-width:520px;margin:0 auto;padding:0 0 108px}

.modesw{

}
.modesw[hidden]{display:none}
.modesw button{

.pad{padding:18px 16px}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-sm{display:flex;flex-direction:column;gap:8px}
.crewlist{display:flex;flex-direction:column}
.crewrow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;

font:inherit;color:inherit;text-align:left;cursor:pointer}
.crewrow:first-child{border-top:0}
.crewrow-l{display:flex;flex-direction:column;gap:2px;min-width:0}
.pill-wrap{white-space:normal;text-align:left}
.mrow{padding:10px 14px;border-bottom:1px solid var(--glass-line-2)}
.mrow:last-child{border-bottom:0}
.frow{display:grid;grid-template-columns:minmax(0,1fr) 92px 30px;gap:10px;align-items:center;padding:6px 14px;font-size:13px}
.frow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.crewmkt{padding:10px 0;border-top:1px solid var(--line)}
.crewmkt:first-of-type{border-top:0}
.bigcode{font-size:34px;font-weight:700;letter-spacing:.14em;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.row-b{display:flex;align-items:baseline;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grow{flex:1;min-width:0}
.card,.tile,.tap,.ticker,.insight,.toast,.tap-out{
-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
}
.card{
position:relative;
background:var(--glass);
border:1px solid var(--glass-line);
border-radius:var(--r-lg);
box-shadow:var(--shadow),var(--rim);
overflow:hidden;
}
.card::before,.tile::before{
content:"";position:absolute;left:0;right:0;top:0;height:50%;
pointer-events:none;background:linear-gradient(180deg,var(--lens),transparent);
}
.card>*,.tile>*{position:relative}
.card-pad{padding:16px}
.card-hd{
padding:13px 16px;border-bottom:1px solid var(--glass-line-2);
display:flex;align-items:center;justify-content:space-between;
gap:8px 10px;flex-wrap:wrap;
}
.card-hd h3{
margin:0;font-family:var(--f-display);font-size:16px;font-weight:600;
letter-spacing:-.018em;flex:1 1 auto;min-width:0;
}
.card-hd .pill{flex:0 1 auto;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.stripe{border-left:3px solid var(--glass-line)}
.stripe-good{border-left-color:var(--good)}
.stripe-warn{border-left-color:var(--warn)}
.stripe-bad{border-left-color:var(--bad)}
.stripe-live{border-left-color:var(--accent)}
.alert-card{
background:var(--ember-soft);border:1.5px solid var(--ember);border-left-width:6px;
border-radius:var(--r);padding:16px 16px 15px;display:flex;flex-direction:column;gap:10px;
}
.alert-card .lbl{color:var(--ember)}
.alert-card .alert-title{font-family:var(--f-display);font-size:21px;font-weight:650;line-height:1.2;color:var(--ink)}
.alert-card .note{color:var(--ink)}
.pill{
display:inline-flex;align-items:center;gap:5px;
font-family:var(--f-num);font-size:9px;font-weight:500;
letter-spacing:.12em;text-transform:uppercase;
padding:4px 9px;border-radius:999px;

border:1px solid var(--glass-line-2);white-space:nowrap;
}
.pill-good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill-warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill-bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill-live{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill-live .dot{animation:blip 1.8s ease-in-out infinite;box-shadow:0 0 8px currentColor}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.22}}
h1.page{
margin:0;font-family:var(--f-display);
font-size:33px;font-weight:700;line-height:1.03;
letter-spacing:-.032em;text-wrap:balance;
}
h2.sec{
margin:0;font-family:var(--f-num);font-size:9.5px;font-weight:500;
letter-spacing:.15em;text-transform:uppercase;color:var(--muted);
}
p.note{margin:0;color:var(--muted);font-size:13.5px;line-height:1.5}
.big{font-weight:600;font-size:38px;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.mid{font-weight:600;font-size:24px;letter-spacing:-.032em;line-height:1;font-variant-numeric:tabular-nums}
.btn{
display:flex;align-items:center;justify-content:center;gap:8px;
width:100%;border:1px solid transparent;cursor:pointer;
background:linear-gradient(180deg,var(--accent-lit),var(--accent));
color:var(--accent-ink);
font-size:15.5px;font-weight:600;letter-spacing:-.014em;
padding:17px;border-radius:var(--r);min-height:56px;
box-shadow:
inset 0 1px 0 rgba(255,255,255,.36),
0 1px 2px rgba(0,0,0,.20),
0 12px 26px -14px var(--accent);
transition:transform .12s ease,box-shadow .18s ease,filter .18s ease;
}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(1px) scale(.995)}
.btn[disabled]{
background:var(--glass-3);color:var(--muted);
border-color:var(--glass-line-2);cursor:not-allowed;
box-shadow:var(--rim);
-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
}
.btn[disabled]:hover{filter:none}
.btn[disabled]:active{transform:none}
.btn-ghost{
background:var(--glass);color:var(--ink);
border:1px solid var(--glass-line);
box-shadow:var(--shadow),var(--rim);
-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
}
.btn-ghost:hover{filter:none;background:var(--glass-2)}
.btn-quiet{
background:transparent;color:var(--muted);
border:1px solid var(--glass-line);
min-height:46px;font-size:13px;font-weight:600;padding:11px;box-shadow:none;
}
.btn-quiet:hover{filter:none;color:var(--ink-2)}
.btn-sm{min-height:42px;padding:10px 16px;font-size:13px;width:auto}
.sticky-foot{
position:fixed;left:0;right:0;bottom:0;z-index:40;
padding:22px calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
pointer-events:none;
}
.sticky-foot::before{
content:"";position:absolute;inset:0;pointer-events:none;
background:linear-gradient(to top,var(--chrome),transparent);
-webkit-backdrop-filter:var(--blur-lg);backdrop-filter:var(--blur-lg);
-webkit-mask-image:linear-gradient(to top,#000 56%,transparent);
mask-image:linear-gradient(to top,#000 56%,transparent);
}
.sticky-foot-in{
position:relative;pointer-events:auto;
max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:9px;
}
.step-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--glass-line-2)}
.step-row:last-child{border-bottom:0}
.step-name{font-weight:600;font-size:15.5px;letter-spacing:-.018em}
.step-sub{font-family:var(--f-num);font-size:9.5px;color:var(--muted);letter-spacing:.07em;margin-top:3px}
.stepper{display:flex;align-items:center;flex:none}
.stepper button{
width:44px;height:46px;border:1px solid var(--glass-line);
background:var(--glass-3);font-size:19px;font-weight:500;cursor:pointer;color:var(--ink);
display:flex;align-items:center;justify-content:center;
box-shadow:var(--rim);transition:background .15s;
}
.stepper button:hover{background:var(--glass-2)}
.stepper button:active{background:var(--accent-soft)}
.stepper button:first-child{border-radius:var(--r-sm) 0 0 var(--r-sm)}
.stepper button:last-child{border-radius:0 var(--r-sm) var(--r-sm) 0}
.stepper input{
width:62px;height:46px;text-align:center;
border:1px solid var(--glass-line);border-left:0;border-right:0;
background:var(--glass);color:var(--ink);
font-family:var(--f-ui);font-weight:600;font-size:19px;
font-variant-numeric:tabular-nums;letter-spacing:-.022em;
-moz-appearance:textfield;box-shadow:var(--rim);
}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.tap{
position:relative;width:100%;
border:1px solid var(--glass-line);
background:var(--glass);color:var(--ink);
border-radius:var(--r-lg);padding:18px 20px;cursor:pointer;
display:flex;align-items:center;justify-content:space-between;gap:14px;
min-height:100px;text-align:left;
box-shadow:var(--shadow),var(--rim);
touch-action:manipulation;-webkit-tap-highlight-color:transparent;
transition:background .15s,border-color .15s,transform .1s;
}
.tap:active{background:var(--accent-soft);border-color:var(--accent);transform:scale(.99)}
.tap-name{font-size:19px;font-weight:600;letter-spacing:-.024em;line-height:1.15}
.tap-left{font-family:var(--f-num);font-size:9.5px;letter-spacing:.09em;color:var(--muted);margin-top:6px}
.tap-count{font-size:44px;font-weight:600;letter-spacing:-.048em;line-height:1;font-variant-numeric:tabular-nums}
.tap-out{
position:absolute;inset:0;border-radius:var(--r-lg);
background:var(--bad-soft);color:var(--bad);
display:flex;align-items:center;justify-content:center;
font-weight:600;font-size:15px;letter-spacing:-.012em;
}
.ticker{
display:grid;grid-template-columns:1fr 1fr 1fr;

border-radius:var(--r-lg);box-shadow:var(--shadow),var(--rim);overflow:hidden;
}
.ticker div{padding:13px 14px;border-right:1px solid var(--glass-line-2)}
.ticker div:last-child{border-right:0}
.ticker .mid{margin-top:5px}
.kv{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--glass-line-2)}
.kv:last-child{border-bottom:0}
.kv-k{font-size:13.5px;color:var(--ink-2)}
.kv-v{font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.018em}
.kv-total{border-top:1px solid var(--glass-line);border-bottom:0;margin-top:5px;padding-top:13px}
.kv-total .kv-k{font-weight:600;font-size:14.5px;color:var(--ink)}
.kv-total .kv-v{font-size:22px;letter-spacing:-.03em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
font-family:var(--f-num);font-size:10px;font-weight:400;

background:var(--glass-3);color:var(--ink-2);
border:1px solid var(--glass-line-2);

}
.chip-hi{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:500}
.field{display:flex;flex-direction:column;gap:7px}
.field input,.field textarea,.field select,.inp{

.field textarea{min-height:106px;resize:vertical;line-height:1.5}
.inp-sm{padding:12px 12px;font-size:15px;border-radius:var(--r-xs)}
.field-money{position:relative}
.field-money input{padding-left:32px}

content:"$";position:absolute;left:15px;top:40px;

.tabs{

-webkit-backdrop-filter:var(--blur-lg);backdrop-filter:var(--blur-lg);

}
.tabs::-webkit-scrollbar{display:none}
.tabs-in{display:flex;gap:4px;max-width:1000px;margin:0 auto;width:100%;

.tabs button{

}

content:"";position:absolute;left:10px;right:10px;bottom:0;height:2px;
border-radius:2px 2px 0 0;background:transparent;transition:background .18s;
}
.tabs button:hover{color:var(--ink-2)}
.tabs button[aria-pressed="true"]{color:var(--ink)}
.tabs button[aria-pressed="true"]::after{background:var(--accent);box-shadow:0 0 12px var(--accent)}
.grid{display:grid;gap:13px;grid-template-columns:1fr}
@media(min-width:720px){.grid-2{grid-template-columns:1fr 1fr}}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}

.tile{
position:relative;overflow:hidden;

th{

th.n{text-align:right}
.who{font-weight:600;letter-spacing:-.018em}
.sub{font-family:var(--f-num);font-size:9.5px;letter-spacing:.07em;color:var(--muted);margin-top:2px}
.delta{font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums;letter-spacing:-.012em}
.up{color:var(--good)}
.down{color:var(--bad)}
.insight{
background:var(--accent-soft);

.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13.5px}
.toast{

function sameSheet(row, payload, counts){
const near = (a, b) => Math.abs((Number(a) || 0) - (Number(b) || 0)) < 0.015;
const others = list => (list || []).reduce((t, o) => t + (Number(o.amount) || 0), 0);

if(f in payload && f in row && !near(row[f], payload[f])) return false;
}
if(!near(others(row.other_pays), others(payload.other_pays))) return false;
if(String(row.note || "").trim() !== String(payload.note || "").trim()) return false;
const have = row.day_counts || [];
if(have.length){
const line = c => [c.product_id, Number(c.went_out) || 0, Number(c.came_back) || 0, Number(c.samples) || 0, Number(c.damaged) || 0].join(":");
if(have.map(line).sort().join("|") !== (counts || []).map(line).sort().join("|")) return false;
}
return true;
}

function bestSwap(){

  let best = null;

    for(let j=i+1;j<plans.length;j++){
      const a=plans[i], b=plans[j];
      const now = estRevenue(a.sellerId,a.marketId) + estRevenue(b.sellerId,b.marketId);
      const sw  = estRevenue(a.sellerId,b.marketId) + estRevenue(b.sellerId,a.marketId);

function readImage(file, maxPx, quality, cb){
  const img = new Image();
  img.onload = () => {
    const sc = Math.min(1, maxPx/Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    let data = null;
    try{ data = c.toDataURL("image/jpeg", quality); }catch(err){}
    URL.revokeObjectURL(img.src);
    if(!data) toast("Couldn't read that photo");
    cb(data);
  };
  img.onerror = () => { toast("Couldn't read that photo"); cb(null); };
  img.src = URL.createObjectURL(file);
}

const MONEY_MAX = 20000, COUNT_MAX = 5000;
function numberProblems(){
  const m = [];
  const money = (label, raw, sel) => {
    if(raw === "" || raw === null || raw === undefined) return;
    const v = Number(raw);
    if(!Number.isFinite(v)) m.push({ label: label + " isn't a number", sel });
    else if(v < 0) m.push({ label: label + " can't be below $0", sel });
    else if(v > MONEY_MAX) m.push({ label: label + " looks too big — check it", sel });
  };
  money("Cash", S.cashCounted, "#cash");
  money("Square", S.cardTotal, "#card");
  (S.otherPays || []).forEach((o, i) =>
    money(String(o.how || "Other payment").trim().slice(0, 24) || "Other payment", o.amount, `[data-pay='${i}'][data-f='amount']`));
  (S.expenses || []).forEach((e, i) =>
    money(String(e.kind || "Expense").trim().slice(0, 24) || "Expense", e.amount, `[data-exp='${i}'][data-f='amount']`));
  money("Discounts", S.discounts, "#disc");
  const t = S.travel || {};
  if(t.mode === "own" && t.gasMode === "flat") money("Gas", t.gasAmount, "#gasamt");
  if(S.chipsSold !== "" && S.chipsSold !== null && S.chipsSold !== undefined){
    const c = Number(S.chipsSold);
    if(!Number.isFinite(c) || c < 0 || !Number.isInteger(c)) m.push({ label:"chips has to be a whole number", sel:"#chips" });
    else if(c > COUNT_MAX) m.push({ label:"chips looks too big — check it", sel:"#chips" });
  }
  WENT_OUT().forEach(p => {
    if((S.opening[p] || 0) > COUNT_MAX)
      m.push({ label: prod(p).short + " went out looks too big", sel:"[data-set='closing'][data-p='" + p + "']" });
  });

}

function earlierNotices(){
  if(AUTH.demo) return "";
  const { fixes, seconds, days } = REAL_EARLIER;
  if(!REAL_EARLIER_OK) return `<p class="note" style="font-size:12.5px">Couldn't check for fixes or second sheets from earlier days.</p>`;
  if(!fixes.length && !seconds.length) return "";
  const dayName = iso => new Date(iso + "T12:00:00").toLocaleDateString(undefined, { weekday:"long", month:"short", day:"numeric" });
  const marketName = id => (mkt(id) || {}).name || id;
  const slots = [];
  fixes.forEach(f => { const k = f.day_date + "|" + f.market_id; if(!slots.includes(k)) slots.push(k); });
  seconds.forEach(x => { const k = x.day_date + "|" + x.market_id; if(!slots.includes(k)) slots.push(k); });
  slots.sort((a, b) => a < b ? 1 : a > b ? -1 : 0);
  return `<h2 class="sec">From earlier days</h2>
    <div class="stack-sm">${slots.map(k => {
      const [date, mid] = k.split("|");
      const fx = fixes.filter(f => f.day_date === date && f.market_id === mid);
      const sx = seconds.filter(x => x.day_date === date && x.market_id === mid);
      const first = days[mid + "|" + date];
      return `<div class="card stripe stripe-warn">
        <div class="card-pad stack-sm">
          <div class="spread"><div><h3>${esc(marketName(mid))}</h3><div class="sub" style="margin-top:3px">${esc(dayName(date))}</div></div>

        </div>
        ${sx.length ? (first
          ? compareSheets(sx, first, soldOfCounts(first.day_counts), true)

      </div>`;
    }).join("")}</div>`;

const CREW_DEAD_CODE = "Your code has stopped working on this phone, so nothing can be changed. It isn't your signal - type a new code.";
async function crewWrite(method, path, body, mustTouch){
  const tok = await ensureSession();
  if(!tok) return { ok:false, msg: AUTH.signinBroken ? CREW_DEAD_CODE : "No signal. Nothing was changed - try again in a moment." };
  try{
    const send = () => fetch(CLOUD.url + "/rest/v1/" + path, {
      method,
      headers: Object.assign({}, cloudHeaders(), { "Content-Type":"application/json", "Prefer":"return=representation" }),
      body: body === undefined ? undefined : JSON.stringify(body)
    });
    let r = await send();
    if(r.status === 401){ AUTH.expires = 0; if(await ensureSession()) r = await send(); }
    if(r.ok){
      const rows = r.status === 204 ? [] : await r.json().catch(()=>[]);
      if(mustTouch && Array.isArray(rows) && !rows.length)
        return { ok:false, msg:"The shop's system didn't take that. Nothing was changed." };
      return { ok:true, rows };
    }
    if(r.status === 401 || r.status === 403)
      return { ok:false, msg: AUTH.signinBroken ? CREW_DEAD_CODE
        : "The shop's system wouldn't let this phone change that. This phone may no longer be signed in as an owner. Nothing was changed." };
    if(r.status === 409)
      return { ok:false, msg:"That is already there." };
    return { ok:false, msg:"The shop's system turned it away (" + r.status + "). Nothing was changed." };
  }catch(e){
    return { ok:false, unsure:true, msg:"The signal dropped before the shop answered. What you see now is what the shop has - check it before trying again." };
  }
}
function crewFirstAt(mid){
  const at = CREW.crew.filter(x => x.market_id === mid)

  return at.length ? at[0].person_id : null;
}
function crewPayProblem(base, pct){
  if(base !== null && (!isFinite(base) || base < 0 || base > 2000)) return "A day rate has to be between $0 and $2,000.";
  if(pct !== null && (!isFinite(pct) || pct < 0 || pct > 100)) return "A percent has to be between 0 and 100.";
  if(pct !== null && pct > 0 && pct < 1) return "Type the percent as a whole number: 22 for 22%. " + pct + " would pay less than 1%.";
  return "";
}

function lastWeekRange(){

const to = new Date(from); to.setDate(from.getDate() + 6);

cur = after;
}
while(cur){ const after = cur.nextSibling; from.removeChild(cur); cur = after; }
}
function morphNode(a, b){
if(a.nodeType !== 1){ if(a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue; return; }
for(const at of [...b.attributes]) if(a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value);
for(const at of [...a.attributes]) if(!b.hasAttribute(at.name)) a.removeAttribute(at.name);
const busy = a === document.activeElement;
const tag = a.nodeName;
if(tag === "INPUT"){
if(busy || a.type === "file") return;
if(a.type === "checkbox" || a.type === "radio") a.checked = b.hasAttribute("checked");
else { const v = b.getAttribute("value") ?? ""; if(a.value !== v) a.value = v; }
return;
}
if(tag === "TEXTAREA"){
if(!busy){ const v = b.textContent; if(a.value !== v) a.value = v; }
return;
}
if(tag === "SELECT"){
const opt = b.querySelector("option[selected]") || b.querySelector("option");
const want = opt ? (opt.getAttribute("value") ?? opt.textContent) : "";
morphChildren(a, b);
if(!busy && a.value !== want) a.value = want;
return;
}
morphChildren(a, b);
}
